function ProfilingView() {
  const { data, retireRecord, restoreRecord, openDdlForm, canEdit, stewardIdentity, isMaster } = useApp();
  const accent = 'var(--purple)';

  const myStewardCdsIds = useMemo(() => getMyStewardCdsIds(data, stewardIdentity), [data, stewardIdentity]);

  const [myDataOnly, setMyDataOnly] = useState(() => loadMyDataPref('moj_dq_profiling_scope_v1', isMaster));
  useEffect(() => { saveMyDataPref('moj_dq_profiling_scope_v1', myDataOnly); }, [myDataOnly]);

  const [search,       setSearch]       = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [showExtras,   setShowExtras]   = useState(false);

  // SQL heuristic dismissals (Task 13)
  const [dismissedKeys, setDismissedKeys] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('moj_dq_profiling_dismiss_v1') || '[]')); }
    catch { return new Set(); }
  });
  const handleDismiss = (key) => {
    setDismissedKeys(prev => {
      const next = new Set(prev);
      next.add(key);
      try { localStorage.setItem('moj_dq_profiling_dismiss_v1', JSON.stringify([...next])); }
      catch {}
      return next;
    });
  };

  // Profiling slide-in panel state (Task 9)
  const [profilingPanel, setProfilingPanel] = useState(null);

  const dimensions = useMemo(() =>
    (data?.quality_dimension || [])
      .filter(d => !d.retiring_timestamp)
      .sort((a, b) => a.quality_dimension_id - b.quality_dimension_id),
  [data]);

  const scopeCdsIds = (myDataOnly && myStewardCdsIds) ? myStewardCdsIds : null;

  // Build agenda (Task 3)
  const tableGroups = useMemo(() => {
    if (!data) return [];
    return buildProfilingAgenda({
      cdes:          data.critical_data_element        || [],
      rules:         data.data_quality_rule            || [],
      allocs:        data.data_quality_rule_allocation || [],
      fieldProfiling: data.field_profiling             || [],
      ddls:          data.source_table_ddl             || [],
      dimensions,
      scopeCdsIds,
    });
  }, [data, dimensions, scopeCdsIds]);

  const orphanDdls = useMemo(() => {
    if (!data) return [];
    const agendaKeys = new Set(tableGroups.map(tg => tg.tableKey));
    return (data.source_table_ddl || []).filter(d =>
      !d.retiring_timestamp &&
      !agendaKeys.has(`${d.source_database_name}|||${d.source_table_name}`)
    );
  }, [tableGroups, data]);

  // Filter (Tasks 12, search)
  const filteredGroups = useMemo(() => {
    let groups = tableGroups;

    if (search.trim()) {
      const q = search.toLowerCase();
      groups = groups
        .map(tg => {
          const matchesHeader = tg.table.toLowerCase().includes(q) ||
            (tg.db || '').toLowerCase().includes(q);
          if (matchesHeader) return tg;
          const fields = tg.fields.filter(f => f.field.toLowerCase().includes(q));
          if (fields.length === 0) return null;
          return { ...tg, fields };
        })
        .filter(Boolean);
    }

    if (statusFilter !== 'all') {
      groups = groups.map(tg => {
        if (statusFilter === 'needs_ddl') return !tg.ddl ? tg : null;
        let fields = tg.fields;
        if      (statusFilter === 'needs_profiling') fields = fields.filter(f => !f.profiling);
        else if (statusFilter === 'rules_blind')     fields = fields.filter(f => !f.profiling && f.ruleCount > 0);
        else if (statusFilter === 'profiled')        fields = fields.filter(f =>  f.profiling);
        if (fields.length === 0) return null;
        return { ...tg, fields };
      }).filter(Boolean);
    }

    return groups;
  }, [tableGroups, search, statusFilter]);

  const totalTables = tableGroups.length;
  const totalFields = tableGroups.reduce((s, tg) => s + tg.fields.length, 0);

  const stats = useMemo(() => {
    const tableProfiled = tableGroups.filter(tg =>  tg.ddl).length;
    const tablePending  = tableGroups.filter(tg => !tg.ddl).length;
    let fieldProfiled = 0, fieldPending = 0, noRules = 0, partial = 0, full = 0;
    for (const tg of tableGroups) {
      fieldProfiled += tg.profilingStats.profiled;
      fieldPending  += tg.profilingStats.notProfiled;
      noRules += tg.coverageStats.none;
      partial += tg.coverageStats.partial;
      full    += tg.coverageStats.full;
    }

    // Blind rules: per allocated rule, check whether any of its CDEs have been profiled
    // Respect scope filter -- only count rules whose allocations touch scoped CDEs
    const scopedCdeIdSet = scopeCdsIds
      ? new Set((data?.critical_data_element || [])
          .filter(c => !c.retiring_timestamp && scopeCdsIds.has(c.critical_data_set_id))
          .map(c => c.critical_data_element_id))
      : null;

    const profiledKeys = new Set(
      (data?.field_profiling || [])
        .filter(p => !p.retiring_timestamp)
        .map(p => `${p.source_database_name}|||${p.source_table_name}|||${p.source_field_name}`)
    );
    const cdeKey = {};
    for (const c of (data?.critical_data_element || [])) {
      if (!c.retiring_timestamp && c.source_database_name && c.source_table_name && c.source_field_name &&
          (!scopedCdeIdSet || scopedCdeIdSet.has(c.critical_data_element_id)))
        cdeKey[c.critical_data_element_id] =
          `${c.source_database_name}|||${c.source_table_name}|||${c.source_field_name}`;
    }
    const allocsByRule = {};
    for (const a of (data?.data_quality_rule_allocation || [])) {
      if (!a.retiring_timestamp && (!scopedCdeIdSet || scopedCdeIdSet.has(a.critical_data_element_id))) {
        if (!allocsByRule[a.data_quality_rule_id]) allocsByRule[a.data_quality_rule_id] = [];
        allocsByRule[a.data_quality_rule_id].push(a.critical_data_element_id);
      }
    }
    let ruleProfiled = 0, ruleBlind = 0;
    for (const r of (data?.data_quality_rule || [])) {
      if (r.retiring_timestamp) continue;
      const cdeIds = allocsByRule[r.data_quality_rule_id] || [];
      if (cdeIds.length === 0) continue;
      const hasProfile = cdeIds.some(id => cdeKey[id] && profiledKeys.has(cdeKey[id]));
      if (hasProfile) ruleProfiled++; else ruleBlind++;
    }

    return { tableProfiled, tablePending, fieldProfiled, fieldPending,
             noRules, partial, full, ruleProfiled, ruleBlind };
  }, [tableGroups, data, scopeCdsIds]);

  const handleProfile = (fieldEntry) => {
    const tg = tableGroups.find(g => g.db === fieldEntry.db && g.table === fieldEntry.table);
    setProfilingPanel({ fieldEntry, ddl: tg?.ddl || null });
  };

  // DDL inline actions (Task 7 wiring)
  const handleEditDDL    = (tg) => openDdlForm(tg.ddl);
  const handleRetireDDL  = (tg) => retireRecord('source_table_ddl', tg.ddl.source_table_ddl_id);
  const handleAddDDL     = (tg) => openDdlForm({
    source_database_name: tg.db || '',
    source_table_name:    tg.table,
  });

  const inputBase = {
    padding:'7px 10px', fontSize:11, background:'var(--bg3)',
    border:'1px solid var(--border)', borderRadius:'var(--radius)',
    color:'var(--text)', fontFamily:'var(--sans)', outline:'none',
  };

  return (
    <div className="fade-in">
      {/* Page header */}
      <div style={{ display:'flex', alignItems:'flex-start',
        justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div className="page-title" style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:22, borderRadius:2, background:accent, flexShrink:0 }}/>
            Profiling
          </div>
          <div className="page-sub">
            {totalTables} table{totalTables !== 1 ? 's' : ''} &middot;{' '}
            {totalFields} field{totalFields !== 1 ? 's' : ''} in scope
          </div>
        </div>
      </div>

      {/* Stat blobs */}
      <div style={{ display:'flex', gap:10, marginBottom:12 }}>
        {[
          {
            title: 'TABLE PROFILING',
            tip: 'Profiled = tables already profiled. Pending = tables not yet profiled.',
            items: [
              { val: stats.tableProfiled, label: 'profiled', color: 'var(--green)' },
              { val: stats.tablePending,  label: 'pending',  color: 'var(--amber)' },
            ],
          },
          {
            title: 'FIELD PROFILING',
            tip: 'Profiled = fields already profiled. Pending = fields not yet profiled.',
            tbc: totalFields === 0,
            items: [
              { val: stats.fieldProfiled, label: 'profiled', color: 'var(--green)' },
              { val: stats.fieldPending,  label: 'pending',  color: 'var(--amber)' },
            ],
          },
          {
            title: 'FIELD COVERAGE',
            tip: 'Counts fields with at least one quality dimension covered by a quality rule. Full = all dimensions covered. Partial = some covered. No rules = no rule allocations at all.',
            items: [
              { val: stats.noRules, label: 'no rules', color: 'var(--text3)' },
              { val: stats.partial, label: 'partial',  color: 'var(--amber)' },
              { val: stats.full,    label: 'full',     color: 'var(--green)' },
            ],
          },
          {
            title: 'BLIND RULES',
            tip: 'Profiled = rules allocated to a profiled CDE. Not profiled = rules allocated CDEs not yet profiled. Rules with no allocations are excluded.',
            items: [
              { val: stats.ruleProfiled, label: 'profiled',     color: 'var(--green)' },
              { val: stats.ruleBlind,    label: 'not profiled', color: 'var(--amber)' },
            ],
          },
        ].map(blob => (
          <div key={blob.title} style={{
            flex:1, padding:'10px 14px',
            background:'var(--bg2)', border:'1px solid var(--border)',
            borderTop:`3px solid ${accent}`, borderRadius:'var(--radius-lg)',
          }}>
            <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:7 }}>
              <span style={{ fontSize:9, fontWeight:700, letterSpacing:'0.1em',
                textTransform:'uppercase', color:'var(--text3)' }}>
                {blob.title}
              </span>
              <span title={blob.tip}
                style={{ display:'inline-flex', alignItems:'center', justifyContent:'center',
                  width:13, height:13, borderRadius:'50%', flexShrink:0,
                  background:'var(--bg3)', border:'1px solid var(--border)',
                  color:'var(--text3)', fontSize:8, fontWeight:700, cursor:'default',
                  lineHeight:1 }}>
                ?
              </span>
            </div>
            <div style={{ display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap' }}>
              {blob.items.map((item, i) => (
                <span key={item.label} style={{ display:'inline-flex', alignItems:'baseline',
                  gap:4, fontSize:12, whiteSpace:'nowrap' }}>
                  {i > 0 && (
                    <span style={{ color:'var(--border)', marginRight:2,
                      fontSize:14, lineHeight:1 }}>&middot;</span>
                  )}
                  <span style={{ fontSize:18, fontWeight:700, fontFamily:'var(--mono)',
                    color: blob.tbc ? 'var(--text3)' : item.color, lineHeight:1 }}>
                    {blob.tbc ? 'TBC' : item.val}
                  </span>
                  <span style={{ fontSize:11, color:'var(--text3)' }}>{item.label}</span>
                </span>
              ))}
            </div>
          </div>
        ))}
      </div>

      {/* Filter row */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
        <div style={{ flex:1, position:'relative' }}>
          <div style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)',
            color:'var(--text3)', width:14, height:14, pointerEvents:'none' }}>
            <Icon.Search/>
          </div>
          <input className="table-search" style={{ paddingLeft:32 }}
            placeholder="Search table or field..."
            value={search} onChange={e => setSearch(e.target.value)}/>
        </div>
        <MyDataToggle
          active={myDataOnly}
          onToggle={function() { setMyDataOnly(function(v) { return !v; }); }}
          available={!!stewardIdentity}
          accent="#7c5cbf"
        />
        <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
          <label style={{ fontSize:11, color:'var(--text3)', whiteSpace:'nowrap' }}>Filter:</label>
          <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
            style={{ ...inputBase, cursor:'pointer' }}>
            <option value="all">All</option>
            <option value="needs_ddl">Tables Pending</option>
            <option value="needs_profiling">Fields Pending</option>
            <option value="rules_blind">Blind Rules</option>
            <option value="profiled">Profiled</option>
          </select>
        </div>
        {orphanDdls.length > 0 && (
          <button
            onClick={() => setShowExtras(v => !v)}
            title={showExtras ? 'Hide tables not referenced by any CDE or rule' : 'Show tables not referenced by any CDE or rule'}
            style={{ display:'flex', alignItems:'center', gap:5, padding:'4px 10px',
              background: showExtras ? `${accent}15` : 'var(--bg3)',
              border: `1px solid ${showExtras ? accent + '40' : 'var(--border)'}`,
              borderRadius:12, fontSize:11, cursor:'pointer',
              color: showExtras ? accent : 'var(--text3)',
              whiteSpace:'nowrap', flexShrink:0, transition:'all 0.15s' }}>
            {showExtras ? 'Hide extras' : 'Show extras'}
            <span style={{ fontSize:9, fontWeight:700,
              background: showExtras ? `${accent}25` : 'var(--bg)',
              border: `1px solid ${showExtras ? accent + '40' : 'var(--border)'}`,
              borderRadius:8, padding:'1px 5px' }}>
              {orphanDdls.length}
            </span>
          </button>
        )}
      </div>

      {/* Empty states */}
      {tableGroups.length === 0 && (
        <div className="status-row status-info">
          No fields in scope. Add CDEs to your Directorate to get started.
        </div>
      )}
      {tableGroups.length > 0 && filteredGroups.length === 0 && (
        <div className="status-row status-info">No records match the current filter.</div>
      )}

      {/* Table group list */}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {filteredGroups.map(tg => (
          <TableGroupRow
            key={tg.tableKey}
            tableGroup={tg}
            dimensions={dimensions}
            onProfile={handleProfile}
            onEditDDL={handleEditDDL}
            onRetireDDL={handleRetireDDL}
            onAddDDL={handleAddDDL}
            canEdit={canEdit}
            dismissedKeys={dismissedKeys}
            onDismiss={handleDismiss}
            accent={accent}/>
        ))}
      </div>

      {/* Extras: orphaned DDLs not referenced by any CDE or rule */}
      {showExtras && orphanDdls.length > 0 && (
        <div style={{ marginTop:8 }}>
          <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--text3)', marginBottom:8 }}>
            Extras &mdash; {orphanDdls.length} Table{orphanDdls.length !== 1 ? 's' : ''} not referenced by any CDE or rule
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {orphanDdls.map(ddl => (
              <OrphanDdlRow
                key={ddl.source_table_ddl_id}
                ddl={ddl}
                accent={accent}
                canEdit={canEdit}
                onEdit={() => openDdlForm(ddl)}
                onRetire={() => retireRecord('source_table_ddl', ddl.source_table_ddl_id)}
              />
            ))}
          </div>
        </div>
      )}

      {/* Profiling slide-in panel -- portalled to body so position:fixed works outside overflow:hidden ancestors */}
      {profilingPanel && ReactDOM.createPortal(
        <FieldProfilingPanel
          fieldEntry={profilingPanel.fieldEntry}
          initialDdl={profilingPanel.ddl}
          onClose={() => setProfilingPanel(null)}
          accent={accent}/>,
        document.body
      )}
    </div>
  );
}

// Backward-compat stubs -- routing in 240_app.js maps these keys to the unified view
function DDLLibraryView()      { return <ProfilingView/>; }
function FieldProfilingScreen() { return <ProfilingView/>; }

function DDLFormPanel({ record, onSave, onClose, nextPk, accent, data, stewardIdentity }) {
  const isEdit = !!(record?.source_table_ddl_id);

  // Build distinct db+table pairs from CDEs that don't have a DDL yet
  const existingDdls = useMemo(() => new Set(
    (data?.source_table_ddl || [])
      .filter(r => !r.retiring_timestamp)
      .map(r => `${r.source_database_name}|||${r.source_table_name}`)
  ), [data]);

  const cdePairs = useMemo(() => {
    const seen = new Set();
    const pairs = [];
    for (const cde of (data?.critical_data_element || [])) {
      if (cde.retiring_timestamp) continue;
      const db  = cde.source_database_name;
      const tbl = cde.source_table_name;
      if (!db || !tbl) continue;
      const key = `${db}|||${tbl}`;
      if (seen.has(key)) continue;
      seen.add(key);
      // Only include pairs without a DDL (unless we're editing this pair)
      if (!existingDdls.has(key) || key === `${record?.source_database_name}|||${record?.source_table_name}`) {
        pairs.push({ db, tbl, key });
      }
    }
    return pairs.sort((a,b) => a.key.localeCompare(b.key));
  }, [data, existingDdls, record]);

  const [pairSel,   setPairSel]   = useState(() => {
    if (record?.source_database_name && record?.source_table_name)
      return `${record.source_database_name}|||${record.source_table_name}`;
    return '';
  });
  const [dbName,    setDbName]    = useState(record?.source_database_name || '');
  const [tableName, setTableName] = useState(record?.source_table_name    || '');
  const [ddlText,   setDdlText]   = useState(record?.ddl_text             || '');
  const [parsed,    setParsed]    = useState(() =>
    record?.parsed_columns ? JSON.parse(record.parsed_columns) : []
  );

  const profKeys = useMemo(() => {
    const db  = (dbName  || '').toLowerCase();
    const tbl = (tableName || '').toLowerCase();
    return new Set(
      (data?.field_profiling || [])
        .filter(p => !p.retiring_timestamp &&
          (p.source_database_name || '').toLowerCase() === db &&
          (p.source_table_name    || '').toLowerCase() === tbl)
        .map(p => (p.source_field_name || '').toLowerCase())
    );
  }, [data, dbName, tableName]);

  const cdeKeys = useMemo(() => {
    const db  = (dbName  || '').toLowerCase();
    const tbl = (tableName || '').toLowerCase();
    return new Set(
      (data?.critical_data_element || [])
        .filter(c => !c.retiring_timestamp &&
          (c.source_database_name || '').toLowerCase() === db &&
          (c.source_table_name    || '').toLowerCase() === tbl)
        .map(c => (c.source_field_name || '').toLowerCase())
    );
  }, [data, dbName, tableName]);

  const [errors,    setErrors]    = useState({});
  const [parseMsg,  setParseMsg]  = useState('');
  const [copiedCmd, setCopiedCmd] = useState(false);

  const athenaCmd = dbName.trim() && tableName.trim()
    ? `SHOW CREATE TABLE ${dbName.trim()}.${tableName.trim()};`
    : '';

  const handleCopyCmd = () => {
    if (!athenaCmd) return;
    navigator.clipboard.writeText(normalizeWhitespace(athenaCmd)).then(() => {
      setCopiedCmd(true);
      setTimeout(() => setCopiedCmd(false), 1800);
    }).catch(() => {});
  };

  const handlePairSelect = (val) => {
    setPairSel(val);
    if (val && val !== '__custom__') {
      const [db, tbl] = val.split('|||');
      setDbName(db); setTableName(tbl);
    } else if (val === '__custom__') {
      setDbName(''); setTableName('');
    }
    setErrors({});
  };

  const handleParse = () => {
    const cols = parseDDL(ddlText);
    if (cols.length === 0) {
      setParseMsg('No columns detected. Check the DDL format.');
    } else {
      setParsed(cols);
      setParseMsg(`${cols.length} column${cols.length!==1?'s':''} detected.`);
      const tblMatch = ddlText.match(/CREATE\s+(?:EXTERNAL\s+)?TABLE\s+(?:`?([^`\s.(]+)`?\.)?`?([^`\s(]+)`?/i);
      if (tblMatch) {
        if (!dbName && tblMatch[1]) setDbName(tblMatch[1]);
        if (!tableName && tblMatch[2]) setTableName(tblMatch[2]);
      }
    }
  };

  const handleSave = () => {
    const errs = {};
    if (!dbName.trim())    errs.db    = 'Required';
    if (!tableName.trim()) errs.table = 'Required';
    if (!ddlText.trim())   errs.ddl   = 'Required';
    if (parsed.length === 0) errs.ddl = 'Parse the DDL first to confirm columns were detected.';
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const now = new Date();
    const dateStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
    onSave({
      source_table_ddl_id:  record?.source_table_ddl_id ?? nextPk(),
      source_database_name: dbName.trim(),
      source_table_name:    tableName.trim(),
      ddl_text:             ddlText,
      parsed_columns:       JSON.stringify(parsed),
      parsed_at:            dateStr,
      parsed_by:            stewardIdentity?.name || null,
      retiring_timestamp:   null,
    });
  };

  const inputBase = {
    width:'100%', padding:'7px 10px', fontSize:13,
    background:'var(--bg3)', border:'1px solid var(--border)',
    borderRadius:'var(--radius)', color:'var(--text)',
    fontFamily:'var(--sans)', outline:'none',
  };
  const monoInput = { fontFamily:'var(--mono)', fontSize:12 };
  const isCustom = pairSel === '__custom__' || pairSel === '';

  return (
    <>
      <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:300, background:'var(--overlay-sm)' }}/>
      <div style={{
        position:'fixed', top:0, right:0, bottom:0, width:'min(780px, 82vw)',
        background:'var(--bg2)', borderLeft:'1px solid var(--border2)',
        zIndex:400, display:'flex', flexDirection:'column',
        boxShadow:'-4px 0 24px var(--overlay-md)', animation:'slideInRight 0.18s ease',
      }}>
        {/* Header */}
        <div style={{ padding:'14px 18px', borderBottom:'1px solid var(--border)',
          display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.08em',
              textTransform:'uppercase', color:accent, marginBottom:3 }}>
              {isEdit ? 'Edit Profile' : 'Add Profile'}
            </div>
            <div style={{ fontSize:13, fontWeight:500, color:'var(--text)' }}>Table Profiling</div>
          </div>
          <button className="btn btn-primary" onClick={handleSave} style={{ padding:'6px 14px', fontSize:12 }}>
            <Icon.Check/> {isEdit ? 'Save' : 'Add'}
          </button>
          <button className="btn btn-ghost" style={{ padding:'6px 8px' }} onClick={onClose}>
            <Icon.X/>
          </button>
        </div>

        <div style={{ flex:1, overflow:'auto', padding:'16px 18px',
          display:'flex', flexDirection:'column', gap:14 }}>

          {/* Last Profiled box */}
          <div style={{ background:'var(--bg2)', border:'1px solid var(--border)',
            borderLeft:`3px solid ${record?.parsed_at ? 'var(--green)' : 'var(--border)'}`,
            borderRadius:'var(--radius-lg)', padding:'10px 14px' }}>
            <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.08em',
              textTransform:'uppercase',
              color: record?.parsed_at ? 'var(--green)' : 'var(--text3)',
              marginBottom:6 }}>
              Last Profiled
            </div>
            {record?.parsed_at ? (
              <>
                <div style={{ fontSize:11, fontFamily:'var(--mono)', color:'var(--text2)', lineHeight:1.5, overflowWrap:'anywhere' }}>
                  {record.parsed_at}
                </div>
                <div style={{ fontSize:10, fontFamily:'var(--mono)', color:'var(--text3)', marginTop:3, overflowWrap:'anywhere' }}>
                  {record.parsed_by ? `by ${record.parsed_by}` : 'by unknown'}
                </div>
              </>
            ) : (
              <div style={{ fontSize:11, fontFamily:'var(--mono)', color:'var(--text3)' }}>Never</div>
            )}
          </div>

          {/* Step 1 -- Get the DDL */}
          <div style={{ background:'var(--bg2)', border:'1px solid var(--border)',
            borderLeft:`3px solid ${accent}`, borderRadius:'var(--radius-lg)',
            padding:'14px 16px', display:'flex', flexDirection:'column', gap:14 }}>
            <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.08em',
              textTransform:'uppercase', color:accent }}>
              Step 1 - Get the DDL from Athena
            </div>

            {/* Table selector */}
            <div>
              <label style={{ display:'block', fontSize:11, fontWeight:600,
                color:'var(--text2)', marginBottom:4 }}>
                Select from CDE related tables yet to be profiled
              </label>
              <select value={pairSel} style={{ ...inputBase, ...monoInput, cursor:'pointer' }}
                onChange={e => handlePairSelect(e.target.value)}>
                <option value="">-- select a table or enter manually below --</option>
                {cdePairs.map(p => (
                  <option key={p.key} value={p.key}>{p.db} / {p.tbl}</option>
                ))}
                <option value="__custom__">-- enter new database / table manually --</option>
              </select>
            </div>

            {/* Database + Table fields */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <div>
                <label style={{ display:'block', fontSize:11, fontWeight:600,
                  color: errors.db ? 'var(--red)' : 'var(--text2)', marginBottom:4 }}>
                  Database <span style={{ color:'var(--red)' }}>*</span>
                </label>
                <input type="text" value={dbName}
                  onChange={e => { setDbName(e.target.value); setErrors(p => ({...p, db:null})); }}
                  style={{ ...inputBase, ...monoInput,
                    border:`1px solid ${errors.db ? 'var(--red)' : 'var(--border)'}`,
                    background: !isCustom ? 'var(--bg)' : 'var(--bg3)' }}
                  placeholder="e.g. data_eng_uploader_prod_opg_stage_1"/>
                {errors.db && <div style={{ fontSize:11, color:'var(--red)', marginTop:2 }}>{errors.db}</div>}
              </div>
              <div>
                <label style={{ display:'block', fontSize:11, fontWeight:600,
                  color: errors.table ? 'var(--red)' : 'var(--text2)', marginBottom:4 }}>
                  Table <span style={{ color:'var(--red)' }}>*</span>
                </label>
                <input type="text" value={tableName}
                  onChange={e => { setTableName(e.target.value); setErrors(p => ({...p, table:null})); }}
                  style={{ ...inputBase, ...monoInput,
                    border:`1px solid ${errors.table ? 'var(--red)' : 'var(--border)'}`,
                    background: !isCustom ? 'var(--bg)' : 'var(--bg3)' }}
                  placeholder="e.g. card_payments_statsheets_updated"/>
                {errors.table && <div style={{ fontSize:11, color:'var(--red)', marginTop:2 }}>{errors.table}</div>}
              </div>
            </div>

            {/* Athena command copy block */}
            <div style={{ background:'var(--bg)', border:'1px solid var(--border)',
              borderRadius:'var(--radius)', padding:'10px 12px' }}>
              <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.08em',
                textTransform:'uppercase', color:'var(--text3)', marginBottom:8 }}>
                Athena command
              </div>
              {athenaCmd ? (
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <code style={{ flex:1, fontFamily:'var(--mono)', fontSize:11,
                    color:'var(--text)', overflowWrap:'anywhere' }}>
                    {athenaCmd}
                  </code>
                  <button onClick={handleCopyCmd}
                    style={{ display:'flex', alignItems:'center', gap:5,
                      fontSize:11, padding:'4px 12px', cursor:'pointer', flexShrink:0,
                      background: copiedCmd ? 'rgba(34,201,142,0.12)' : 'var(--bg3)',
                      border:`1px solid ${copiedCmd ? 'var(--green)' : accent}`,
                      borderRadius:'var(--radius)',
                      color: copiedCmd ? 'var(--green)' : accent,
                      fontWeight:600, fontFamily:'var(--mono)' }}>
                    {copiedCmd ? <Icon.Check/> : <Icon.Copy/>}
                    {copiedCmd ? 'Copied' : 'Copy'}
                  </button>
                </div>
              ) : (
                <span style={{ fontSize:11, color:'var(--text3)', fontStyle:'italic' }}>
                  Select or enter a database and table above to generate the Athena command.
                </span>
              )}
            </div>

            {/* DDL paste area */}
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
              {athenaCmd && (
                <div style={{ fontSize:11, color:'var(--text3)', marginBottom:2 }}>
                  Run the command above in Athena, then paste the output here.
                </div>
              )}
              <label style={{ fontSize:11, fontWeight:600, marginBottom:4, display:'block',
                color: errors.ddl ? 'var(--red)' : 'var(--text2)' }}>

// ---------------------------------------------------------------------------
// Colour extraction -- checks fill first, then font colour
// ---------------------------------------------------------------------------

// Approximate hex values for standard Office theme colour indices
const THEME_COLOUR_MAP = {
  4: '4472C4',
  5: 'ED7D31',
  6: 'A9D18E',
  7: 'FFC000',
  8: '5B9BD5',
  9: '70AD47',
};

function colourFromObj(colorObj) {
  if (!colorObj) return null;
  if (colorObj.rgb) {
    var hex = colorObj.rgb.toUpperCase();
    if (hex.length === 8) hex = hex.slice(2);        // strip alpha
    if (hex === 'FFFFFF' || hex === '000000') return null;
    return hex;
  }
  if (colorObj.theme !== undefined && colorObj.theme !== null) {
    if (colorObj.theme === 0 || colorObj.theme === 1) return null; // background / default text
    return THEME_COLOUR_MAP[colorObj.theme] || '808080';
  }
  return null;
}

function extractColourHex(ws, addr) {
  const cell = ws[addr];
  if (!cell || !cell.s) return null;
  // 1. Fill colour takes precedence (e.g. CDE Shortlist Assessment template)
  const fillHex = colourFromObj(cell.s.fgColor);
  if (fillHex) return fillHex;
  // 2. Font colour fallback (e.g. POAS-style workbooks)
  const fontColor = cell.s.font && cell.s.font.color;
  return colourFromObj(fontColor) || null;
}

// ---------------------------------------------------------------------------
// parseShortlistWorkbook(workbook) -> { items, encounteredColours, fallbackMode }
// ---------------------------------------------------------------------------
function parseShortlistWorkbook(workbook) {
  const skipNames = ['example', 'instructions', 'version control'];
  const sheetName = workbook.SheetNames.find(function(n) {
    return !skipNames.some(function(s) { return n.toLowerCase().indexOf(s) >= 0; });
  });
  if (!sheetName) return null;

  const ws   = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  if (!rows.length) return null;

  // Detect CDS columns: scan row 0 from col 1, stop at first empty header
  const cdsColIndices = [];
  let col = 1;
  while (col < (rows[0] || []).length) {
    const header = rows[0][col];
    if (!header || String(header).trim() === '') break;
    cdsColIndices.push(col);
    col++;
  }
  if (!cdsColIndices.length) return null;

  // Auto-detect first data row: skip metadata rows that have a dark themed
  // background fill (Office theme index 0) -- e.g. owner/reporter header rows
  let dataStartRow = 1;
  while (dataStartRow < rows.length) {
    const isMetadata = cdsColIndices.some(function(colIdx) {
      const addr = XLSX.utils.encode_cell({ r: dataStartRow, c: colIdx });
      const cell = ws[addr];
      return cell && cell.s && cell.s.fgColor && cell.s.fgColor.theme === 0;
    });
    if (!isMetadata) break;
    dataStartRow++;
  }

  const items = [];
  const encounteredColours = [];
  const seenColours = {};

  cdsColIndices.forEach(function(colIdx) {
    const cdsName = String(rows[0][colIdx]).trim();
    const fields  = [];

    for (let rowIdx = dataStartRow; rowIdx < rows.length; rowIdx++) {
      const cellVal = rows[rowIdx][colIdx];
      if (!cellVal || String(cellVal).trim() === '') continue;

      const addr = XLSX.utils.encode_cell({ r: rowIdx, c: colIdx });
      const hex  = extractColourHex(ws, addr);

      if (hex && !seenColours[hex]) {
        seenColours[hex] = true;
        encounteredColours.push(hex);
      }

      fields.push({ fieldName: String(cellVal).trim(), colourHex: hex });
    }

    if (fields.length > 0) items.push({ cdsName: cdsName, fields: fields });
  });

  return {
    items:              items,
    encounteredColours: encounteredColours,
    fallbackMode:       encounteredColours.length === 0,
  };
}

// ---------------------------------------------------------------------------
// stageShortlistGroups -> { colourMap, newGroups }
// Always creates new group records; no reuse of existing groups.
// Groups are named Group 1, Group 2... in encounter order.
// ---------------------------------------------------------------------------
function stageShortlistGroups(encounteredColours, directorateId, existingGroups) {
  const maxId = (existingGroups || []).reduce(function(m, g) {
    return Math.max(m, g.shortlist_group_id || 0);
  }, 0);

  const colourMap = {};
  const newGroups = [];

  encounteredColours.forEach(function(colour, idx) {
    const id = maxId + idx + 1;
    newGroups.push({
      shortlist_group_id:    id,
      directorate_id:        directorateId,
      shortlist_group_label: 'Group ' + (idx + 1),
      shortlist_colour_hex:  colour,
      retiring_timestamp:    null,
    });
    colourMap[colour] = id;
  });

  return { colourMap: colourMap, newGroups: newGroups };
}

// ---------------------------------------------------------------------------
// resolveDirectorate -> { mode, directorateId, directorateName, options }
// ---------------------------------------------------------------------------
function resolveDirectorate(stewardIdentity, isMaster, data) {
  const allDirs = (data.directorate || [])
    .filter(function(d) { return !d.retiring_timestamp; })
    .map(function(d) { return { directorate_id: d.directorate_id, directorate_name: d.directorate_name }; });

  if (isMaster || !stewardIdentity) {
    return { mode: 'pick', directorateId: null, directorateName: null, options: allDirs };
  }

  const myStew = (data.stewardship || []).filter(function(s) {
    return s.data_steward_id === stewardIdentity.id &&
           !s.retiring_timestamp &&
           s.critical_data_set_id !== 0;
  });

  const seen  = {};
  const dirIds = [];
  myStew.forEach(function(s) {
    const cds = (data.critical_data_set || []).find(function(c) {
      return c.critical_data_set_id === s.critical_data_set_id;
    });
    if (cds && cds.directorate_id && !seen[cds.directorate_id]) {
      seen[cds.directorate_id] = true;
      dirIds.push(cds.directorate_id);
    }
  });

  if (dirIds.length === 1) {
    const dir = (data.directorate || []).find(function(d) { return d.directorate_id === dirIds[0]; });
    return {
      mode:            'auto',
      directorateId:   dirIds[0],
      directorateName: dir ? dir.directorate_name : String(dirIds[0]),
      options:         allDirs,
    };
  }

  // Multiple or zero: picker, pre-select most common
  const freq = {};
  dirIds.forEach(function(id) { freq[id] = (freq[id] || 0) + 1; });
  const topId = dirIds.length
    ? dirIds.slice().sort(function(a, b) { return (freq[b] || 0) - (freq[a] || 0); })[0]
    : null;

  return { mode: 'pick', directorateId: topId, directorateName: null, options: allDirs };
}

// ---------------------------------------------------------------------------
// analyseShortlist -> { summary, items }
// ---------------------------------------------------------------------------
function analyseShortlist(parsed, colourMap, directorateId, data) {
  const cdes    = data.critical_data_element || [];
  const cdsList = data.critical_data_set     || [];
  let newCds = 0, existingCds = 0, newCde = 0, duplicateCde = 0;

  const items = parsed.items.map(function(item) {
    const matchedCds = cdsList.find(function(r) {
      return !r.retiring_timestamp &&
             r.directorate_id === directorateId &&
             r.data_set_name.trim().toLowerCase() === item.cdsName.trim().toLowerCase();
    });

    const cdsStatus    = matchedCds ? 'existing' : 'new';
    const existingCdsId = matchedCds ? matchedCds.critical_data_set_id : null;
    if (cdsStatus === 'existing') existingCds++; else newCds++;

    const mappedFields = item.fields.map(function(f) {
      const shortlistGroupId = f.colourHex ? (colourMap[f.colourHex] || null) : null;
      let fieldStatus   = 'new';
      let existingCdeId = null;

      if (cdsStatus === 'existing') {
        const matchedCde = cdes.find(function(r) {
          return !r.retiring_timestamp &&
                 r.critical_data_set_id === existingCdsId &&
                 r.source_field_name.trim().toLowerCase() === f.fieldName.trim().toLowerCase();
        });
        if (matchedCde) {
          fieldStatus   = 'duplicate';
          existingCdeId = matchedCde.critical_data_element_id;
        }
      }

      if (fieldStatus === 'duplicate') duplicateCde++; else newCde++;
      return {
        fieldName:        f.fieldName,
        colourHex:        f.colourHex,
        shortlistGroupId: shortlistGroupId,
        fieldStatus:      fieldStatus,
        existingCdeId:    existingCdeId,
      };
    });

    return {
      cdsName:      item.cdsName,
      cdsStatus:    cdsStatus,
      existingCdsId: existingCdsId,
      fields:       mappedFields,
    };
  });

  return {
    summary: { newCds: newCds, existingCds: existingCds, newCde: newCde, duplicateCde: duplicateCde },
    items:   items,
  };
}

// ---------------------------------------------------------------------------
// applyShortlistImport -> { newData, counts }
// ---------------------------------------------------------------------------
function applyShortlistImport(analysis, resolutions, directorateId, newGroups, data) {
  const newData = Object.assign({}, data);
  newData.shortlist_group       = (data.shortlist_group || []).concat(newGroups);
  newData.critical_data_set     = (data.critical_data_set || []).slice();
  newData.critical_data_element = (data.critical_data_element || []).slice();
  newData.cde_shortlist_tag     = (data.cde_shortlist_tag || []).slice();

  let nextCdsId = newData.critical_data_set.reduce(function(m, r) {
    return Math.max(m, r.critical_data_set_id || 0);
  }, 0) + 1;
  let nextCdeId = newData.critical_data_element.reduce(function(m, r) {
    return Math.max(m, r.critical_data_element_id || 0);
  }, 0) + 1;
  let nextTagId = newData.cde_shortlist_tag.reduce(function(m, r) {
    return Math.max(m, r.cde_shortlist_tag_id || 0);
  }, 0) + 1;

  let newCdsCount = 0, newCdeCount = 0, shortlistedCount = 0;

  analysis.items.forEach(function(item) {
    const cdsKey = 'cds:' + item.cdsName;
    let resolvedCdsId;

    if (item.cdsStatus === 'new' || resolutions[cdsKey] === 'B') {
      const rec = {
        critical_data_set_id:  nextCdsId++,
        directorate_id:        directorateId,
        data_set_name:         item.cdsName,
        data_set_description:  '',
        data_set_subdivision:  '',
        retiring_timestamp:    null,
      };
      newData.critical_data_set.push(rec);
      resolvedCdsId = rec.critical_data_set_id;
      newCdsCount++;
    } else {
      resolvedCdsId = item.existingCdsId;
    }

    item.fields.forEach(function(field) {
      const cdeKey = 'cde:' + item.cdsName + ':' + field.fieldName;
      if (field.fieldStatus === 'duplicate' && resolutions[cdeKey] !== 'B') return;

      const cdeId = nextCdeId++;
      newData.critical_data_element.push({
        critical_data_element_id: cdeId,
        critical_data_set_id:     resolvedCdsId,
        source_field_name:        field.fieldName,
        source_platform_name:     '',
        source_system_name:       '',
        source_database_name:     '',
        source_table_name:        '',
        source_snapshot_filter:   '',
        data_element_definition:  '',
        data_element_explanation: '',
        retiring_timestamp:       null,
      });
      newCdeCount++;

      if (field.shortlistGroupId != null) {
        newData.cde_shortlist_tag.push({
          cde_shortlist_tag_id:     nextTagId++,
          critical_data_element_id: cdeId,
          shortlist_group_id:       field.shortlistGroupId,
          retiring_timestamp:       null,
        });
        shortlistedCount++;
      }
    });
  });

  return { newData: newData, counts: { newCds: newCdsCount, newCde: newCdeCount, shortlisted: shortlistedCount } };
}
