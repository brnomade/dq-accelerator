      marginBottom:8, overflow:'hidden', marginLeft:20 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
        padding:'7px 12px', background:'var(--bg2)', borderBottom:'1px solid var(--border)' }}>
        <span style={{ fontSize:13, fontWeight:600, color:'var(--text1)',
          fontFamily:'var(--mono)' }}>{field.fieldName}</span>
        <span style={{ fontSize:10, fontWeight:700, padding:'2px 6px', borderRadius:4,
          background:'var(--bg3)', color:'var(--text3)', border:'1px solid var(--border)' }}>
          DUPLICATE
        </span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr' }}>
        <div style={{ padding:'8px 12px', borderRight:'1px solid var(--border)',
          fontSize:12, color:'var(--text3)' }}>
          Existing CDE #{field.existingCdeId}
        </div>
        <div style={{ padding:'8px 12px', fontSize:12, color:'var(--text3)' }}>
          <div>Incoming: {field.fieldName}</div>
          {field.colourHex &&
            <div style={{ display:'flex', alignItems:'center', gap:4, marginTop:3 }}>
              <div style={{ width:10, height:10, borderRadius:2,
                background:'#' + field.colourHex, border:'1px solid var(--border)' }} />
              <span>#{field.colourHex}</span>
            </div>
          }
        </div>
      </div>
      <div style={{ display:'flex', gap:8, padding:'8px 12px', borderTop:'1px solid var(--border)' }}>
        <button onClick={function() { onResolve(key, 'A'); }} style={{
          flex:1, padding:'5px 0', borderRadius:5, cursor:'pointer', fontSize:12,
          border: isA ? '2px solid var(--green)' : '1px solid var(--border)',
          background: isA ? 'rgba(34,201,142,0.1)' : 'var(--bg2)',
          color: isA ? 'var(--green)' : 'var(--text2)',
          fontWeight: isA ? 700 : 400,
        }}>Skip{isA ? ' \u2713' : ''}</button>
        <button onClick={function() { onResolve(key, 'B'); }} style={{
          flex:1, padding:'5px 0', borderRadius:5, cursor:'pointer', fontSize:12,
          border: !isA ? '2px solid var(--accent)' : '1px solid var(--border)',
          background: !isA ? 'rgba(24,180,212,0.1)' : 'var(--bg2)',
          color: !isA ? 'var(--accent)' : 'var(--text2)',
          fontWeight: !isA ? 700 : 400,
        }}>Import anyway{!isA ? ' \u2713' : ''}</button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// ShortlistImportTab -- main component
// onImport(newData) is called on successful apply (same contract as onMerge)
// ---------------------------------------------------------------------------
function ShortlistImportTab({ onImport }) {
  const { data, stewardIdentity, isMaster } = useApp();

  const [phase,        setPhase]       = useState('upload');
  const [parsed,       setParsed]      = useState(null);
  const [fallbackMode, setFallback]    = useState(false);
  const [dirResult,    setDirResult]   = useState(null);
  const [directorateId, setDirId]      = useState(null);
  const [groupResult,  setGroupResult] = useState(null);
  const [analysis,     setAnalysis]    = useState(null);
  const [resolutions,  setResolutions] = useState({});
  const [done,         setDone]        = useState(null);
  const [error,        setError]       = useState(null);
  const [dragging,     setDragging]    = useState(false);

  const fileRef = useRef(null);

  function handleFile(file) {
    if (!file) return;
    setError(null);
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const wb     = XLSX.read(ev.target.result, { type: 'binary', cellStyles: true });
        const result = parseShortlistWorkbook(wb);
        if (!result || !result.items.length) {
          setError('No CDS data found. Check that the file has CDS names in row 1 starting from column B.');
          return;
        }
        setParsed(result);
        setFallback(result.fallbackMode);

        const dr = resolveDirectorate(stewardIdentity, isMaster, data);
        setDirResult(dr);

        if (dr.mode === 'auto') {
          const autoId = dr.directorateId;
          setDirId(autoId);
          const gr = stageShortlistGroups(result.encounteredColours, autoId, data.shortlist_group || []);
          setGroupResult(gr);
          const analysis = analyseShortlist(result, gr.colourMap, autoId, data);
          const defaults = {};
          analysis.items.forEach(function(item) {
            if (item.cdsStatus === 'existing') defaults['cds:' + item.cdsName] = 'A';
            item.fields.forEach(function(f) {
              if (f.fieldStatus === 'duplicate') defaults['cde:' + item.cdsName + ':' + f.fieldName] = 'A';
            });
          });
          setAnalysis(analysis);
          setResolutions(defaults);
          setPhase('analyse');
        } else {
          setPhase('directorate');
        }
      } catch (err) {
        setError('Failed to read file: ' + err.message);
      }
    };
    reader.readAsBinaryString(file);
  }

  function handleDirectorateConfirm(id) {
    setDirId(id);
    const gr = stageShortlistGroups(parsed.encounteredColours, id, data.shortlist_group || []);
    setGroupResult(gr);
    const result = analyseShortlist(parsed, gr.colourMap, id, data);
    const defaults = {};
    result.items.forEach(function(item) {
      if (item.cdsStatus === 'existing') defaults['cds:' + item.cdsName] = 'A';
      item.fields.forEach(function(f) {
        if (f.fieldStatus === 'duplicate') defaults['cde:' + item.cdsName + ':' + f.fieldName] = 'A';
      });
    });
    setAnalysis(result);
    setResolutions(defaults);
    setPhase('analyse');
  }

  function handleResolve(key, val) {
    setResolutions(function(prev) { return Object.assign({}, prev, { [key]: val }); });
  }

  function handleApply() {
    const result = applyShortlistImport(analysis, resolutions, directorateId, groupResult.newGroups, data);
    onImport(result.newData);
    setDone(result.counts);
    setPhase('done');
  }

  function handleReset() {
    setParsed(null); setFallback(false); setDirResult(null); setDirId(null);
    setGroupResult(null); setAnalysis(null); setResolutions({}); setDone(null); setError(null);
    setPhase('upload');
    if (fileRef.current) fileRef.current.value = '';
  }

  const totalFields     = parsed ? parsed.items.reduce(function(n, i) { return n + i.fields.length; }, 0) : 0;
  const colouredFields  = parsed ? parsed.items.reduce(function(n, i) { return n + i.fields.filter(function(f) { return !!f.colourHex; }).length; }, 0) : 0;
  const conflictItems   = analysis ? analysis.items.filter(function(i) { return i.cdsStatus === 'existing'; }) : [];
  const totalConflicts  = analysis ? analysis.summary.existingCds + analysis.summary.duplicateCde : 0;

  const fallbackBanner = (
    <div style={{ background:'rgba(245,166,35,0.08)', border:'1px solid rgba(245,166,35,0.4)',
      borderRadius:8, padding:12, marginBottom:14, color:'var(--amber)', fontSize:13 }}>
      Cell colour data not available in this file {'\u2014'} CDEs will be imported without shortlist tags.
      Tags can be applied manually via the CDE panel after import.
    </div>
  );

  return (
    <div>

      {/* Header */}
      <div className="page-sub" style={{ marginBottom:14 }}>
        Bulk-load Critical Data Sets and Critical Data Elements from a completed CDE Shortlist Assessment workbook.
        All fields are imported; marked CDEs are tagged with a shortlist group based on their cell or font colour.
      </div>

      {/* Error */}
      {error && (
        <div style={{ background:'rgba(192,57,43,0.1)', border:'1px solid rgba(192,57,43,0.5)',
          borderRadius:8, padding:12, marginBottom:16, color:'#e74c3c', fontSize:13 }}>
          {error}
        </div>
      )}

      {/* PHASE: upload */}
      {phase === 'upload' && (
        <div className={`upload-zone ${dragging ? 'drag-over' : ''}`}
          onDragOver={function(e) { e.preventDefault(); setDragging(true); }}
          onDragLeave={function() { setDragging(false); }}
          onDrop={function(e) { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}>
          <input ref={fileRef} type="file" accept=".xlsx"
            onChange={function(e) { handleFile(e.target.files[0]); }} />
          <svg className="upload-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="1.5">
            <rect x="8" y="4" width="28" height="40" rx="3"/>
            <path d="M28 4v12h12M18 28l6-6 6 6M24 22v14"/>
          </svg>
          <div className="upload-title">Drop your file here</div>
          <div className="upload-sub">.xlsx CDE Shortlist Assessment workbook</div>
        </div>
      )}

      {/* PHASE: directorate */}
      {phase === 'directorate' && dirResult && (
        <div>
          {fallbackMode && fallbackBanner}
          <div style={{ marginBottom:14, fontSize:13, color:'var(--text2)' }}>
            Parsed <strong style={{ color:'var(--text1)' }}>{parsed.items.length}</strong> CDS
            and <strong style={{ color:'var(--text1)' }}>{totalFields}</strong> fields
            {colouredFields > 0
              ? <span> {'\u2014'} <strong style={{ color:'var(--green)' }}>{colouredFields}</strong> shortlisted (coloured).</span>
              : '.'}
          </div>
          <ShortlistDirectorateStep dirResult={dirResult} onConfirm={handleDirectorateConfirm} />
          <button onClick={handleReset} style={{
            background:'none', border:'none', cursor:'pointer',
            fontSize:12, color:'var(--text3)', padding:0, textDecoration:'underline',
          }}>
            Start over with a different file
          </button>
        </div>
      )}

      {/* PHASE: group preview -- removed: auto-advances from directorate */}
      {false && groupResult && (
        <div>
          {fallbackMode && fallbackBanner}
          <div style={{ marginBottom:14, fontSize:13, color:'var(--text2)' }}>
            Parsed <strong style={{ color:'var(--text1)' }}>{parsed.items.length}</strong> CDS,{' '}
            <strong style={{ color:'var(--text1)' }}>{totalFields}</strong> fields
            {colouredFields > 0
              ? <span>  {'\u2014'} <strong style={{ color:'var(--green)' }}>{colouredFields}</strong> shortlisted.</span>
              : '.'}
          </div>
          {groupResult.newGroups.length > 0
            ? <ShortlistGroupPreview newGroups={groupResult.newGroups} />
            : <div style={{ fontSize:13, color:'var(--text3)', marginBottom:14 }}>
                No coloured cells detected  {'\u2014'} no shortlist groups will be created.
              </div>
          }
          <button onClick={handleProceedAnalyse} style={{
            padding:'10px 26px', background:'var(--green)', color:'#fff',
            border:'none', borderRadius:8, cursor:'pointer', fontWeight:600, fontSize:14,
          }}>
            Analyse file
          </button>
        </div>
      )}

      {/* PHASE: conflict review */}
      {phase === 'analyse' && analysis && (
        <div>
          {groupResult && groupResult.newGroups.length > 0 && (
            <div style={{ marginBottom:16 }}>
              <ShortlistGroupPreview newGroups={groupResult.newGroups} />
            </div>
          )}
          <ShortlistSummaryBanner summary={analysis.summary} />

          {totalConflicts === 0
            ? <div style={{ background:'rgba(34,201,142,0.08)', border:'1px solid rgba(34,201,142,0.4)',
                borderRadius:8, padding:12, marginBottom:16, color:'var(--green)', fontSize:13 }}>
                No conflicts  {'\u2014'} all records are new and ready to import.
              </div>
            : <div style={{ marginBottom:16 }}>
                <div style={{ fontWeight:600, color:'var(--text1)', fontSize:13, marginBottom:12 }}>
                  {totalConflicts} conflict{totalConflicts !== 1 ? 's' : ''} detected
                   {'\u2014'} defaults are pre-selected, adjust if needed
                </div>
                {conflictItems.map(function(item, i) {
                  return (
                    <div key={i}>
                      <ShortlistCdsConflictCard
                        item={item}
                        resolution={resolutions['cds:' + item.cdsName]}
                        onResolve={handleResolve}
                      />
                      {item.fields
                        .filter(function(f) { return f.fieldStatus === 'duplicate'; })
                        .map(function(field, j) {
                          return (
                            <ShortlistCdeConflictCard
                              key={j}
                              cdsName={item.cdsName}
                              field={field}
                              resolution={resolutions['cde:' + item.cdsName + ':' + field.fieldName]}
                              onResolve={handleResolve}
                            />
                          );
                        })
                      }
                    </div>
                  );
                })}
              </div>
          }

          <div style={{ display:'flex', gap:12 }}>
            <button onClick={handleApply} style={{
              padding:'10px 28px', background:'var(--green)', color:'#fff',
              border:'none', borderRadius:8, cursor:'pointer', fontWeight:700, fontSize:14,
            }}>
              Apply import
            </button>
            <button onClick={handleReset} style={{
              padding:'10px 20px', background:'var(--bg2)', color:'var(--text2)',
              border:'1px solid var(--border)', borderRadius:8, cursor:'pointer', fontSize:13,
            }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* PHASE: done */}
      {phase === 'done' && done && (
        <div>
          <div style={{ background:'rgba(34,201,142,0.08)', border:'1px solid rgba(34,201,142,0.4)',
            borderRadius:10, padding:20, marginBottom:20 }}>
            <div style={{ fontWeight:700, color:'var(--green)', fontSize:15, marginBottom:6 }}>
              Import complete
            </div>
            <div style={{ color:'var(--text2)', fontSize:13 }}>
              {done.newCds} CDS created  {'\u00b7'}{' '}
              {done.newCde} CDE created  {'\u00b7'}{' '}
              {done.shortlisted} shortlisted
            </div>
          </div>
          <button onClick={handleReset} style={{
            padding:'10px 24px', background:'var(--bg2)', color:'var(--text1)',
            border:'1px solid var(--border)', borderRadius:8, cursor:'pointer', fontWeight:600,
          }}>
            Import another file
          </button>
        </div>
      )}

    </div>
  );
}

// ===============================================================================
// TASK 6 -- DELTA CONFLICT CARD
// ===============================================================================
function DeltaConflictCard({ conflict, resolution, onResolve }) {
  const { table, pk, masterRow, stewardRow, type } = conflict;
  const schema   = SCHEMA[table];
  const pkField  = schema.pk;
  const cardKey  = `${table}:${pk}`;
  const [showAll, setShowAll] = useState(false);

  const diffCols = type === 'update'
    ? (schema.cols || []).filter(col =>
        col.name !== pkField &&
        String(masterRow[col.name] ?? '') !== String(stewardRow[col.name] ?? ''))
    : (schema.cols || []).filter(c => c.type !== 'datetime' && c.name !== pkField).slice(0, 4);

  const diffColNames = new Set(diffCols.map(c => c.name));

  const contextCols = type === 'update'
    ? (schema.cols || [])
        .filter(col => col.name !== pkField && col.type !== 'datetime' && !diffColNames.has(col.name))
        .slice(0, 3)
    : [];

  const allCols = (schema.cols || []).filter(col => col.name !== pkField);

  const borderColor = !resolution
    ? 'rgba(245,166,35,0.5)'
    : resolution === 'master' ? 'var(--border)' : 'rgba(34,201,142,0.4)';

  const statusLabel = !resolution ? 'Unresolved'
    : resolution === 'master' ? 'Keeping master' : 'Accepting steward';
  const statusColor = !resolution ? 'var(--amber)'
    : resolution === 'master' ? 'var(--text3)' : 'var(--green)';

  const changedDivider = (
    <div style={{ fontSize:9, fontWeight:700, color:'var(--text3)', textTransform:'uppercase',
      letterSpacing:'0.5px', margin:'6px 0 4px', borderTop:'1px solid var(--border)', paddingTop:6 }}>
      Changed
    </div>
  );

  return (
    <div style={{ marginBottom:12, border:`1px solid ${borderColor}`,
      borderRadius:'var(--radius)', background:'var(--bg2)', overflow:'hidden' }}>

      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', gap:8,
        padding:'7px 12px', borderBottom:'1px solid var(--border)', background:'var(--bg3)' }}>
        <span style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text2)', flex:1 }}>
          {schema.label} #{pk}
        </span>
        <span style={{ fontSize:9, fontWeight:700, padding:'2px 6px', borderRadius:3,
          background: type === 'retire' ? 'rgba(245,166,35,0.15)' : 'rgba(24,180,212,0.15)',
          color:      type === 'retire' ? 'var(--amber)' : 'var(--accent)',
          border:     `1px solid ${type === 'retire' ? 'rgba(245,166,35,0.4)' : 'var(--accent-border)'}` }}>
          {type === 'retire' ? 'RETIRE' : 'UPDATE'}
        </span>
        <span style={{ fontSize:10, color:statusColor }}>{statusLabel}</span>
      </div>

      {/* Side-by-side */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr' }}>

        {/* Master panel */}
        <div style={{ padding:'10px 12px', borderRight:'1px solid var(--border)' }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--text3)',
            textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:8 }}>
            Master (current)
          </div>
          {showAll
            ? allCols.map(col => (
                <div key={col.name} style={{ marginBottom:6 }}>
                  <div style={{ fontSize:10, color:'var(--text3)', fontFamily:'var(--mono)' }}>{col.label}</div>
                  <div style={{ fontSize:11, color:'var(--text1)', wordBreak:'break-all' }}>
                    {String(masterRow[col.name] ?? '-')}
                  </div>
                </div>
              ))
            : type === 'update'
              ? <>
                  {contextCols.map(col => (
                    <div key={col.name} style={{ marginBottom:6 }}>
                      <div style={{ fontSize:10, color:'var(--text3)', fontFamily:'var(--mono)' }}>{col.label}</div>
                      <div style={{ fontSize:11, color:'var(--text2)', wordBreak:'break-all' }}>
                        {String(masterRow[col.name] ?? '-')}
                      </div>
                    </div>
                  ))}
                  {contextCols.length > 0 && diffCols.length > 0 && changedDivider}
                  {diffCols.map(col => (
                    <div key={col.name} style={{ marginBottom:6 }}>
                      <div style={{ fontSize:10, color:'var(--text3)', fontFamily:'var(--mono)' }}>{col.label}</div>
                      <div style={{ fontSize:11, color:'var(--text1)', wordBreak:'break-all' }}>
                        {String(masterRow[col.name] ?? '-')}
                      </div>
                    </div>
                  ))}
                </>
              : diffCols.map(col => (
                  <div key={col.name} style={{ marginBottom:6 }}>
                    <div style={{ fontSize:10, color:'var(--text3)', fontFamily:'var(--mono)' }}>{col.label}</div>
                    <div style={{ fontSize:11, color:'var(--text1)', wordBreak:'break-all' }}>
                      {String(masterRow[col.name] ?? '-')}
                    </div>
                  </div>
                ))
          }
        </div>

        {/* Steward panel */}
        <div style={{ padding:'10px 12px' }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--text3)',
            textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:8 }}>
            Steward change
          </div>
          {type === 'retire'
            ? <div style={{ padding:'8px 10px', background:'rgba(245,166,35,0.08)',
                border:'1px solid rgba(245,166,35,0.3)', borderRadius:'var(--radius)',
                fontSize:11, color:'var(--amber)' }}>
                Steward wants to retire this record
              </div>
            : showAll
              ? allCols.map(col => (
                  <div key={col.name} style={{ marginBottom:6 }}>
                    <div style={{ fontSize:10, color:'var(--text3)', fontFamily:'var(--mono)' }}>{col.label}</div>
                    <div style={{ fontSize:11, wordBreak:'break-all',
                      color: diffColNames.has(col.name) ? 'var(--green)' : 'var(--text2)',
                      fontWeight: diffColNames.has(col.name) ? 500 : 400 }}>
                      {String(stewardRow[col.name] ?? '-')}
                    </div>
                  </div>
                ))
              : <>
                  {contextCols.map(col => (
                    <div key={col.name} style={{ marginBottom:6 }}>
                      <div style={{ fontSize:10, color:'var(--text3)', fontFamily:'var(--mono)' }}>{col.label}</div>
                      <div style={{ fontSize:11, color:'var(--text2)', wordBreak:'break-all' }}>
                        {String(stewardRow[col.name] ?? '-')}
                      </div>
                    </div>
                  ))}
                  {contextCols.length > 0 && diffCols.length > 0 && changedDivider}
                  {diffCols.map(col => (
                    <div key={col.name} style={{ marginBottom:6 }}>
                      <div style={{ fontSize:10, color:'var(--text3)', fontFamily:'var(--mono)' }}>{col.label}</div>
                      <div style={{ fontSize:11, color:'var(--green)', wordBreak:'break-all', fontWeight:500 }}>
                        {String(stewardRow[col.name] ?? '-')}
                      </div>
                    </div>
                  ))}
                </>
          }
        </div>
      </div>

      {/* Resolution buttons */}
      <div style={{ display:'flex', gap:8, padding:'7px 12px',
        borderTop:'1px solid var(--border)', background:'var(--bg3)', alignItems:'center' }}>
        <button
          className={`btn ${resolution === 'master' ? 'btn-primary' : 'btn-ghost'}`}
          style={{ fontSize:11, padding:'3px 10px' }}
          onClick={() => onResolve(cardKey, 'master')}>
          Keep master
        </button>
        <button
          className={`btn ${resolution === 'steward' ? 'btn-green' : 'btn-ghost'}`}
          style={{ fontSize:11, padding:'3px 10px' }}
          onClick={() => onResolve(cardKey, 'steward')}>
          {type === 'retire' ? 'Accept retirement' : 'Accept steward'}
        </button>
        <button className="btn btn-ghost" style={{ fontSize:11, padding:'3px 10px', marginLeft:'auto' }}
          onClick={() => setShowAll(s => !s)}>
          {showAll ? 'Hide fields' : 'Show all fields'}
        </button>
      </div>
    </div>
  );
}

// ===============================================================================
// TASK 6 -- DELTA MERGE PANEL
// ===============================================================================
function DeltaMergePanel({ deltaResult, resolutions, onResolve, onApply, onCancel }) {
  const { delta, processResult, versionMismatch, masterVersion } = deltaResult;
  const { remappedInserts, autoApplyUpdates, conflicts } = processResult;
  const allResolved = conflicts.every(c => resolutions[`${c.table}:${c.pk}`]);
  const totalInserts     = Object.values(remappedInserts).reduce((s, a) => s + a.length, 0);
  const totalAutoUpdates = autoApplyUpdates.length;

  return (
    <div>
      {/* Version mismatch warning */}
      {versionMismatch && (
        <div style={{ marginBottom:14, padding:'8px 12px',
          background:'rgba(245,166,35,0.08)', border:'1px solid rgba(245,166,35,0.35)',
          borderRadius:'var(--radius)', fontSize:11, color:'var(--amber)' }}>
          <span style={{ fontWeight:700 }}>Version mismatch: </span>
          this delta was built against{' '}
          <span style={{ fontFamily:'var(--mono)' }}>{delta._base_version}</span>
          {' '}but your current version is{' '}
          <span style={{ fontFamily:'var(--mono)' }}>{masterVersion}</span>.
          {' '}Conflict detection may be unreliable -- phantom conflicts are possible.
          You may still proceed.
        </div>
      )}

      {/* Delta summary card */}
      <div className="card" style={{ marginBottom:16, borderLeft:'3px solid var(--accent)' }}>
        <div className="card-title">
          <span style={{ width:3, height:14, borderRadius:2, background:'var(--accent)',
            display:'inline-block', marginRight:8 }}/>
          Delta import
          <span style={{ fontSize:9, fontFamily:'var(--mono)', fontWeight:700,
            color:'var(--accent)', background:'var(--accent-tint)',
            border:'1px solid var(--accent-border)', borderRadius:3,
            padding:'1px 6px', marginLeft:8 }}>STEWARD</span>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:12 }}>
          {[
            ['Steward',   delta._steward_name],
            ['Base version', delta._base_version || 'unknown'],
            ['Exported',  new Date(delta._exported_at).toLocaleString()],
          ].map(([l, v]) => (
            <div key={l} style={{ padding:'6px 10px', background:'var(--bg)', borderRadius:'var(--radius)' }}>
              <div style={{ fontSize:10, color:'var(--text3)', marginBottom:2 }}>{l}</div>
              <div style={{ fontSize:11, fontFamily:'var(--mono)', color:'var(--text1)' }}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          {[
            [totalInserts,     'inserts',      'var(--green)'],
            [totalAutoUpdates, 'auto-updates', 'var(--accent)'],
            [conflicts.length, 'conflicts',    conflicts.length > 0 ? 'var(--amber)' : 'var(--text3)'],
          ].map(([v, l, color]) => (
            <span key={l} style={{ fontSize:11, padding:'2px 8px', borderRadius:3,
              background:'var(--bg)', color, border:'1px solid var(--border)' }}>
              {v} {l}
            </span>
          ))}
        </div>
      </div>

      {/* No-conflict notice */}
      {conflicts.length === 0 && (
        <div style={{ marginBottom:14, padding:'8px 12px',
          background:'rgba(34,201,142,0.08)', border:'1px solid rgba(34,201,142,0.3)',
          borderRadius:'var(--radius)', fontSize:12, color:'var(--green)' }}>
          No conflicts -- all changes can be applied automatically.
        </div>
      )}

      {/* Conflict cards */}
      {conflicts.length > 0 && (
        <>
          <div style={{ fontSize:12, fontWeight:600, marginBottom:10, color:'var(--text2)' }}>
            {conflicts.length} conflict{conflicts.length !== 1 ? 's' : ''} -- resolve each before applying
          </div>
          {conflicts.map(c => (
            <DeltaConflictCard
              key={`${c.table}:${c.pk}`}
              conflict={c}
              resolution={resolutions[`${c.table}:${c.pk}`]}
              onResolve={onResolve}
            />
          ))}
        </>
      )}

      {/* Actions */}
      <div style={{ display:'flex', gap:10, marginTop:8 }}>
        <button className="btn btn-primary" onClick={onApply} disabled={!allResolved}>
          <Icon.Download/> Apply merge and download report
        </button>
        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// ===============================================================================
// IMPORT SCREEN
// ===============================================================================
function ImportScreen({ onImport, onMerge }) {
  const { data, isMaster, navigate } = useApp();
  const [dragging,            setDragging]            = useState(false);
  const [importing,           setImporting]           = useState(false);
  const [progress,            setProgress]            = useState(0);
  const [log,                 setLog]                 = useState([]);
  const [deltaResult,         setDeltaResult]         = useState(null);
  const [resolutions,         setResolutions]         = useState({});
  const [mergeReport,         setMergeReport]         = useState(null);
  const [pendingMasterImport, setPendingMasterImport] = useState(null);
  const [tab,                 setTab]                 = useState('standard');

  const handleFile = useCallback(async (file) => {
    if (!file) return;
    setDeltaResult(null); setMergeReport(null); setLog([]);
    setImporting(true); setProgress(10);
    try {
      if (file.name.endsWith('.json')) {
        const text    = await file.text();
        setProgress(40);
        const payload = JSON.parse(text);

        if (payload._type === 'master') {
          const snapshot = loadBaseSnapshot();
          if (snapshot && data) {
            const changes      = buildDelta(data, snapshot);
            const totalChanges = Object.values(changes)
              .reduce((s, c) => s + c.inserted.length + c.updated.length + c.retired.length, 0);
            if (totalChanges > 0) {
              setImporting(false);
              setPendingMasterImport({ payload, totalChanges });
              return;
            }
          }
          const version      = payload._version;
          const importedData = payload.data;
          setProgress(80);
          saveBaseVersion(version);
          saveBaseSnapshot(buildSnapshot(importedData));
          await new Promise(r => setTimeout(r, 200));
          setProgress(100);
          const importLog = [
            { level:'ok', msg:`Master import successful. Version: ${version}` },
            { level:'ok', msg:`Base snapshot recorded for ${DELTA_TABLES.length} delta-tracked tables.` },
          ];
          setLog(importLog);
          onImport(importedData, importLog);

        } else if (payload._type === 'delta') {
          if (!isMaster) {
            setLog([{ level:'err', msg:'Delta import is restricted to the master steward.' }]);
            setImporting(false);
            return;
          }
          setProgress(80);
          const processResult  = processDelta(payload, data, loadBaseSnapshot());
          const masterVersion  = loadBaseVersion();
          const versionMismatch = !!(masterVersion && payload._base_version &&
            payload._base_version !== masterVersion);
          setProgress(100);
          await new Promise(r => setTimeout(r, 100));
          setImporting(false);
          setDeltaResult({ delta: payload, processResult, versionMismatch,
            masterVersion: masterVersion || 'unknown' });
          setResolutions({});
          return;

        } else {
          throw new Error('Unrecognised JSON file (expected _type: master or delta).');
        }
      } else {
        const buf = await file.arrayBuffer();
        setProgress(40);
        const { data: importedData, log: importLog } = importWorkbook(buf);
        setProgress(80);
        await new Promise(r => setTimeout(r, 200));
        setProgress(100);
        setLog(importLog);
        onImport(importedData, importLog);
      }
    } catch (e) {
      setLog([{ level:'err', msg:`Import failed: ${e.message}` }]);
    } finally { setImporting(false); }
  }, [onImport, data, isMaster]);

  const handleResolve = useCallback((key, choice) => {
    setResolutions(prev => ({ ...prev, [key]: choice }));
  }, []);

  const handleApplyMerge = useCallback(() => {
    if (!deltaResult) return;
    const { delta, processResult } = deltaResult;
    const merged = applyMergedChanges(data, processResult, resolutions);
    const report = buildMergeReport(delta, processResult, resolutions);
    const blob = new Blob([JSON.stringify(report, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const ts   = new Date().toISOString().replace(/[:\-T]/g,'').slice(0, 15);
    a.href     = url;
    a.download = `dq_merge_report_${ts}.json`;
    a.click();
    URL.revokeObjectURL(url);
    onMerge(merged);
    saveBaseSnapshot(buildSnapshot(merged));
    setMergeReport(report);
    setDeltaResult(null);
    setResolutions({});
  }, [deltaResult, data, resolutions, onMerge]);

  const handleCancelDelta = useCallback(() => {
    setDeltaResult(null);
    setResolutions({});
  }, []);

  const baseVersion = loadBaseVersion();

  // Post-merge summary view
  if (mergeReport) {
    const { summary, _steward_name, _merged_at } = mergeReport;
    return (
      <div className="fade-in">
        <div className="page-title">Import</div>
        <div className="card" style={{ borderLeft:'3px solid #22c98e' }}>
          <div className="card-title"><span className="dot"/>Merge applied</div>
          <div style={{ fontSize:12, color:'var(--text2)', marginBottom:12 }}>
            Delta from <strong>{_steward_name}</strong> merged at {new Date(_merged_at).toLocaleString()}.
          </div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:14 }}>
            {[
              [`${summary.total_inserted} inserted`,                                    'var(--green)'],
              [`${summary.total_updated} updated`,                                      'var(--accent)'],
              [`${summary.total_retired} retired`,                                      'var(--amber)'],
              [`${summary.total_conflicts} conflict${summary.total_conflicts !== 1 ? 's' : ''} resolved`, 'var(--text3)'],
            ].map(([l, color]) => (
              <span key={l} style={{ fontSize:11, padding:'2px 8px', borderRadius:3,
                background:'var(--bg)', color, border:'1px solid var(--border)' }}>{l}</span>
            ))}
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <button className="btn btn-primary" style={{ fontSize:11 }}
              onClick={() => navigate({ screen:'export', table:null })}>
              <Icon.Download/> Export new Master JSON
            </button>
            <button className="btn btn-ghost" style={{ fontSize:11 }}
              onClick={() => setMergeReport(null)}>
              <Icon.Upload/> Import another file
            </button>
          </div>
        </div>
      </div>
    );
  }

  // Uncommitted-changes warning before master JSON import
  if (pendingMasterImport) {
    const { payload, totalChanges } = pendingMasterImport;
    const doImport = () => {
      const version      = payload._version;
      const importedData = payload.data;
      saveBaseVersion(version);
      saveBaseSnapshot(buildSnapshot(importedData));
      const importLog = [
        { level:'warn', msg:`Imported over ${totalChanges} uncommitted change${totalChanges !== 1 ? 's' : ''}.` },
        { level:'ok',  msg:`Master import successful. Version: ${version}` },
        { level:'ok',  msg:`Base snapshot recorded for ${DELTA_TABLES.length} delta-tracked tables.` },
      ];
      setPendingMasterImport(null);
      setLog(importLog);
      onImport(importedData, importLog);
    };
    return (
      <div className="fade-in">
        <div className="page-title">Import</div>
        <div className="card" style={{ borderLeft:'3px solid var(--amber)' }}>
          <div className="card-title">
            <span style={{ width:3, height:14, borderRadius:2, background:'var(--amber)',
              display:'inline-block', marginRight:8 }}/>
            Uncommitted changes detected
          </div>
          <div style={{ fontSize:12, color:'var(--text2)', marginBottom:12 }}>
            You have <strong>{totalChanges} uncommitted change{totalChanges !== 1 ? 's' : ''}</strong> that
            have not been exported as a delta. Importing this master file will permanently overwrite
            your local data and these changes will be lost.
          </div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <button className="btn btn-primary" style={{ fontSize:11 }}
              onClick={() => navigate({ screen:'export', table:null })}>
              <Icon.Download/> Go to Export first
            </button>
            <button className="btn btn-danger" style={{ fontSize:11 }} onClick={doImport}>
              Import anyway
            </button>
            <button className="btn btn-ghost" style={{ fontSize:11 }}
              onClick={() => setPendingMasterImport(null)}>
              Cancel
            </button>
          </div>
        </div>
      </div>
    );
  }

  // Delta conflict resolution view
  if (deltaResult) {
    return (
      <div className="fade-in">
        <div className="page-title">Import</div>
        <div className="page-sub">Review and resolve conflicts before applying the steward delta.</div>
        <DeltaMergePanel
          deltaResult={deltaResult}
          resolutions={resolutions}
          onResolve={handleResolve}
          onApply={handleApplyMerge}
          onCancel={handleCancelDelta}
        />
      </div>
    );
  }

  // Standard import view
  const tabs = [
    { id:'standard',  label:'Full Dataset / Delta' },
    { id:'shortlist', label:'CDE Shortlist Assessment' },
  ];

  return (
    <div className="fade-in">
      <div className="page-title">Import</div>

      {/* Tab bar */}
      <div style={{ display:'flex', gap:0, marginBottom:20, borderBottom:'1px solid var(--border)' }}>
        {tabs.map(function(t) {
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={function() { setTab(t.id); }} style={{
              padding:'8px 20px', fontSize:13, fontWeight: active ? 700 : 400,
              color: active ? 'var(--green)' : 'var(--text3)',
              background:'transparent', border:'none', borderBottom: active ? '2px solid var(--green)' : '2px solid transparent',
              cursor:'pointer', marginBottom:'-1px', transition:'color 0.15s',
            }}>{t.label}</button>
          );
        })}
      </div>

      {/* Tab: Full dataset / Delta */}
      {tab === 'standard' && (
        <div>
          <div className="page-sub" style={{ marginBottom:14 }}>
            Load a master JSON to refresh the metadata or import a full Excel workbook to seed the initial metadata.
          </div>

          {baseVersion && (
            <div style={{ marginBottom:14, padding:'6px 12px',
              background:'rgba(245,166,35,0.06)', border:'1px solid rgba(245,166,35,0.3)',
              borderRadius:'var(--radius)', fontSize:11, color:'var(--text3)',
              fontFamily:'var(--mono)' }}>
              Current base version: <span style={{ color:'var(--amber)', fontWeight:600 }}>{baseVersion}</span>
            </div>
          )}

          {isMaster && (
            <div style={{ marginBottom:14, padding:'6px 12px',
              background:'rgba(24,180,212,0.06)', border:'1px solid rgba(24,180,212,0.3)',
              borderRadius:'var(--radius)', fontSize:11, color:'var(--text3)' }}>
              Drop a <span style={{ fontFamily:'var(--mono)', color:'var(--accent)' }}>dq_delta_*.json</span> file to review and merge a steward delta.
            </div>
          )}

          <div className={`upload-zone ${dragging ? 'drag-over' : ''}`}
            onDragOver={e => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={e => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}>
            <input type="file" accept=".xlsx,.xls,.json" onChange={e => handleFile(e.target.files[0])}/>
            <svg className="upload-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="1.5">
              <rect x="8" y="4" width="28" height="40" rx="3"/>
              <path d="M28 4v12h12M18 28l6-6 6 6M24 22v14"/>
            </svg>
            <div className="upload-title">{importing ? 'Importing...' : 'Drop your file here'}</div>
            <div className="upload-sub">{importing ? 'Reading file...' : 'Master JSON, steward delta, or Excel workbook'}</div>
          </div>

          {importing && (
            <div style={{ marginTop:10 }}>
              <div className="progress-bar-wrap">
                <div className="progress-bar" style={{ width:`${progress}%` }}/>
              </div>
            </div>
          )}
          {log.length > 0 && (
            <div style={{ marginTop:14, display:'flex', flexDirection:'column', gap:3 }}>
              {log.map((e, i) => (
                <div key={i} className={`status-row ${e.level==='err'?'status-err':e.level==='warn'?'status-warn':'status-info'}`}>
                  {e.msg}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Tab: CDE Shortlist */}
      {tab === 'shortlist' && (
        <ShortlistImportTab onImport={onMerge} />
      )}

    </div>
  );
}


// ===============================================================================
// COMPUTE STEWARD GAPS -- pure function, no React, called inside useMemo
// ===============================================================================
function computeStewardGaps(data, stewardIdentity) {
  const live = (t) => (data[t] || []).filter(r => !r.retiring_timestamp);

  // My CDS ids -- exclude master marker record (critical_data_set_id = 0)
  const myStew = live('stewardship').filter(s =>
    s.data_steward_id === stewardIdentity.id && s.critical_data_set_id !== 0
  );
  const myCdsIds = new Set(myStew.map(s => s.critical_data_set_id));

  // Index tables for fast lookup
  const cdsById = {};
  live('critical_data_set').forEach(c => { cdsById[c.critical_data_set_id] = c; });
  const dirById = {};
  live('directorate').forEach(d => { dirById[d.directorate_id] = d; });

  // Agencies derived from my CDSes via directorate chain
  const myAgencyIds = new Set();
  myCdsIds.forEach(id => {
    const cds = cdsById[id];
    if (!cds) return;
    const dir = dirById[cds.directorate_id];
    if (dir) myAgencyIds.add(dir.executive_agency_id);
  });

  // All directorate ids in my agencies
  const myAgencyDirIds = new Set(
    live('directorate')
      .filter(d => myAgencyIds.has(d.executive_agency_id))
      .map(d => d.directorate_id)
  );

  // My CDEs
  const myCdes = live('critical_data_element').filter(c => myCdsIds.has(c.critical_data_set_id));
  const myCdeIds = new Set(myCdes.map(c => c.critical_data_element_id));

  // CDSes in my agencies that have no live stewardship record
  const ownedCdsIds = new Set(
    live('stewardship')
      .filter(s => s.critical_data_set_id !== 0)
      .map(s => s.critical_data_set_id)
  );
  const unownedCds = live('critical_data_set').filter(c =>
    myAgencyDirIds.has(c.directorate_id) && !ownedCdsIds.has(c.critical_data_set_id)
  );

  // CDE count per CDS (for empty/unprotected detection)
  const cdeCountByCds = {};
  live('critical_data_element').forEach(c => {
    cdeCountByCds[c.critical_data_set_id] = (cdeCountByCds[c.critical_data_set_id] || 0) + 1;
  });

  // Empty CDSes: my CDSes with 0 CDEs
  const emptyCds = live('critical_data_set').filter(c =>
    myCdsIds.has(c.critical_data_set_id) && !cdeCountByCds[c.critical_data_set_id]
  );

  // Rule allocations covering my CDEs
  const myAllocations = live('data_quality_rule_allocation').filter(a =>
    myCdeIds.has(a.critical_data_element_id)
  );
  const coveredCdeIds = new Set(myAllocations.map(a => a.critical_data_element_id));

  // Unprotected CDSes: have CDEs but zero rules on any of them
  const unprotectedCds = live('critical_data_set').filter(c => {
    if (!myCdsIds.has(c.critical_data_set_id)) return false;
    const cdesInCds = myCdes.filter(cde => cde.critical_data_set_id === c.critical_data_set_id);
    if (cdesInCds.length === 0) return false;
    return !cdesInCds.some(cde => coveredCdeIds.has(cde.critical_data_element_id));
  });

  // Unprotected CDEs: individually have no rule allocations
  const unprotectedCdes = myCdes.filter(c => !coveredCdeIds.has(c.critical_data_element_id));

  // Profiling key set: db|table|field
  const profilingKey = r =>
    (r.source_database_name || '') + '|' +
    (r.source_table_name    || '') + '|' +
    (r.source_field_name    || '');
  const profilingKeys = new Set(live('field_profiling').map(profilingKey));

  // Unprofiled CDEs: no matching field_profiling record
  const unprofiledCdes = myCdes.filter(c => !profilingKeys.has(profilingKey(c)));

  // Unrated CDEs: no cde_criticality record
  const ratedCdeIds = new Set(live('cde_criticality').map(c => c.critical_data_element_id));
  const unratedCdes = myCdes.filter(c => !ratedCdeIds.has(c.critical_data_element_id));

  // Incomplete definitions: missing definition or explanation
  const incompleteCdes = myCdes.filter(c =>
    !c.data_element_definition || !c.data_element_explanation
  );

  // Undocumented CDSes: my CDSes missing a data_set_description
  const undocumentedCds = live('critical_data_set').filter(c =>
    myCdsIds.has(c.critical_data_set_id) && !c.data_set_description
  );

  // Quality dimension coverage
  const dims = (data.quality_dimension || []);
  const coveredDimIds = new Set(myAllocations.map(a => a.quality_dimension_id));
  const uncoveredDims = dims.filter(d => !coveredDimIds.has(d.quality_dimension_id));
  const dimensionCoverage = dims.map(d => {
    const coveredCount = new Set(
      myAllocations
        .filter(a => a.quality_dimension_id === d.quality_dimension_id)
        .map(a => a.critical_data_element_id)
    ).size;
    return { dim: d, coveredCount, totalCdes: myCdeIds.size };
  }).sort((a, b) => a.coveredCount - b.coveredCount);

  // Profiled CDE ids (for summary)
  const profiledCdeIds = new Set(
    myCdes.filter(c => profilingKeys.has(profilingKey(c))).map(c => c.critical_data_element_id)
  );

  // My CDSes summary: one row per CDS I own
  const myCdsSummary = live('critical_data_set')
    .filter(c => myCdsIds.has(c.critical_data_set_id))
    .map(cds => {
      const cdesInCds  = myCdes.filter(c => c.critical_data_set_id === cds.critical_data_set_id);
      const cdeCount   = cdesInCds.length;
      const cdeIdsInCds = new Set(cdesInCds.map(c => c.critical_data_element_id));
      const ruleCount  = myAllocations.filter(a => cdeIdsInCds.has(a.critical_data_element_id)).length;
      const ratedCount = cdesInCds.filter(c => ratedCdeIds.has(c.critical_data_element_id)).length;
      const profiledCount = cdesInCds.filter(c => profiledCdeIds.has(c.critical_data_element_id)).length;
      return { cds, cdeCount, ruleCount, ratedCount, profiledCount };
    });

  // Scoped FK integrity issues: filter runHealthCheck output to my scope
  const { issues: allIssues } = runHealthCheck(data);
  const scopedIssues = allIssues.filter(iss => {
    if (iss.table === 'critical_data_element')        return myCdeIds.has(iss.pk);
    if (iss.table === 'critical_data_set')            return myCdsIds.has(iss.pk);
    if (iss.table === 'data_quality_rule_allocation') {
      const a = (data.data_quality_rule_allocation || []).find(r => r.data_quality_rule_allocation_id === iss.pk);
      return a && myCdeIds.has(a.critical_data_element_id);
    }
    if (iss.table === 'cde_criticality') {
      const c = (data.cde_criticality || []).find(r => r.cde_criticality_id === iss.pk);
      return c && myCdeIds.has(c.critical_data_element_id);
    }
    if (iss.table === 'stewardship') {
      const s = (data.stewardship || []).find(r => r.stewardship_id === iss.pk);
      return s && myCdsIds.has(s.critical_data_set_id);
    }
    return false;
  });

  return {
    myCdsIds, myAgencyIds, myCdeIds,
    unownedCds, emptyCds, unprotectedCds, unprotectedCdes,
    unprofiledCdes, unratedCdes, incompleteCdes, undocumentedCds,
    uncoveredDims, dimensionCoverage,
    myCdsSummary, scopedIssues,
  };
}

// ===============================================================================
// ACTION CARD -- simple click-to-navigate card
// ===============================================================================
function ActionCard({ count, label, description, screen, table, onNavigate }) {
  const hasGap = count > 0;
  const accent = hasGap ? 'var(--amber)' : 'var(--green)';
  return (
    <div
      onClick={() => onNavigate({ screen: screen, table: table || null })}
      style={{
        background: 'var(--bg2)',
        border: '1px solid ' + (hasGap ? 'var(--amber)' : 'var(--border)'),
        borderLeft: '3px solid ' + accent,
        borderRadius: 'var(--radius)',
        padding: '14px 16px',
        cursor: 'pointer',
        flex: '1 1 155px',
        maxWidth: 215,
      }}
    >
      <div style={{ fontSize: 28, fontWeight: 700, color: accent, lineHeight: 1, marginBottom: 6 }}>
        {count}
      </div>
      <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text)', marginBottom: 4 }}>
        {label}
      </div>
      <div style={{ fontSize: 11, color: 'var(--text3)', lineHeight: 1.4 }}>
        {description}
      </div>
    </div>
  );
}

// ===============================================================================
// EXPANDABLE ACTION CARD -- card that reveals a drillable item list on click.
// Each item has { label, sublabel?, navigateTo } where navigateTo is passed
// directly to onNavigate -- same contract as the navigate() context function.
// Use this variant when the steward needs to act on a specific named record,
// not just navigate to a generic page.
// ===============================================================================
function ExpandableActionCard({ count, label, description, items, onNavigate }) {
  const [open, setOpen] = useState(false);
  const hasGap = count > 0;
  const accent = hasGap ? 'var(--amber)' : 'var(--green)';
  const isOpen = hasGap && open;

  return (
    <div style={{ flex: '1 1 155px', maxWidth: 215 }}>
      <div
        onClick={function() { if (hasGap) setOpen(function(o) { return !o; }); }}
        style={{
          background: 'var(--bg2)',
          border: '1px solid ' + (hasGap ? 'var(--amber)' : 'var(--border)'),
          borderLeft: '3px solid ' + accent,
          borderRadius: isOpen ? 'var(--radius) var(--radius) 0 0' : 'var(--radius)',
          padding: '14px 16px',
          cursor: hasGap ? 'pointer' : 'default',
        }}
      >
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
          <div style={{ fontSize: 28, fontWeight: 700, color: accent, lineHeight: 1, marginBottom: 6 }}>
            {count}
          </div>
          {hasGap && (
            <span style={{
              color: 'var(--text3)', fontSize: 12, flexShrink: 0,
              display: 'inline-block',
              transform: isOpen ? 'rotate(180deg)' : 'none',
              transition: 'transform 0.15s',
            }}>{'\u25be'}</span>
          )}
        </div>
        <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text)', marginBottom: 4 }}>
          {label}
        </div>
        <div style={{ fontSize: 11, color: 'var(--text3)', lineHeight: 1.4 }}>
          {description}
        </div>
      </div>

      {isOpen && (
        <div style={{
          border: '1px solid var(--amber)',
          borderTop: 'none',
          borderRadius: '0 0 var(--radius) var(--radius)',
          background: 'var(--bg3)',
          maxHeight: 180,
          overflowY: 'auto',
        }}>
          {items.map(function(item, i) {
            return (
              <div
                key={i}
                onClick={function() { onNavigate(item.navigateTo); }}
                style={{
                  padding: '7px 10px',
                  borderTop: i > 0 ? '1px solid var(--border)' : 'none',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 6,
                }}
              >
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{
                    fontSize: 11, fontWeight: 500, color: 'var(--text)',
                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>
                    {item.label}
                  </div>
                  {item.sublabel && (
                    <div style={{ fontSize: 10, color: 'var(--text3)' }}>{item.sublabel}</div>
                  )}
                </div>
                <span style={{ color: 'var(--text3)', fontSize: 11, flexShrink: 0 }}>{'\u2192'}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
