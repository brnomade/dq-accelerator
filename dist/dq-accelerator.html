          <div style={{ marginTop:8, padding:'12px 16px',
            background:'var(--bg3)', borderRadius:'var(--radius)',
            fontSize:12, color:'var(--text2)', lineHeight:1.8 }}>
            {cdeNames.length > 0 && (
              <div><strong>Fields:</strong> {cdeNames.join(', ')}</div>
            )}
            {tableNamesList.length > 0 && (
              <div><strong>Tables:</strong> {tableNamesList.join(', ')}</div>
            )}
            {dimensionNames.length > 0 && (
              <div><strong>Quality dimensions:</strong> {dimensionNames.join(', ')}</div>
            )}
            {cdeNames.length === 0 && (
              <div style={{ color:'var(--text3)' }}>
                No specific fields selected -- the AI will help identify the relevant field.
              </div>
            )}
          </div>
        )}
      </div>

      {/* Prompt textarea */}
      <textarea
        readOnly
        value={builtPrompt}
        rows={16}
        style={{
          width:'100%', padding:'12px', fontSize:12,
          fontFamily:'var(--mono)', background:'var(--bg)',
          border:'1px solid var(--border)', borderRadius:'var(--radius)',
          color:'var(--text2)', resize:'vertical', marginBottom:12, outline:'none',
        }}
      />

      {/* Copy button */}
      <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:8 }}>
        <button className={copyConfirmed ? 'btn btn-green' : 'btn btn-primary'}
          onClick={onCopy} style={{ fontSize:14 }}>
          <Icon.Copy/>
          {copyConfirmed ? 'Copied!' : 'Copy to clipboard'}
        </button>
        <button className="btn btn-ghost" onClick={onBack}>
          Edit scope
        </button>
      </div>

      {copyConfirmed && (
        <div style={{ fontSize:12, color:'var(--text3)', marginTop:4 }}>
          Paste this into your AI assistant. Come back here when it has produced a rule proposal.
        </div>
      )}
    </div>
  );
}

// ===============================================================================
// G4.1 -- STAGE 3 PANEL
// ===============================================================================

function Stage3Panel({
  pasteText, onPasteChange, onParse, parseResult,
  onAddContextCopy, data, extraTableIds, onExtraTableToggle,
  onRegeneratePrompt,
}) {
  const [showAddCtx, setShowAddCtx] = useState(false);
  const [suppSel,    setSuppSel]    = useState([]);
  const ddls = (data.source_table_ddl || []).filter(d => !d.retiring_timestamp);

  return (
    <div>
      <p style={{ fontSize:13, color:'var(--text2)', marginBottom:14, lineHeight:1.7 }}>
        Paste your AI assistant output below. You can paste the full conversation transcript --
        the parser will extract the rule proposal automatically.
      </p>

      <textarea
        value={pasteText}
        onChange={e => onPasteChange(e.target.value)}
        rows={10}
        placeholder={'Paste the AI response or full conversation transcript here...'}
        style={{
          width:'100%', padding:'12px', fontSize:12,
          fontFamily:'var(--mono)', background:'var(--bg3)',
          border:'1px solid var(--border)', borderRadius:'var(--radius)',
          color:'var(--text)', resize:'vertical', marginBottom:12, outline:'none',
        }}
      />

      <div style={{ display:'flex', gap:10, marginBottom:16 }}>
        <button className="btn btn-primary" onClick={onParse}
          disabled={!pasteText || !pasteText.trim()}>
          Parse result
        </button>
        <button className="btn btn-ghost" onClick={onRegeneratePrompt}>
          Re-generate prompt
        </button>
      </div>

      {/* Parse result status */}
      {parseResult && (
        <div style={{ marginBottom:16 }}>
          {parseResult.notFound && (
            <div className="status-row status-err">
              <Icon.Warning/>
              No rule proposal found. The AI output should contain lines like:
              <span style={{ fontFamily:'var(--mono)', marginLeft:6 }}>===RULE_PROPOSAL_START===</span>
            </div>
          )}
          {parseResult.proposals && parseResult.proposals.length > 0 && (
            <div className="status-row status-ok">
              <Icon.Check/>
              {parseResult.proposals.length} proposal{parseResult.proposals.length !== 1 ? 's' : ''} found -- scroll down to review.
            </div>
          )}
          {parseResult.errors && parseResult.errors.length > 0 && (
            <div className="status-row status-warn" style={{ marginTop:6 }}>
              <Icon.Warning/>
              {parseResult.errors.length} block{parseResult.errors.length !== 1 ? 's' : ''} could not be parsed (JSON error). Check the AI output format.
            </div>
          )}
          {parseResult.versionMismatch && (
            <div className="status-row status-warn" style={{ marginTop:6 }}>
              <Icon.Warning/>
              Prompt version mismatch. The AI may have used an older prompt -- review the proposal carefully.
            </div>
          )}
        </div>
      )}

      {/* Add context */}
      <div style={{ borderTop:'1px solid var(--border)', paddingTop:14, marginTop:8 }}>
        <div onClick={() => setShowAddCtx(v => !v)}
          style={{ cursor:'pointer', fontSize:12, color:'var(--text3)',
            display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ transform: showAddCtx ? 'rotate(90deg)' : 'none',
            display:'inline-block', transition:'transform 0.15s' }}>&#9658;</span>
          AI needs more information? Add supplementary context
        </div>
        {showAddCtx && (
          <div style={{ marginTop:10 }}>
            <div style={{ fontSize:12, color:'var(--text2)', marginBottom:8 }}>
              Select additional tables to include and copy a short supplementary prompt:
            </div>
            {ddls.length === 0
              ? <div style={{ fontSize:12, color:'var(--text3)' }}>
                  No Profiling data is available. Profile tables or CDEs to enable this.
                </div>
              : ddls.map(ddl => {
                  const sel = suppSel.includes(ddl.source_table_ddl_id);
                  return (
                    <div key={ddl.source_table_ddl_id}
                      onClick={() => setSuppSel(prev =>
                        sel ? prev.filter(x => x !== ddl.source_table_ddl_id)
                            : [...prev, ddl.source_table_ddl_id]
                      )}
                      style={{ display:'flex', alignItems:'center', gap:8,
                        padding:'4px 0', cursor:'pointer', fontSize:13 }}>
                      <input type="checkbox" readOnly checked={sel} style={{ cursor:'pointer' }}/>
                      <span style={{ color: sel ? 'var(--text)' : 'var(--text2)' }}>
                        {ddl.source_table_name}
                      </span>
                    </div>
                  );
                })
            }
            {suppSel.length > 0 && (
              <button className="btn btn-ghost" style={{ marginTop:10 }}
                onClick={() => onAddContextCopy(suppSel)}>
                <Icon.Copy/> Copy supplementary prompt
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ===============================================================================
// G6.2 -- PROPOSAL REVIEW CARD
// ===============================================================================

function ProposalReviewCard({ proposal, index, validation, onCommit, onRefine, onUpdate, onDiscard, data }) {
  const dims   = (data.quality_dimension     || []).filter(d => !d.retiring_timestamp);
  const cdes   = (data.critical_data_element || []).filter(c => !c.retiring_timestamp);

  const [local, setLocal] = useState(() => ({ ...proposal }));
  const [showTech, setShowTech] = useState(false);
  const [committing, setCommitting] = useState(false);
  const [commitError, setCommitError] = useState('');

  const update = (field, val) => {
    const next = { ...local, [field]: val };
    setLocal(next);
    onUpdate(index, next);
  };

  const liveValidation = validateProposal(local, data);
  const canCommit = liveValidation.valid && !!local.cde_id;

  const inputStyle = {
    width:'100%', padding:'7px 10px', fontSize:13,
    background:'var(--bg3)', border:'1px solid var(--border)',
    borderRadius:'var(--radius)', color:'var(--text)',
    fontFamily:'var(--sans)', outline:'none',
  };
  const monoStyle = { ...inputStyle, fontFamily:'var(--mono)', fontSize:12 };

  if (proposal.committed) {
    return (
      <div className="card" style={{ borderColor:'var(--green)', marginBottom:16 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <span className="badge badge-green">Committed</span>
          <span style={{ fontWeight:600, fontSize:14 }}>{proposal.rule_name}</span>
        </div>
        {proposal._createdRuleId && (
          <div style={{ fontSize:12, color:'var(--text3)', marginTop:8 }}>
            Rule ID: {proposal._createdRuleId} &nbsp;|&nbsp;
            Allocation ID: {proposal._createdAllocId}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="card" style={{ marginBottom:20,
      borderColor: commitError ? 'var(--red)' : 'var(--border)' }}>

      {/* Card header */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:16 }}>
        <span className="badge badge-blue">Proposal {index + 1}</span>
        {liveValidation.valid
          ? <span className="badge badge-green">Ready to commit</span>
          : <span className="badge badge-amber">{liveValidation.gaps.length} issue{liveValidation.gaps.length !== 1 ? 's' : ''}</span>
        }
      </div>

      {/* ---- BUSINESS REVIEW SECTION ---- */}
      <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase',
        color:'var(--text3)', marginBottom:14, borderBottom:'1px solid var(--border)', paddingBottom:6 }}>
        Business Review
      </div>

      {/* Rule name */}
      <div style={{ marginBottom:12 }}>
        <label style={{ display:'block', fontSize:11, color:'var(--text3)',
          marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
          Rule name *
        </label>
        <input type="text" value={local.rule_name || ''} onChange={e => update('rule_name', e.target.value)}
          style={inputStyle}/>
      </div>

      {/* Rule narrative */}
      <div style={{ marginBottom:12 }}>
        <label style={{ display:'block', fontSize:11, color:'var(--text3)',
          marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
          Rule description (plain language) *
        </label>
        <textarea value={local.rule_narrative || ''} onChange={e => update('rule_narrative', e.target.value)}
          rows={3} style={{ ...inputStyle, resize:'vertical' }}/>
        <div style={{ fontSize:11, color:'var(--text3)', marginTop:2 }}>
          This is the primary statement of what the rule checks, confirmed with the steward.
        </div>
      </div>

      {/* Rule examples */}
      {local.rule_examples && Array.isArray(local.rule_examples) && local.rule_examples.length > 0 && (
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:11, color:'var(--text3)', fontWeight:600,
            textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:6 }}>
            Examples of failing records
          </div>
          <ul style={{ paddingLeft:18, margin:0 }}>
            {local.rule_examples.map((ex, i) => (
              <li key={i} style={{ fontSize:13, color:'var(--text2)', marginBottom:4, lineHeight:1.5 }}>
                {ex}
              </li>
            ))}
          </ul>
        </div>
      )}
      {(!local.rule_examples || !Array.isArray(local.rule_examples) || local.rule_examples.length === 0) && (
        <div className="status-row status-warn" style={{ marginBottom:12 }}>
          <Icon.Warning/> The AI did not provide examples of failing records. Consider refining.
        </div>
      )}

      {/* Rule explanation */}
      <div style={{ marginBottom:12 }}>
        <label style={{ display:'block', fontSize:11, color:'var(--text3)',
          marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
          Additional explanation (optional)
        </label>
        <textarea value={local.rule_explanation || ''} onChange={e => update('rule_explanation', e.target.value)}
          rows={2} style={{ ...inputStyle, resize:'vertical' }}/>
      </div>

      {/* Quality dimension */}
      <div style={{ marginBottom:12 }}>
        <label style={{ display:'block', fontSize:11, color:'var(--text3)',
          marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
          Type of check *
        </label>
        <select value={local.quality_dimension_id || ''} onChange={e => update('quality_dimension_id', parseInt(e.target.value) || null)}
          style={{ ...inputStyle }}>
          <option value="">-- select --</option>
          {dims.map(d => (
            <option key={d.quality_dimension_id} value={d.quality_dimension_id}>{d.dimension_name}</option>
          ))}
        </select>
        {validation.staleIds.some(s => s.startsWith('quality_dimension_id')) && (
          <div style={{ fontSize:11, color:'var(--amber)', marginTop:3, display:'flex', alignItems:'center', gap:5 }}>
            <span style={{ width:13, height:13, display:'flex', alignItems:'center', flexShrink:0 }}><Icon.Warning/></span>
            The quality dimension ID from the AI no longer exists -- please re-select.
          </div>
        )}
      </div>

      {/* CDE */}
      <div style={{ marginBottom:12 }}>
        <label style={{ display:'block', fontSize:11, color:'var(--text3)',
          marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
          Data field *
        </label>
        {local.cde_suggestion && !local.cde_id && (
          <div style={{ fontSize:12, color:'var(--amber)', marginBottom:4 }}>
            AI suggested: "{local.cde_suggestion}" -- please select the matching field below.
          </div>
        )}
        <select value={local.cde_id || ''} onChange={e => update('cde_id', parseInt(e.target.value) || null)}
          style={{ ...inputStyle }}>
          <option value="">-- select --</option>
          {cdes.map(c => (
            <option key={c.critical_data_element_id} value={c.critical_data_element_id}>
              {c.source_field_name} ({c.source_table_name})
            </option>
          ))}
        </select>
        {validation.staleIds.some(s => s.startsWith('cde_id')) && (
          <div style={{ fontSize:11, color:'var(--amber)', marginTop:3, display:'flex', alignItems:'center', gap:5 }}>
            <span style={{ width:13, height:13, display:'flex', alignItems:'center', flexShrink:0 }}><Icon.Warning/></span>
            The CDE ID from the AI no longer exists -- please re-select.
          </div>
        )}
      </div>

      {/* Pass target + frequency */}
      <div style={{ display:'flex', gap:12, marginBottom:12 }}>
        <div style={{ flex:1 }}>
          <label style={{ display:'block', fontSize:11, color:'var(--text3)',
            marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
            Pass target *
          </label>
          <input type="number" min={0} max={1} step={0.01}
            value={local.bumper_value !== undefined && local.bumper_value !== null ? local.bumper_value : ''}
            onChange={e => update('bumper_value', parseFloat(e.target.value))}
            style={inputStyle}/>
          <div style={{ fontSize:11, color:'var(--text3)', marginTop:2 }}>
            0-1 (e.g. 0.99 = 99 in every 100 records must pass)
          </div>
        </div>
        <div style={{ flex:1 }}>
          <label style={{ display:'block', fontSize:11, color:'var(--text3)',
            marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
            Frequency *
          </label>
          <select value={local.frequency || ''} onChange={e => update('frequency', e.target.value)}
            style={inputStyle}>
            <option value="">-- select --</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <div style={{ flex:1 }}>
          <label style={{ display:'block', fontSize:11, color:'var(--text3)',
            marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
            Automated
          </label>
          <div style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 0' }}>
            <label className="toggle">
              <input type="checkbox" checked={!!local.automated}
                onChange={e => update('automated', e.target.checked)}/>
              <span className="toggle-track"/>
              <span className="toggle-thumb"/>
            </label>
            <span className="toggle-label">{local.automated ? 'Yes' : 'No'}</span>
          </div>
        </div>
      </div>

      {/* Steward notes */}
      {local.steward_notes && (
        <div style={{ marginBottom:12, padding:'10px 12px',
          background:'var(--bg3)', borderRadius:'var(--radius)',
          borderLeft:'3px solid var(--accent)', fontSize:12, color:'var(--text2)' }}>
          <strong>AI notes:</strong> {local.steward_notes}
        </div>
      )}

      {/* ---- TECHNICAL DETAILS (collapsed) ---- */}
      <div style={{ borderTop:'1px solid var(--border)', paddingTop:12, marginTop:4 }}>
        <div onClick={() => setShowTech(v => !v)}
          style={{ cursor:'pointer', fontSize:12, color:'var(--text3)',
            display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ transform: showTech ? 'rotate(90deg)' : 'none',
            display:'inline-block', transition:'transform 0.15s' }}>&#9658;</span>
          {showTech ? 'Hide technical details' : 'Show technical details (SQL)'}
        </div>

        {showTech && (
          <div style={{ marginTop:12 }}>
            <div style={{ marginBottom:12 }}>
              <label style={{ display:'block', fontSize:11, color:'var(--text3)',
                marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
                SQL rule *
              </label>
              <textarea value={local.sql_code || ''} onChange={e => update('sql_code', e.target.value)}
                rows={5} style={{ ...monoStyle, resize:'vertical' }}/>
            </div>
            <div style={{ marginBottom:4 }}>
              <label style={{ display:'block', fontSize:11, color:'var(--text3)',
                marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>
                Simplified SQL (optional)
              </label>
              <textarea value={local.sql_code_sample || ''} onChange={e => update('sql_code_sample', e.target.value)}
                rows={3} style={{ ...monoStyle, resize:'vertical' }}/>
            </div>
          </div>
        )}
      </div>

      {/* Validation issues */}
      {liveValidation.gaps.length > 0 && (
        <div style={{ marginTop:12 }}>
          {liveValidation.gaps.map((g, i) => (
            <div key={i} style={{ fontSize:12, color:'var(--amber)', display:'flex', gap:6, alignItems:'flex-start', marginBottom:3 }}>
              <span style={{ width:14, height:14, display:'flex', alignItems:'center', flexShrink:0, marginTop:1 }}><Icon.Warning/></span>
              {g}
            </div>
          ))}
        </div>
      )}

      {commitError && (
        <div className="status-row status-err" style={{ marginTop:10 }}>
          <Icon.Warning/> {commitError}
        </div>
      )}

      {/* Action buttons */}
      <div style={{ display:'flex', gap:10, marginTop:16, flexWrap:'wrap' }}>
        <button className="btn btn-primary" disabled={!canCommit}
          onClick={async () => {
            setCommitError('');
            setCommitting(true);
            try {
              await onCommit(index, local);
            } catch (e) {
              setCommitError(e.message || 'Commit failed');
            } finally {
              setCommitting(false);
            }
          }}>
          {committing ? 'Creating...' : 'Create rule'}
        </button>
        <button className="btn btn-ghost" onClick={() => onRefine(index, local)}>
          Refine further
        </button>
        <button className="btn btn-ghost" style={{ color:'var(--red)', borderColor:'var(--red)' }}
          onClick={() => onDiscard(index)}>
          Discard
        </button>
      </div>
    </div>
  );
}

// ===============================================================================
// G6.1 -- STAGE 4 PANEL
// ===============================================================================

function Stage4Panel({ proposals, validations, onCommit, onRefine, onUpdate, onDiscard, data }) {
  const uncommitted = proposals.filter(p => !p.committed);

  if (proposals.length === 0) {
    return (
      <div className="status-row status-info" style={{ marginBottom:16 }}>
        No proposals to review. Go back to Step 3 and parse the AI output.
      </div>
    );
  }

  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:20 }}>
        <div className="page-title" style={{ marginBottom:0 }}>
          Review {proposals.length} rule proposal{proposals.length !== 1 ? 's' : ''}
        </div>
        {uncommitted.length > 0 && (
          <span className="badge badge-amber">{uncommitted.length} pending</span>
        )}
        {uncommitted.length === 0 && proposals.length > 0 && (
          <span className="badge badge-green">All committed</span>
        )}
      </div>

      {proposals.map((p, i) => (
        <ProposalReviewCard
          key={i}
          index={i}
          proposal={p}
          validation={validations[i] || { gaps:[], staleIds:[], warns:[] }}
          onCommit={onCommit}
          onRefine={onRefine}
          onUpdate={onUpdate}
          onDiscard={onDiscard}
          data={data}
        />
      ))}
    </div>
  );
}

// ===============================================================================
// G1.1 + G7.1 + G8 -- MAIN ASSISTANT SCREEN
// ===============================================================================

function AssistantScreen() {
  const { data, canEdit, upsertRecord, nextPk, navigate } = useApp();
  const dp = !canEdit
    ? { style:{ opacity:0.4, pointerEvents:'none' },
        title:'Set your steward identity in Settings to use the DQ Assistant' }
    : {};

  // Load persisted state
  const [stage,            setStage]           = useState(1);
  const [conversationMode, setConversationMode] = useState('business');
  const [ruleIntent,       setRuleIntent]       = useState('');
  const [selectedCdeIds,   setSelectedCdeIds]   = useState([]);
  const [extraTableIds,    setExtraTableIds]    = useState([]);
  const [cdeSearch,        setCdeSearch]        = useState('');
  const [builtPrompt,      setBuiltPrompt]      = useState('');
  const [contextSummary,   setContextSummary]   = useState(null);
  const [pasteText,        setPasteText]        = useState('');
  const [parseResult,      setParseResult]      = useState(null);
  const [proposals,        setProposals]        = useState([]);
  const [copyConfirmed,    setCopyConfirmed]    = useState(false);
  const [loaded,           setLoaded]           = useState(false);

  // Load on mount
  useEffect(() => {
    const s = loadAssistantState();
    if (s) {
      setRuleIntent(s.rule_intent);
      setSelectedCdeIds(s.cde_ids);
      setExtraTableIds(s.extra_table_ids);
      setConversationMode(s.conversation_mode || 'business');
      if (s.proposals && s.proposals.length > 0) {
        // Validate loaded proposals against current store
        const validated = s.proposals.map(p => ({
          ...p,
          _validation: validateProposal(p, data || {}),
        }));
        setProposals(validated);
        const hasUncommitted = validated.some(p => !p.committed);
        if (hasUncommitted) setStage(4);
      }
    }
    setLoaded(true);
  }, []);

  // Auto-save on intent/scope changes (debounced)
  const saveTimerRef = useRef(null);
  useEffect(() => {
    if (!loaded) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      saveAssistantState({
        rule_intent:       ruleIntent,
        cde_ids:           selectedCdeIds,
        extra_table_ids:   extraTableIds,
        conversation_mode: conversationMode,
        proposals:         proposals,
      });
    }, 800);
    return () => clearTimeout(saveTimerRef.current);
  }, [ruleIntent, selectedCdeIds, extraTableIds, conversationMode, loaded]);

  // Immediate save on proposals change
  useEffect(() => {
    if (!loaded) return;
    saveAssistantState({
      rule_intent:       ruleIntent,
      cde_ids:           selectedCdeIds,
      extra_table_ids:   extraTableIds,
      conversation_mode: conversationMode,
      proposals,
    });
  }, [proposals, loaded]);

  // CDE suggestions (debounced)
  const [suggestions, setSuggestions] = useState([]);
  const suggTimerRef = useRef(null);
  useEffect(() => {
    if (suggTimerRef.current) clearTimeout(suggTimerRef.current);
    suggTimerRef.current = setTimeout(() => {
      setSuggestions(suggestCdes(ruleIntent, data));
    }, 300);
    return () => clearTimeout(suggTimerRef.current);
  }, [ruleIntent, data]);

  // Compute validations for proposals
  const validations = proposals.map(p => validateProposal(p, data || {}));

  const handleCdeToggle = (id) => {
    setSelectedCdeIds(prev =>
      prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
    );
  };

  const handleExtraTableToggle = (id) => {
    setExtraTableIds(prev =>
      prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
    );
  };

  const handleBuild = () => {
    if (!ruleIntent || ruleIntent.trim().length < 10 || !data) return;
    const result = buildAssistantPrompt(
      ruleIntent, selectedCdeIds, extraTableIds, conversationMode, data
    );
    setBuiltPrompt(result.promptText);
    setContextSummary({ ...result.contextSummary, characterCount: result.characterCount });
    setCopyConfirmed(false);
    setStage(2);
  };

  const handleCopy = () => {
    copyToClipboard(builtPrompt, () => {
      setCopyConfirmed(true);
      setTimeout(() => setCopyConfirmed(false), 3000);
    }, () => {});
  };

  const handleParse = () => {
    const result = parseProposals(pasteText);
    setParseResult(result);
    if (result.proposals && result.proposals.length > 0) {
      const withValidation = result.proposals.map(p => ({
        ...p,
        _validation: validateProposal(p, data || {}),
      }));
      setProposals(prev => {
        const uncommitted = prev.filter(p => !p.committed);
        // Merge: keep committed ones, replace uncommitted with newly parsed
        const committed   = prev.filter(p => p.committed);
        return [...committed, ...withValidation];
      });
      setStage(4);
    }
  };

  const handleAddContextCopy = (tableIds) => {
    const prompt = buildSupplementaryPrompt(tableIds, data);
    copyToClipboard(prompt, () => {}, () => {});
  };

  const handleCommit = (proposalIndex, proposal) => {
    if (!data || !canEdit) return;

    const ruleId  = nextPk('data_quality_rule');
    const allocId = nextPk('data_quality_rule_allocation');

    upsertRecord('data_quality_rule', {
      data_quality_rule_id: ruleId,
      rule_name:            proposal.rule_name,
      rule_explanation:     proposal.rule_narrative || proposal.rule_explanation || '',
      sql_code:             proposal.sql_code || '',
      sql_code_sample:      proposal.sql_code_sample || '',
      source_code_link:     '',
      automated:            proposal.automated !== false,
      retiring_timestamp:   null,
    });

    upsertRecord('data_quality_rule_allocation', {
      data_quality_rule_allocation_id: allocId,
      data_quality_rule_id:            ruleId,
      critical_data_element_id:        proposal.cde_id,
      quality_dimension_id:            proposal.quality_dimension_id,
      bumper_value:                    proposal.bumper_value,
      frequency:                       proposal.frequency || 'daily',
      retiring_timestamp:              null,
    });

    setProposals(prev => prev.map((p, i) =>
      i === proposalIndex
        ? { ...p, committed: true, _createdRuleId: ruleId, _createdAllocId: allocId }
        : p
    ));
  };

  const handleRefine = (proposalIndex, proposal) => {
    const v = validateProposal(proposal, data || {});
    const gaps = [...v.gaps, ...v.staleIds];
    const prompt = buildRefinementPrompt(proposal, gaps.length > 0 ? gaps : ['Please review and improve the proposal']);
    copyToClipboard(prompt, () => {}, () => {});
    setPasteText('');
    setParseResult(null);
    setStage(3);
  };

  const handleUpdateProposal = (index, updated) => {
    setProposals(prev => prev.map((p, i) => i === index ? { ...updated } : p));
  };

  const handleDiscardProposal = (index) => {
    if (window.confirm('Discard this proposal?')) {
      setProposals(prev => prev.filter((_, i) => i !== index));
    }
  };

  const handleStartNew = () => {
    if (window.confirm('Start a new conversation? This will clear your current rule and any uncommitted proposals.')) {
      clearAssistantState();
      setStage(1);
      setRuleIntent('');
      setSelectedCdeIds([]);
      setExtraTableIds([]);
      setConversationMode('business');
      setCdeSearch('');
      setBuiltPrompt('');
      setContextSummary(null);
      setPasteText('');
      setParseResult(null);
      setProposals([]);
      setCopyConfirmed(false);
    }
  };

  const accentColor = 'var(--accent)';

  return (
    <div className="fade-in">
      {/* Title row */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:8 }}>
        <div>
          <div className="page-title">DQ Assistant</div>
          <div className="page-sub">
            Define quality rules with AI help. Build a prompt, copy to your AI tool, paste the result back.
          </div>
        </div>
        <button className="btn btn-ghost" style={{ fontSize:12, marginTop:4 }}
          onClick={handleStartNew}>
          Start new
        </button>
      </div>

      {/* Read-only gate */}
      {!canEdit && (
        <div className="status-row status-warn" style={{ marginBottom:20 }}>
          <Icon.Warning/>
          Read-only mode -- set your steward identity in Settings to use the DQ Assistant.
        </div>
      )}

      {/* Stage indicator */}
      <StageIndicator stage={stage} onNavigateStage={setStage}/>

      <div {...dp}>
        {/* ---- STAGE 1: DEFINE ---- */}
        {stage >= 1 && (
          <div style={{ opacity: stage === 1 ? 1 : 0.5, pointerEvents: stage === 1 ? 'auto' : 'none' }}>
            <div className="card" style={{ borderColor: stage === 1 ? accentColor : 'var(--border)', marginBottom:24 }}>
              <div className="card-title">
                <span className="dot" style={{ background: stage === 1 ? accentColor : 'var(--text3)' }}/>
                1 &ndash; Define the rule
              </div>
              {stage === 1 && (
                <Stage1Panel
                  conversationMode={conversationMode}
                  onModeChange={setConversationMode}
                  ruleIntent={ruleIntent}
                  onRuleIntentChange={setRuleIntent}
                  selectedCdeIds={selectedCdeIds}
                  onCdeToggle={handleCdeToggle}
                  extraTableIds={extraTableIds}
                  onExtraTableToggle={handleExtraTableToggle}
                  suggestions={suggestions}
                  cdeSearch={cdeSearch}
                  onCdeSearch={setCdeSearch}
                  data={data || {}}
                  onBuild={handleBuild}
                  promptBuilt={!!builtPrompt}
                />
              )}
              {stage > 1 && ruleIntent && (
                <div style={{ fontSize:13, color:'var(--text2)', fontStyle:'italic',
                  display:'flex', alignItems:'center', gap:10 }}>
                  <span className="badge badge-green"><Icon.Check/> Done</span>
                  "{ruleIntent.length > 80 ? ruleIntent.substring(0, 80) + '...' : ruleIntent}"
                </div>
              )}
            </div>
          </div>
        )}

        {/* ---- STAGE 2: PROMPT ---- */}
        {stage >= 2 && (
          <div style={{ opacity: stage === 2 ? 1 : 0.5, pointerEvents: stage === 2 ? 'auto' : 'none' }}>
            <div className="card" style={{ borderColor: stage === 2 ? accentColor : 'var(--border)', marginBottom:24 }}>
              <div className="card-title">
                <span className="dot" style={{ background: stage === 2 ? accentColor : 'var(--text3)' }}/>
                2 &ndash; Copy prompt to AI
              </div>
              {stage === 2 && (
                <Stage2Panel
                  builtPrompt={builtPrompt}
                  contextSummary={contextSummary}
                  onCopy={handleCopy}
                  copyConfirmed={copyConfirmed}
                  onBack={() => setStage(1)}
                />
              )}
              {stage > 2 && (
                <div style={{ fontSize:13, color:'var(--text2)', display:'flex', alignItems:'center', gap:10 }}>
                  <span className="badge badge-green"><Icon.Check/> Done</span>
                  Prompt copied to clipboard
                </div>
              )}
            </div>
          </div>
        )}

        {/* ---- STAGE 3: PASTE ---- */}
        {stage >= 3 && (
          <div style={{ opacity: stage === 3 ? 1 : 0.5, pointerEvents: stage === 3 ? 'auto' : 'none' }}>
            <div className="card" style={{ borderColor: stage === 3 ? accentColor : 'var(--border)', marginBottom:24 }}>
              <div className="card-title">
                <span className="dot" style={{ background: stage === 3 ? accentColor : 'var(--text3)' }}/>
                3 &ndash; Paste AI output
              </div>
              {stage === 3 && (
                <Stage3Panel
                  pasteText={pasteText}
                  onPasteChange={setPasteText}
                  onParse={handleParse}
                  parseResult={parseResult}
                  onAddContextCopy={handleAddContextCopy}
                  data={data || {}}
                  extraTableIds={extraTableIds}
                  onExtraTableToggle={handleExtraTableToggle}
                  onRegeneratePrompt={() => { setStage(2); }}
                />
              )}
              {stage > 3 && proposals.length > 0 && (
                <div style={{ fontSize:13, color:'var(--text2)', display:'flex', alignItems:'center', gap:10 }}>
                  <span className="badge badge-green"><Icon.Check/> Done</span>
                  {proposals.filter(p => !p.committed).length} proposal(s) ready to review
                </div>
              )}
            </div>
          </div>
        )}

        {/* ---- STAGE 4: COMMIT ---- */}
        {stage >= 4 && (
          <div>
            <div className="card" style={{ borderColor: stage === 4 ? accentColor : 'var(--border)' }}>
              <div className="card-title">
                <span className="dot" style={{ background: stage === 4 ? accentColor : 'var(--text3)' }}/>
                4 &ndash; Review and commit
              </div>
              <Stage4Panel
                proposals={proposals}
                validations={validations}
                onCommit={handleCommit}
                onRefine={handleRefine}
                onUpdate={handleUpdateProposal}
                onDiscard={handleDiscardProposal}
                data={data || {}}
              />
            </div>
          </div>
        )}

        {/* Show stage 3 prompt when on stage 2 (visible but muted) */}
        {stage === 2 && (
          <div style={{ opacity:0.4, pointerEvents:'none' }}>
            <div className="card" style={{ marginBottom:24 }}>
              <div className="card-title">
                <span className="dot" style={{ background:'var(--text3)' }}/>
                3 &ndash; Paste AI output
              </div>
              <div style={{ fontSize:12, color:'var(--text3)' }}>
                Complete Step 2 first -- copy the prompt and run your AI conversation.
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

</script>

</body>
</html>
