<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DQ Accelerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg:        #0d1117;
  --bg2:       #18212e;
  --bg3:       #1e2d40;
  --bg4:       #263550;
  --border:    #2d4060;
  --border2:   #3e5575;
  --text:      #edf0fa;
  --text2:     #9aaecc;
  --text3:     #5f7294;
  --accent:    #18b4d4;
  --accent2:   #0e8cac;
  --green:     #22c98e;
  --green-bg:  #0d2e22;
  --amber:     #f5a623;
  --amber-bg:  #2a1f0a;
  --red:          #f25f5c;
  --red-bg:       #2e1010;
  --red-vivid:    #e05252;
  --purple:       #7c5cbf;
  --overlay-sm:   rgba(0,0,0,0.25);
  --overlay-md:   rgba(0,0,0,0.30);
  --accent-tint:  rgba(24,180,212,0.12);
  --accent-border:rgba(24,180,212,0.40);
  --mono:      'IBM Plex Mono', monospace;
  --sans:      'IBM Plex Sans', sans-serif;
  --radius:    6px;
  --radius-lg: 10px;
  --header-h:  52px;
  --footer-h:  32px;
  --sidebar-w: 220px;
  --sidebar-collapsed: 48px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.6;
  min-height: 100vh; overflow: hidden;
}

/* ── APP SHELL ────────────────────────────────────────── */
#app { display: flex; flex-direction: row; height: 100vh; }

/* ── SIDEBAR ──────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
  transition: width 0.2s ease;
  position: relative;
}
.sidebar.collapsed { width: var(--sidebar-collapsed); }

/* ── RIGHT COLUMN (header + content) ─────────────────── */
.app-right {
  display: flex; flex-direction: column;
  flex: 1; overflow: hidden; min-width: 0;
}

/* ── HEADER (right side only) ────────────────────────── */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: var(--header-h);
  background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 200; position: relative;
}
.header-left {
  display: flex; align-items: center; height: 100%; gap: 0;
}
.client-logo-placeholder {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: var(--radius-lg);
  background: var(--accent); font-family: var(--mono);
  font-size: 13px; font-weight: 600; color: #fff;
}

/* ── SIDEBAR LOGO BLOCK ───────────────────────────────── */
.sidebar-logo-block {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; border-bottom: 1px solid var(--border);
  height: 120px;
  transition: height 0.2s ease, padding 0.2s ease;
  overflow: hidden;
}
.sidebar-logo-block.collapsed { height: 60px; padding: 10px; }
.sidebar-logo-block img {
  max-height: 100%; max-width: 100%;
  object-fit: contain; display: block;
}

.header-app-id {
  display: flex; align-items: center; gap: 10px; padding: 0 4px;
}
.header-app-name { font-size: 13px; font-weight: 500; color: var(--text); }
.header-app-sub  { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-meta { font-size: 11px; color: var(--text3); font-family: var(--mono); }

/* ── BODY (content area under header) ────────────────── */
.app-body {
  display: flex; flex: 1; overflow: hidden;
}

.sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* top-level nav items (Dashboard, Export) */
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 14px; cursor: pointer; border-radius: 0;
  font-size: 13px; color: var(--text2); white-space: nowrap;
  transition: background 0.12s, color 0.12s;
  overflow: hidden;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg4); color: var(--accent); }
.nav-item-icon {
  width: 20px; height: 20px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.nav-item-label { white-space: nowrap; overflow: hidden; }

/* group headers */
.nav-group { margin-top: 4px; }
.nav-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; cursor: pointer;
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
  white-space: nowrap; overflow: hidden;
  transition: color 0.12s;
}
.nav-group-header:hover { color: var(--text2); }
.nav-group-accent {
  width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0;
}
.nav-group-chevron {
  margin-left: auto; flex-shrink: 0;
  transition: transform 0.15s;
  width: 12px; height: 12px;
}
.nav-group-chevron.open { transform: rotate(90deg); }

/* table nav items inside groups */
.nav-table-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 14px 5px 26px; cursor: pointer;
  font-size: 12px; color: var(--text3); white-space: nowrap;
  overflow: hidden; transition: background 0.1s, color 0.1s;
}
.nav-table-item:hover { background: var(--bg3); color: var(--text2); }
.nav-table-item.active { background: var(--bg4); color: var(--text); }
.nav-table-badge {
  margin-left: auto; flex-shrink: 0;
  font-size: 10px; font-family: var(--mono);
  color: var(--text3); background: var(--bg3);
  padding: 0 5px; border-radius: 8px;
  border: 1px solid var(--border);
}

/* collapsed: icon dots for groups */
.nav-group-dot {
  width: var(--sidebar-collapsed); height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.nav-group-dot-inner {
  width: 8px; height: 8px; border-radius: 50%;
  transition: transform 0.12s;
}
.nav-group-dot:hover .nav-group-dot-inner { transform: scale(1.4); }

/* sidebar toggle button */
.sidebar-toggle {
  display: flex; align-items: center; justify-content: center;
  height: 36px; border-top: 1px solid var(--border);
  cursor: pointer; color: var(--text3); flex-shrink: 0;
  transition: background 0.12s, color 0.12s;
}
.sidebar-toggle:hover { background: var(--bg3); color: var(--text2); }
.sidebar-toggle svg { width: 16px; height: 16px; }

/* ── CONTENT AREA ─────────────────────────────────────── */
.content-area {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 28px 32px;
  padding-bottom: calc(var(--footer-h) + 12px);
}
.content-area::-webkit-scrollbar { width: 6px; }
.content-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── FOOTER ───────────────────────────────────────────── */
.app-footer {
  height: var(--footer-h); flex-shrink: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; font-size: 11px; color: var(--text3);
  z-index: 200;
}
.footer-copy { font-family: var(--mono); }
.footer-logo { display: flex; align-items: center; gap: 8px; }
.cognizant-logo svg { height: 16px; width: auto; }

/* ── LOGO SETTINGS PANEL ──────────────────────────────── */
.settings-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 500; display: flex; align-items: flex-start;
  justify-content: flex-end; padding-top: var(--header-h);
}
.settings-panel {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 20px;
  width: 320px; margin: 8px 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.settings-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 16px;
}
.settings-drop-zone {
  border: 1.5px dashed var(--border2); border-radius: var(--radius);
  padding: 20px 16px; text-align: center; cursor: pointer;
  position: relative; transition: border-color 0.15s;
}
.settings-drop-zone:hover { border-color: var(--accent); }
.settings-drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.settings-drop-zone svg { width: 32px; height: 32px; }
.settings-drop-text { font-size: 12px; color: var(--text3); margin-top: 6px; }
.nodata-icon svg { width: 64px; height: 64px; }

/* ── BREADCRUMB ───────────────────────────────────────── */
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text3); margin-bottom: 20px;
}
.breadcrumb-sep { color: var(--text3); }
.breadcrumb-current { color: var(--text2); font-weight: 500; }

/* ── PAGE TITLE ───────────────────────────────────────── */
.page-title { font-size: 20px; font-weight: 300; color: var(--text); margin-bottom: 4px; }
.page-sub   { font-size: 13px; color: var(--text3); margin-bottom: 24px; }

/* ── BUTTONS ──────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius);
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid transparent;
  transition: all 0.15s ease; background: transparent;
}
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent2); }
.btn-primary:hover { background: #3ecde8; }
.btn-ghost { color: var(--text2); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
.btn-danger { color: var(--red); border-color: var(--red); }
.btn-danger:hover { background: var(--red-bg); }
.btn-green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.btn-green:hover { background: #0d3a2a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ── CARDS ────────────────────────────────────────────── */
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 12px; font-weight: 600; color: var(--text);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.card-title .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}

/* ── SECTION LABEL ────────────────────────────────────── */
.section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text3);
  margin: 24px 0 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ── STATUS ROWS ──────────────────────────────────────── */
.status-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: var(--radius);
  font-size: 12px; font-family: var(--mono);
}
.status-row svg { width: 16px; height: 16px; flex-shrink: 0; }
.status-ok   { background: var(--green-bg); color: var(--green); }
.status-warn { background: var(--amber-bg); color: var(--amber); }
.status-err  { background: var(--red-bg);   color: var(--red); }
.status-info { background: var(--bg3); color: var(--text2); }

/* ── PROGRESS BAR ─────────────────────────────────────── */
.progress-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 8px 0; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }

/* ── UPLOAD ZONE ──────────────────────────────────────── */
.upload-zone {
  border: 1.5px dashed var(--border2); border-radius: var(--radius-lg);
  padding: 48px 24px; text-align: center; cursor: pointer;
  transition: all 0.2s ease; background: var(--bg); position: relative;
}
.upload-zone:hover, .upload-zone.drag-over { border-color: var(--accent); background: #0d1e30; }
.upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-icon { margin: 0 auto 14px; width: 40px; height: 40px; opacity: 0.4; }
.upload-title { font-size: 15px; font-weight: 500; margin-bottom: 5px; }
.upload-sub { font-size: 13px; color: var(--text3); }

/* ── ISSUE LIST ───────────────────────────────────────── */
.issue-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
.issue-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 12px; background: var(--amber-bg);
  border: 1px solid #4a3010; border-radius: var(--radius); font-size: 12px;
}
.issue-badge {
  font-family: var(--mono); font-size: 10px; padding: 1px 6px;
  background: #5a3a10; color: var(--amber); border-radius: 3px;
  white-space: nowrap; flex-shrink: 0;
}

/* ── BADGES ───────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: 10px;
  font-size: 10px; font-weight: 600; font-family: var(--mono);
}
.badge svg { width: 11px; height: 11px; flex-shrink: 0; }
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-amber { background: var(--amber-bg); color: var(--amber); }
.badge-red   { background: var(--red-bg);   color: var(--red); }
.badge-blue  { background: #0d2035; color: var(--accent); }
.badge-gray  { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

/* ── TOGGLE ───────────────────────────────────────────── */
.toggle-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-top: 1px solid var(--border); margin-top: 10px;
}
.toggle { position: relative; width: 36px; height: 20px; cursor: pointer; flex-shrink: 0; }
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle-track { position: absolute; inset: 0; background: var(--border2); border-radius: 10px; transition: background 0.2s; }
.toggle input:checked ~ .toggle-track { background: var(--accent); }
.toggle-thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
.toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }
.toggle-label { font-size: 13px; color: var(--text2); }

/* ── TABS ─────────────────────────────────────────────── */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
.tab {
  padding: 9px 16px; font-size: 13px; color: var(--text3);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s; margin-bottom: -1px;
}
.tab:hover { color: var(--text2); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

/* ── RESET CONFIRM ────────────────────────────────────── */
.reset-confirm {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--red-bg);
  border: 1px solid var(--red); border-radius: var(--radius);
  font-size: 12px; color: var(--red); margin-bottom: 16px;
}
.reset-confirm svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ── GENERIC TABLE VIEW ───────────────────────────────── */
.table-search {
  width: 100%; padding: 8px 12px; font-size: 13px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--sans); outline: none;
  transition: border-color 0.15s;
}
.table-search:focus { border-color: var(--border2); }
.table-search::placeholder { color: var(--text3); }

.record-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 14px; background: var(--bg2);
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: var(--radius);
  margin-bottom: 4px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.record-row:hover { background: var(--bg3); border-color: var(--border2); }
.record-row.active { background: var(--bg4); }
.record-row-pk {
  font-family: var(--mono); font-size: 10px; color: var(--text3);
  padding: 2px 6px; background: var(--bg3); border-radius: 3px;
  border: 1px solid var(--border); white-space: nowrap; flex-shrink: 0; margin-top: 2px;
}
.record-row-main { flex: 1; min-width: 0; }
.record-row-primary { font-size: 13px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.record-row-secondary { font-size: 11px; color: var(--text3); margin-top: 2px; }
.record-retired { opacity: 0.5; }
.record-retired .record-row-primary { text-decoration: line-through; }

/* ── WEIGHT BOX HOVER ACTION ──────────────────────────── */
div:hover > .weight-box-action { opacity: 1 !important; }

/* ── ANIMATIONS ───────────────────────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeIn 0.2s ease forwards; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.slide-in { animation: slideIn 0.18s ease forwards; }

</style>
</head>

<div id="app"></div>

<script>
// Capture all errors before React loads
window.__errors = [];
window.onerror = function(msg, src, line, col, err) {
  window.__errors.push({ msg, src, line, col, stack: err?.stack });
};
window.onunhandledrejection = function(e) {
  window.__errors.push({ msg: String(e.reason), stack: e.reason?.stack });
};
</script>

function coerceValue(raw, type) {
  if (raw === null || raw === undefined || raw === '' ||
      (typeof raw === 'number' && isNaN(raw))) return null;
  switch (type) {
    case 'int':   { const n = parseInt(raw, 10); return isNaN(n) ? null : n; }
    case 'float': { const n = parseFloat(raw); return isNaN(n) ? null : n; }
    case 'bool':
      if (typeof raw === 'boolean') return raw;
      if (typeof raw === 'string') return raw.toLowerCase() === 'true';
      return Boolean(raw);
    case 'datetime':
      if (!raw) return null;
      // Excel dates come through as JS Date objects or serial numbers via SheetJS
      if (raw instanceof Date) return raw.toISOString();
      if (typeof raw === 'number') {
        // Excel serial date
        const d = XLSX.SSF.parse_date_code(raw);
        if (d) return new Date(d.y, d.m-1, d.d).toISOString();
      }
      if (typeof raw === 'string' && raw.trim()) return raw.trim();
      return null;
    case 'str':
    case 'text':
    default:
      return String(raw).trim() === '' ? null : String(raw).trim();
  }
}

function importSheet(ws, tableName) {
  const schema = SCHEMA[tableName];
  if (!schema) return [];

  const rawRows = XLSX.utils.sheet_to_json(ws, { defval: null, raw: true });
  return rawRows.map(row => {
    const record = {};
    for (const col of schema.cols) {
      let val = row[col.name] ?? null;

      if (val === null || val === undefined || val === '') {
        record[col.name] = null;
        continue;
      }

      switch (col.type) {
        case 'bool':
          if (typeof val === 'boolean') break;
          val = String(val).toLowerCase() === 'true';
          break;
        case 'int':
          val = parseInt(val, 10);
          if (isNaN(val)) val = null;
          break;
        case 'float':
          val = parseFloat(val);
          if (isNaN(val)) val = null;
          break;
        case 'datetime':
          if (val instanceof Date) {
            // toISOString uses UTC -- use local date parts to avoid day-shift
            const y = val.getFullYear();
            const m = String(val.getMonth()+1).padStart(2,'0');
            const d = String(val.getDate()).padStart(2,'0');
            val = `${y}-${m}-${d}`;
          } else if (typeof val === 'number') {
            // Excel serial date
            const dt = XLSX.SSF.parse_date_code(val);
            if (dt) val = `${dt.y}-${String(dt.m).padStart(2,'0')}-${String(dt.d).padStart(2,'0')}`;
            else val = null;
          } else if (typeof val === 'string' && val.trim()) {
            // Already a string -- try to normalise to YYYY-MM-DD
            const parsed = new Date(val.trim());
            if (!isNaN(parsed)) {
              const y = parsed.getFullYear();
              const m = String(parsed.getMonth()+1).padStart(2,'0');
              const d = String(parsed.getDate()).padStart(2,'0');
              val = `${y}-${m}-${d}`;
            } else {
              val = val.trim();
            }
          } else {
            val = null;
          }
          break;
        case 'str':
        case 'text':
        default:
          val = String(val).trim() || null;
          break;
      }
      record[col.name] = val;
    }
    return record;
  }).filter(r => {
    const pk = schema.pk;
    return r[pk] !== null && r[pk] !== undefined;
  });
}

function importWorkbook(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const result = {};
  const log = [];

  for (const [sheetName, tableName] of Object.entries(SHEET_MAP)) {
    if (!wb.SheetNames.includes(sheetName)) {
      log.push({ level: 'warn', msg: `Sheet "${sheetName}" not found -- table ${tableName} will be empty` });
      result[tableName] = [];
      continue;
    }
    const ws = wb.Sheets[sheetName];
    const rows = importSheet(ws, tableName);
    result[tableName] = rows;
    log.push({ level: 'info', msg: `${tableName}: imported ${rows.length} rows` });
  }

  return { data: result, log };
}

// TASK 3 -- ID RESOLUTION ENGINE
// Builds lookup maps from loaded data. Rebuilt whenever state changes.
// ===============================================================================

function buildLookups(data) {
  const maps = {};
  for (const [tableName, schema] of Object.entries(SCHEMA)) {
    const rows = data[tableName] || [];
    const pk = schema.pk;
    // byId: id -> row
    maps[`${tableName}ById`] = Object.fromEntries(
      rows.map(r => [r[pk], r])
    );
    // index all FK display values: for dropdowns
  }
  return maps;
}

// Resolve a FK value to its display string
function resolveFk(maps, fkDef, id) {
  if (id === null || id === undefined) return '--';
  const byId = maps[`${fkDef.table}ById`];
  if (!byId) return String(id);
  const row = byId[id];
  if (!row) return `[${id}]`;
  return row[fkDef.display] ?? String(id);
}

// Get dropdown options for a FK field
function getFkOptions(data, fkDef) {
  const rows = data[fkDef.table] || [];
  return rows
    .filter(r => !r.retiring_timestamp)
    .map(r => ({
      value: r[fkDef.field],
      label: r[fkDef.display] ?? String(r[fkDef.field]),
    }));
}

// Replace Unicode space variants (U+00A0, U+2000-U+200B, U+202F, U+205F,
// U+3000, U+FEFF, U+00AD) with plain ASCII space -- Athena rejects these.
function normalizeWhitespace(str) {
  if (!str) return str;
  return str.replace(/[\u00A0\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200A\u200B\u202F\u205F\u3000\uFEFF\u00AD]/g, ' ');
}

function substituteCdeTokens(str, cde) {
  if (!str || !cde) return str || '';
  return str
    .replace(/\{SOURCE_DATABASE_NAME\}/gi, cde.source_database_name || '')
    .replace(/\{SOURCE_TABLE_NAME\}/gi,    cde.source_table_name    || '')
    .replace(/\{SOURCE_FIELD_NAME\}/gi,    cde.source_field_name    || '');
}

// Returns a Set of CDS ids owned by the steward (live stewardship records only),
// or null when no identity is set or the steward has no live CDS assignments.
function getMyStewardCdsIds(data, stewardIdentity) {
  if (!data || !stewardIdentity) return null;
  var ids = new Set(
    (data.stewardship || [])
      .filter(function(s) {
        return !s.retiring_timestamp &&
               s.data_steward_id === stewardIdentity.id &&
               s.critical_data_set_id !== 0;
      })
      .map(function(s) { return s.critical_data_set_id; })
  );
  return ids.size > 0 ? ids : null;
}

// Reads myDataOnly preference from localStorage.
// When no stored value exists, defaults to true for regular stewards and false for masters,
// so masters see the full org picture by default while stewards see their own scope.
function loadMyDataPref(key, isMaster) {
  try {
    var stored = localStorage.getItem(key);
    return stored === null ? !isMaster : stored === '1';
  } catch(e) { return !isMaster; }
}

function saveMyDataPref(key, value) {
  try { localStorage.setItem(key, value ? '1' : '0'); } catch(e) {}
}

// Shared custom hook: My Data scope filter.
// Encapsulates myDataOnly state, localStorage persistence, and the three scope
// sets (CDS, directorate, agency) derived from the steward's stewardship records.
// storageKey must be unique per screen (e.g. 'moj_dq_simulator_mydata_v1').
function useMyDataScope(data, stewardIdentity, isMaster, cdSets, dirs, storageKey) {
  const [myDataOnly, setMyDataOnly] = useState(
    function() { return loadMyDataPref(storageKey, isMaster); }
  );
  useEffect(function() { saveMyDataPref(storageKey, myDataOnly); }, [myDataOnly]);

  const myStewardCdsIds = useMemo(
    function() { return getMyStewardCdsIds(data, stewardIdentity); },
    [data, stewardIdentity]
  );

  const scopeCdsIds = (myDataOnly && myStewardCdsIds) ? myStewardCdsIds : null;

  const scopeDirIds = useMemo(function() {
    if (!scopeCdsIds) return null;
    return new Set(
      cdSets.filter(function(d) { return !d.retiring_timestamp && scopeCdsIds.has(d.critical_data_set_id); })
            .map(function(d) { return d.directorate_id; })
    );
  }, [cdSets, scopeCdsIds]);

  const scopeAgencyIds = useMemo(function() {
    if (!scopeDirIds) return null;
    return new Set(
      dirs.filter(function(d) { return !d.retiring_timestamp && scopeDirIds.has(d.directorate_id); })
          .map(function(d) { return d.executive_agency_id; })
    );
  }, [dirs, scopeDirIds]);

  return { myDataOnly, setMyDataOnly, scopeCdsIds, scopeDirIds, scopeAgencyIds };
}

const STORAGE_KEY = 'moj_dq_store_v1';

function saveToStorage(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ data, savedAt: new Date().toISOString() }));
    return true;
  } catch(e) {
    console.error('Storage write failed:', e);
    return false;
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed;
  } catch(e) {
    return null;
  }
}

function clearStorage() {
  localStorage.removeItem(STORAGE_KEY);
}

// ===============================================================================
// TASK 5 -- DATA HEALTH CHECK
// Validates FK integrity on all records.
// ===============================================================================

function runHealthCheck(data) {
  const issues = [];
  const tableCounts = {};

  for (const [tableName, schema] of Object.entries(SCHEMA)) {
    const rows = data[tableName] || [];
    const live = rows.filter(r => !r.retiring_timestamp);
    const retired = rows.filter(r => r.retiring_timestamp);
    tableCounts[tableName] = { total: rows.length, live: live.length, retired: retired.length };

    // Check FK references
    for (const col of schema.cols) {
      if (!col.fk) continue;
      const refTable = data[col.fk.table] || [];
      const refIds = new Set(refTable.map(r => r[col.fk.field]));

      for (const row of rows) {
        const val = row[col.name];
        if (val === null || val === undefined) continue;
        if (!refIds.has(val)) {
          issues.push({
            table: tableName,
            pk: row[schema.pk],
            field: col.name,
            value: val,
            refTable: col.fk.table,
            msg: `${tableName}[${row[schema.pk]}].${col.name} = ${val} -- no matching record in ${col.fk.table}`,
          });
        }
      }
    }
  }

  return { issues, tableCounts };
}

// ===============================================================================
// TASK 6 -- CSV EXPORT CORE
// Produces one CSV string per table. includeSoftDeleted defaults to false.
// ===============================================================================


function tableToCSV(tableName, data, includeSoftDeleted = false) {
  const schema = SCHEMA[tableName];
  if (!schema) return '';
  const cols = schema.cols;
  const rows = data[tableName] || [];

  const filtered = includeSoftDeleted
    ? rows
    : rows.filter(r => !r.retiring_timestamp);

  const escape = v => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };

  const header = cols.map(c => c.name).join(',');
  const dataRows = filtered.map(row =>
    cols.map(c => escape(row[c.name])).join(',')
  );
  return [header, ...dataRows].join('\n');
}

async function buildAllCSVsBlob(data, includeSoftDeleted = false) {
  const zip = new JSZip();
  const ts = new Date().toISOString().replace(/[:\-T.Z]/g,'').slice(0,14);
  const folder = zip.folder(`dq_export_${ts}`);
  for (const tableName of Object.keys(SCHEMA)) {
    folder.file(`${tableName}.csv`, tableToCSV(tableName, data, includeSoftDeleted));
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  return { blob, filename: `dq_export_${ts}.zip` };
}

async function saveWithPicker(blob, filename, description, ext) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description, accept: { [blob.type]: [ext] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    } catch (e) {
      if (e.name === 'AbortError') return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  return true;
}

function exportSingleCSV(tableName, data, includeSoftDeleted = false) {
  const csv = tableToCSV(tableName, data, includeSoftDeleted);
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${tableName}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

}

}

// Simple deterministic hash of a record for change detection
function hashRecord(record) {
  const str = JSON.stringify(record, Object.keys(record).sort());
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(31, h) + str.charCodeAt(i) | 0;
  }
  return h.toString(36);
}

// Build snapshot: { table: { pk: hash } } for delta-editable tables
function buildSnapshot(data) {
  const snap = {};
  for (const tbl of DELTA_TABLES) {
    snap[tbl] = {};
    const schema = SCHEMA[tbl];
    for (const row of (data[tbl] || [])) {
      snap[tbl][row[schema.pk]] = hashRecord(row);
    }
  }
  return snap;
}

// Generate next master version string: master-YYYYMMDD-NNN
function nextMasterVersion(current) {
  const now  = new Date();
  const date = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const prefix = `master-${date}-`;
  if (current && current.startsWith(prefix)) {
    const seq = parseInt(current.slice(prefix.length)) || 0;
    return `${prefix}${String(seq + 1).padStart(3, '0')}`;
  }
  return `${prefix}001`;
}

const STEWARD_IDENTITY_KEY = 'moj_dq_steward_identity';

function loadStewardIdentity() {
  try { return JSON.parse(localStorage.getItem(STEWARD_IDENTITY_KEY)) || null; } catch { return null; }
}

// Build delta: compare current data against base snapshot
// Returns { table: { inserted, updated, retired } } for changed tables only
function buildDelta(data, snapshot) {
  const changes = {};
  for (const tbl of DELTA_TABLES) {
    const schema   = SCHEMA[tbl];
    const pk       = schema.pk;
    const rows     = data[tbl] || [];
    const snap     = snapshot[tbl] || {};
    const inserted = [];
    const updated  = [];
    const retired  = [];

    for (const row of rows) {
      const id      = row[pk];
      const hash    = hashRecord(row);
      const wasSnap = snap[id] !== undefined;
      if (!wasSnap) {
        inserted.push(row);
      } else if (hash !== snap[id]) {
        if (row.retiring_timestamp) {
          retired.push(id);
        } else {
          updated.push(row);
        }
      }
    }

    if (inserted.length || updated.length || retired.length) {
      changes[tbl] = { inserted, updated, retired };
    }
  }
  return changes;
}

// ===============================================================================
// TASK 6 -- DELTA IMPORT: processing, merge application, report generation
// ===============================================================================

// Remap a record's own PK (if inserted) and any FK fields that point to
// newly inserted steward-namespace records, using the pkRemap lookup table.
function remapRecord(tbl, row, pkRemap) {
  const schema = SCHEMA[tbl];
  if (!schema) return row;
  const pkField = schema.pk;
  const out = { ...row };
  if (pkRemap[tbl] && pkRemap[tbl][out[pkField]] !== undefined) {
    out[pkField] = pkRemap[tbl][out[pkField]];
  }
  for (const col of schema.cols) {
    if (col.fk) {
      const fkTbl = col.fk.table;
      if (pkRemap[fkTbl] && pkRemap[fkTbl][out[col.name]] !== undefined) {
        out[col.name] = pkRemap[fkTbl][out[col.name]];
      }
    }
  }
  return out;
}

// Process a steward delta against current master data and base snapshot.
// Returns { remappedInserts, autoApplyUpdates, conflicts, pkRemap }.
// Retirements are always surfaced as conflicts -- master steward must decide.
function processDelta(delta, masterData, snapshot) {
  const changes = delta.changes || {};
  const tables  = Object.keys(changes);
  const snap    = snapshot || {};

  // Pass 1: assign fresh master-sequence PKs to all inserted records
  const pkRemap = {};
  for (const tbl of tables) {
    const schema = SCHEMA[tbl];
    if (!schema) continue;
    const pkField  = schema.pk;
    const inserted = changes[tbl].inserted || [];
    pkRemap[tbl]   = {};
    let maxPk = (masterData[tbl] || []).reduce((m, r) => Math.max(m, r[pkField] ?? 0), 0);
    for (const row of inserted) { pkRemap[tbl][row[pkField]] = ++maxPk; }
  }

  // Pass 2: remap inserted records (own PK + FK fields)
  const remappedInserts = {};
  for (const tbl of tables) {
    remappedInserts[tbl] = (changes[tbl].inserted || []).map(r => remapRecord(tbl, r, pkRemap));
  }

  // Pass 3: remap FK fields in updated records (may reference newly inserted records)
  const remappedUpdates = {};
  for (const tbl of tables) {
    remappedUpdates[tbl] = (changes[tbl].updated || []).map(r => remapRecord(tbl, r, pkRemap));
  }

  // Pass 4: conflict detection for updates
  const autoApplyUpdates = [];
  const conflicts = [];

  for (const tbl of tables) {
    const schema     = SCHEMA[tbl];
    if (!schema) continue;
    const pkField    = schema.pk;
    const masterRows = masterData[tbl] || [];
    const snapTable  = snap[tbl] || {};

    for (const stewardRow of (remappedUpdates[tbl] || [])) {
      const pkVal     = stewardRow[pkField];
      const masterRow = masterRows.find(r => r[pkField] === pkVal);
      if (!masterRow) continue;
      if (hashRecord(masterRow) === snapTable[pkVal]) {
        autoApplyUpdates.push({ table: tbl, row: stewardRow });
      } else {
        conflicts.push({ table: tbl, pk: pkVal, masterRow, stewardRow, type: 'update' });
      }
    }

    // Pass 5: retirements always become conflicts
    for (const retiredPk of (changes[tbl].retired || [])) {
      const masterRow = masterRows.find(r => r[pkField] === retiredPk);
      if (!masterRow || masterRow.retiring_timestamp) continue;
      conflicts.push({ table: tbl, pk: retiredPk, masterRow, stewardRow: null, type: 'retire' });
    }
  }

  return { remappedInserts, autoApplyUpdates, conflicts, pkRemap };
}

// Apply resolved merge to master data. Returns new merged data object.
function applyMergedChanges(masterData, processResult, resolutions) {
  const { remappedInserts, autoApplyUpdates, conflicts } = processResult;
  const merged = {};
  for (const tbl of Object.keys(masterData)) merged[tbl] = [...(masterData[tbl] || [])];

  for (const tbl of Object.keys(remappedInserts)) {
    if (!merged[tbl]) merged[tbl] = [];
    merged[tbl] = [...merged[tbl], ...remappedInserts[tbl]];
  }
  for (const { table: tbl, row } of autoApplyUpdates) {
    const pkField = SCHEMA[tbl].pk;
    merged[tbl] = merged[tbl].map(r => r[pkField] === row[pkField] ? row : r);
  }
  for (const { table: tbl, pk: pkVal, stewardRow, type } of conflicts) {
    const resolution = resolutions[`${tbl}:${pkVal}`] || 'master';
    if (resolution === 'master') continue;
    const pkField = SCHEMA[tbl].pk;
    if (type === 'retire') {
      merged[tbl] = merged[tbl].map(r =>
        r[pkField] === pkVal ? { ...r, retiring_timestamp: new Date().toISOString() } : r
      );
    } else {
      merged[tbl] = merged[tbl].map(r => r[pkField] === pkVal ? stewardRow : r);
    }
  }
  return merged;
}

// Build merge report object for JSON download
function buildMergeReport(delta, processResult, resolutions) {
  const { remappedInserts, autoApplyUpdates, conflicts, pkRemap } = processResult;
  const applied = {};
  const tally = (tbl, field) => {
    if (!applied[tbl]) applied[tbl] = { inserted: 0, updated: 0, retired: 0 };
    applied[tbl][field]++;
  };
  for (const tbl of Object.keys(remappedInserts)) {
    (remappedInserts[tbl] || []).forEach(() => tally(tbl, 'inserted'));
  }
  for (const { table: tbl } of autoApplyUpdates) tally(tbl, 'updated');
  for (const c of conflicts) {
    if ((resolutions[`${c.table}:${c.pk}`] || 'master') === 'steward') {
      tally(c.table, c.type === 'retire' ? 'retired' : 'updated');
    }
  }
  const pkRemapReport = {};
  for (const tbl of Object.keys(pkRemap)) {
    if (Object.keys(pkRemap[tbl]).length) pkRemapReport[tbl] = pkRemap[tbl];
  }
  let totalInserted = 0, totalUpdated = 0, totalRetired = 0;
  for (const t of Object.keys(applied)) {
    totalInserted += applied[t].inserted;
    totalUpdated  += applied[t].updated;
    totalRetired  += applied[t].retired;
  }
  return {
    _type:         'merge_report',
    _merged_at:    new Date().toISOString(),
    _steward_id:   delta._steward_id,
    _steward_name: delta._steward_name,
    _base_version: delta._base_version,
    pk_remaps:     pkRemapReport,
    applied,
    conflicts: conflicts.map(c => ({
      table:      c.table,
      pk:         c.pk,
      type:       c.type,
      resolution: resolutions[`${c.table}:${c.pk}`] || 'master',
    })),
    summary: {
      total_inserted:  totalInserted,
      total_updated:   totalUpdated,
      total_retired:   totalRetired,
      total_conflicts: conflicts.length,
    },
  };
}

// ===============================================================================
// SQL COMPOSER -- substitutes placeholders, appends snapshot filter
// No case transformation -- preserves original SQL casing exactly.
// ===============================================================================
function composeSql(template, cde, mode) {
  if (!template || !cde) return null;
  const snapRaw = cde.source_snapshot_filter;

  let sql  = substituteCdeTokens(template, cde);
  const snap = snapRaw ? substituteCdeTokens(snapRaw, cde) : null;

  if (snap) {
    sql = mode === 'sample'
      ? sql + ' WHERE ' + snap
      : sql + ' AND '   + snap;
  }
  return sql;
}

function AggregatedWeightView({ tableName }) {
  const { data, retireRecord, restoreRecord, openForm, nextPk, canEdit } = useApp();
  const dp = !canEdit ? { style:{ opacity:0.35, cursor:'not-allowed', pointerEvents:'none' }, title:'Set your steward identity in Settings to make changes' } : {};



  const [search,      setSearch]      = useState('');
  const [showRetired, setShowRetired] = useState(false);

  const schema = SCHEMA[tableName];
  const rows   = data?.[tableName] || [];
  const group  = TABLE_GROUPS.find(g => g.tables.includes(tableName));
  const accent = group?.accent || 'var(--accent)';

  const isCriticality = tableName === 'criticality_group_weight';
  const dimField      = isCriticality ? 'criticality_group_id'        : 'quality_dimension_id';
  const dimTable      = isCriticality ? 'criticality_group'            : 'quality_dimension';
  const dimDisplay    = isCriticality ? 'criticality_group_description': 'dimension_name';
  const dimAcronym    = isCriticality ? 'criticality_group_acronymn'   : 'dimension_acronymn';

  const agencies   = data?.['executive_agency'] || [];
  const dimensions = data?.[dimTable] || [];

  const openAdd  = () => openForm(tableName, buildBlankRecord(tableName, nextPk, data));
  const openEdit = (row) => openForm(tableName, { ...row });

  const agencyById = useMemo(() =>
    Object.fromEntries(agencies.map(a => [a.executive_agency_id, a])),
  [agencies]);

  const grouped = useMemo(() => {
    const live = showRetired ? rows : rows.filter(r => !r.retiring_timestamp);
    const map  = {};
    for (const row of live) {
      const aid = row.executive_agency_id;
      if (!map[aid]) map[aid] = [];
      map[aid].push(row);
    }
    return Object.entries(map)
      .map(([aid, agencyRows]) => ({
        agencyId: parseInt(aid),
        agency:   agencyById[parseInt(aid)],
        rows:     agencyRows,
      }))
      .sort((a, b) =>
        (a.agency?.agency_acronymn || '').localeCompare(b.agency?.agency_acronymn || '')
      );
  }, [rows, showRetired, agencyById]);

  const filtered = useMemo(() => {
    if (!search.trim()) return grouped;
    const q = search.toLowerCase();
    return grouped.filter(({ agency, rows: agRows }) => {
      if ((agency?.agency_acronymn || '').toLowerCase().includes(q)) return true;
      if ((agency?.agency_name     || '').toLowerCase().includes(q)) return true;
      return agRows.some(r => {
        const dim = dimensions.find(d => d[`${dimTable}_id`] === r[dimField]);
        return (dim?.[dimDisplay] || '').toLowerCase().includes(q);
      });
    });
  }, [grouped, search, dimensions, dimDisplay, dimField, dimTable]);

  const liveCount    = rows.filter(r => !r.retiring_timestamp).length;
  const retiredCount = rows.filter(r =>  r.retiring_timestamp).length;
  const agencyCount  = grouped.length;

  return (
    <div className="fade-in">

            {schema.label}
          </div>
          <div className="page-sub">
            {agencyCount} agenc{agencyCount !== 1 ? 'ies' : 'y'} - {liveCount} live records
            {retiredCount > 0 && ` - ${retiredCount} retired`}
          </div>
        </div>
        {canEdit && (
          <button {...dp} className="btn btn-primary" style={{ marginTop:4 }} onClick={openAdd}>
            <Icon.Plus/> Add record
          </button>
        )}
      </div>

      {/* Toolbar */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
        <div style={{ flex:1, position:'relative' }}>
          <div style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)',
            color:'var(--text3)', width:14, height:14, pointerEvents:'none' }}>
            <Icon.Search/>
          </div>
          <input className="table-search" style={{ paddingLeft:32 }}
            placeholder="Search by agency or dimension..."
            value={search} onChange={e => setSearch(e.target.value)}/>
        </div>
        {retiredCount > 0 && (
          <label style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer',
            whiteSpace:'nowrap', fontSize:12, color:'var(--text3)' }}>
            <div className="toggle" style={{ width:30, height:16 }}>
              <input type="checkbox" checked={showRetired}
                onChange={e => setShowRetired(e.target.checked)}/>
              <div className="toggle-track"/>
              <div className="toggle-thumb" style={{ width:10, height:10, top:3, left:3 }}/>
            </div>
            Show retired

        )}
      </div>

      {/* Agency cards */}
      {filtered.length === 0 ? (
        <div className="status-row status-info">No records match the current filter.</div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {filtered.map(({ agencyId, agency, rows: agRows }) => {
            const acronym = agency?.agency_acronymn || `Agency #${agencyId}`;
            const name    = agency?.agency_name || '';
            const sorted  = [...agRows].sort((a, b) => {
              const da = dimensions.find(d => d[`${dimTable}_id`] === a[dimField]);
              const db = dimensions.find(d => d[`${dimTable}_id`] === b[dimField]);
              return (da?.[dimAcronym] || '').localeCompare(db?.[dimAcronym] || '');
            });
            const totalWeights = sorted.reduce((s, r) => s + (r.weight_value ?? 0), 0);

            return (
              <div key={agencyId} style={{
                background: 'var(--bg2)',
                border: '1px solid var(--border)',
                borderLeft: `3px solid ${accent}`,
                borderRadius: 'var(--radius-lg)',
                padding: '14px 16px',
              }}>
                {/* Agency header */}
                <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:12 }}>
                  <span style={{ fontSize:13, fontWeight:600, color:'var(--text)' }}>{acronym}</span>

                    {sorted.length} weight{sorted.length !== 1 ? 's' : ''}

                    <span style={{ color:'var(--text2)' }}>

                  </span>
                </div>

                {/* Weight boxes -- one per dimension, inline */}
                <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                  {sorted.map(row => {
                    const pk        = row[schema.pk];
                    const isRetired = !!row.retiring_timestamp;
                    const dim       = dimensions.find(d => d[`${dimTable}_id`] === row[dimField]);
                    const acro      = dim?.[dimAcronym]  || `#${row[dimField]}`;
                    const tooltip   = dim?.[dimDisplay]  || '';

                    return (
                      <div key={pk}
                        title={tooltip}
                        onClick={() => !isRetired && canEdit && openEdit(row)}

                          alignItems: 'center',
                          gap: 2,
                          padding: '5px 10px',
                          background: isRetired ? 'var(--bg)' : 'var(--bg3)',
                          border: `1px solid ${isRetired ? 'var(--border)' : accent}30`,
                          borderRadius: 'var(--radius)',

                      >
                        {/* Acronym */}
                        <span style={{
                          fontSize: 9, fontWeight: 600,
                          fontFamily: 'var(--mono)',
                          color: accent,
                          letterSpacing: '0.06em',
                          textTransform: 'uppercase',
                        }}>
                          {acro}
                        </span>

                        {/* Weight value */}
                        <span style={{
                          fontSize: 13, fontWeight: 600,
                          color: 'var(--text)',
                          lineHeight: 1.2,
                          fontFamily: 'var(--mono)',
                        }}>
                          {row.weight_value ?? '--'}
                        </span>

                        {/* Retire / restore -- hover reveal */}
                        <button
                          style={{
                            position: 'absolute', top: 2, right: 2,
                            background: 'none', border: 'none',
                            cursor: 'pointer', padding: 1,
                            color: 'var(--text3)',
                            opacity: 0,
                            transition: 'opacity 0.15s',
                            width: 10, height: 10,
                          }}
                          className="weight-box-action"
                          onClick={() => isRetired
                            ? restoreRecord(tableName, pk)
                            : retireRecord(tableName, pk)
                          }
                          title={isRetired ? 'Restore' : 'Retire'}
                        >
                          <div style={{ width:10, height:10 }}>
                            {isRetired ? <Icon.Eye/> : <Icon.EyeOff/>}
                          </div>
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function OwnershipOrgChart() {
  const { data, openForm, retireRecord, restoreRecord, canEdit, nextPk, stewardIdentity, isMaster } = useApp();
  const accent = '#18b4d4';

  const [showRetired,   setShowRetired]   = useState(false);
  const [myDataOnly,    setMyDataOnly]    = useState(() => loadMyDataPref('moj_dq_org_mydata_v1', isMaster));
  const [expanded,      setExpanded]      = useState({});
  const [expandedDirs,  setExpandedDirs]  = useState({});

  useEffect(() => { saveMyDataPref('moj_dq_org_mydata_v1', myDataOnly); }, [myDataOnly]);

  const toggleExpand = (aid) => setExpanded(prev => ({ ...prev, [aid]: !prev[aid] }));
  const toggleDir    = (did) => setExpandedDirs(prev => ({ ...prev, [did]: !prev[did] }));

  const isLive = (r) => showRetired || !r.retiring_timestamp;

  const physAccent = '#7c5cbf';
  const greenAccent = 'var(--green)';
  const mdot = String.fromCharCode(183);

  // Build profiling lookup
  const profilingByKey = useMemo(() => {
    const m = {};
    for (const p of (data?.field_profiling || [])) {
      if (!p.retiring_timestamp)
        m[`${p.source_database_name}|||${p.source_table_name}|||${p.source_field_name}`] = true;
    }
    return m;
  }, [data]);

  // Build alloc count by CDE
  const allocCountByCde = useMemo(() => {
    const m = {};
    for (const a of (data?.data_quality_rule_allocation || [])) {
      if (!a.retiring_timestamp)
        m[a.critical_data_element_id] = (m[a.critical_data_element_id] || 0) + 1;
    }
    return m;
  }, [data]);

  // Derive agency ids for My Data filter
  const myAgencyIds = useMemo(() => {
    if (!myDataOnly) return null;
    var myCdsIds = getMyStewardCdsIds(data, stewardIdentity);
    if (!myCdsIds) return null;
    var cdsById = {};
    (data.critical_data_set || []).forEach(function(c) { cdsById[c.critical_data_set_id] = c; });
    var dirById = {};
    (data.directorate || []).forEach(function(d) { dirById[d.directorate_id] = d; });
    var ids = new Set();
    myCdsIds.forEach(function(cdsId) {
      var cds = cdsById[cdsId];
      if (!cds) return;
      var dir = dirById[cds.directorate_id];
      if (dir) ids.add(dir.executive_agency_id);
    });
    return ids;
  }, [myDataOnly, stewardIdentity, data]);

  // Build per-agency tree data
  const trees = useMemo(() => {
    if (!data) return [];
    const agencies = [...(data.executive_agency || [])]
      .filter(a => (showRetired || !a.retiring_timestamp) && (myAgencyIds === null || myAgencyIds.has(a.executive_agency_id)))
      .sort((a,b) => (a.agency_acronymn||'').localeCompare(b.agency_acronymn||''));

    return agencies.map(agency => {
      const aid = agency.executive_agency_id;

      const patrons = (data.data_patron || [])
        .filter(p => p.executive_agency_id === aid && isLive(p));

      const directorates = [...(data.directorate || [])]
        .filter(d => d.executive_agency_id === aid && isLive(d))
        .sort((a,b) => (a.directorate_name||'').localeCompare(b.directorate_name||''));

      const branches = directorates.map(dir => {
        const owners = (data.data_owner || [])
          .filter(o => o.directorate_id === dir.directorate_id && isLive(o));

        const dataSets = (data.critical_data_set || [])
          .filter(ds => ds.directorate_id === dir.directorate_id && isLive(ds));
        const dataSetIds = new Set(dataSets.map(ds => ds.critical_data_set_id));

        const stewardships = (data.stewardship || [])
          .filter(s => dataSetIds.has(s.critical_data_set_id) && isLive(s));

        const stewardIds = [...new Set(stewardships.map(s => s.data_steward_id))];
        const stewards = stewardIds
          .map(sid => {
            const steward = (data.data_steward || []).find(s => s.data_steward_id === sid);
            const role    = (data.steward_role_type || []).find(r =>
              r.steward_role_type_id === steward?.steward_role_type_id);
            return steward ? { ...steward, role_description: role?.role_description || '' } : null;
          })
          .filter(Boolean)
          .sort((a,b) => (a.data_steward_name||'').localeCompare(b.data_steward_name||''));

        // CDE counts per directorate
        const dirCdes = (data.critical_data_element || []).filter(c =>
          !c.retiring_timestamp && dataSetIds.has(c.critical_data_set_id));
        const cdeCount = dirCdes.length;
        const profiledCount = dirCdes.filter(c =>
          profilingByKey[`${c.source_database_name}|||${c.source_table_name}|||${c.source_field_name}`]
        ).length;
        const ruleCount = dirCdes.reduce((s, c) =>
          s + (allocCountByCde[c.critical_data_element_id] || 0), 0);

        // ERD: at most one data owner per directorate
        const profiledPct = cdeCount > 0 ? Math.round(profiledCount / cdeCount * 100) : null;

        const cdsWithStewards = dataSets
          .filter(ds => isLive(ds))
          .sort((a,b) => (a.data_set_name||'').localeCompare(b.data_set_name||''))
          .map(ds => {
            const dsId = ds.critical_data_set_id;
            const cwStewardships = (data.stewardship || [])
              .filter(s => s.critical_data_set_id === dsId && isLive(s));
            const cwStewardIds = [...new Set(cwStewardships.map(s => s.data_steward_id))];
            const cwStewards = cwStewardIds
              .map(sid => {
                const steward = (data.data_steward || []).find(st => st.data_steward_id === sid);
                const role    = (data.steward_role_type || []).find(r =>
                  r.steward_role_type_id === steward?.steward_role_type_id);
                return steward ? { ...steward, role_description: role?.role_description || '' } : null;
              })
              .filter(Boolean)
              .sort((a,b) => (a.data_steward_name||'').localeCompare(b.data_steward_name||''));
            // Per-CDS stats
            const cdsCdes = (data.critical_data_element || []).filter(c =>
              !c.retiring_timestamp && c.critical_data_set_id === dsId);
            const cdsCdeCount     = cdsCdes.length;
            const cdsProfiledCount = cdsCdes.filter(c =>
              profilingByKey[`${c.source_database_name}|||${c.source_table_name}|||${c.source_field_name}`]
            ).length;
            const cdsRuleCount    = cdsCdes.reduce((s, c) =>
              s + (allocCountByCde[c.critical_data_element_id] || 0), 0);
            const cdsProfiledPct  = cdsCdeCount > 0
              ? Math.round(cdsProfiledCount / cdsCdeCount * 100) : null;
            return { ds, stewards: cwStewards, cdsCdeCount, cdsRuleCount, cdsProfiledPct };
          });

        return { dir, owners, stewards, dataSetCount: dataSets.length,
          cdeCount, profiledCount, ruleCount, profiledPct, cdsWithStewards };
      });

      // Agency-level totals
      const agCdeCount      = branches.reduce((s, b) => s + b.cdeCount, 0);
      const agProfiledCount = branches.reduce((s, b) => s + b.profiledCount, 0);
      const agRuleCount     = branches.reduce((s, b) => s + b.ruleCount, 0);
      const agCdsCount      = branches.reduce((s, b) => s + b.dataSetCount, 0);
      // ERD: one owner per directorate max -- raw sum equals unique individual count
      const agOwnerCount    = branches.reduce((s, b) => s + b.owners.length, 0);
      // Stewards deduplicated by data_steward_id (same steward can span multiple CDS)
      const agStewardIds    = new Set(branches.flatMap(b => b.stewards.map(s => s.data_steward_id)));
      const agStewardCount  = agStewardIds.size;
      const agProfiledPct   = agCdeCount > 0 ? Math.round(agProfiledCount / agCdeCount * 100) : null;

      return { agency, patrons, branches, agCdeCount, agProfiledCount, agRuleCount, agCdsCount,
               agOwnerCount, agStewardCount, agProfiledPct };
    });
  }, [data, showRetired, myAgencyIds, profilingByKey, allocCountByCde]);

  function ProfilingSpan({ pct }) {
    if (pct === null)  return <span style={{ fontSize:11, color:'var(--text3)', fontFamily:'var(--mono)' }}>no CDEs profiled</span>;
    if (pct === 0)     return <span style={{ fontSize:11, color:'var(--text3)', fontFamily:'var(--mono)' }}>no CDEs profiled</span>;
    if (pct === 100)   return <span style={{ fontSize:11, color:'var(--green)', fontFamily:'var(--mono)' }}>100% profiled</span>;
    return <span style={{ fontSize:11, color:'var(--purple)', fontFamily:'var(--mono)' }}>{pct}% profiled</span>;
  }

  return (
    <div className="fade-in">
      {/* Page header */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div className="page-title" style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:22, borderRadius:2, background:accent, flexShrink:0 }}/>
            Organisation
          </div>
          <div className="page-sub">
            Accountability hierarchy - patron, owners and stewards per agency
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:6 }}>
          {canEdit && (
            <button className="btn btn-primary"
              style={{ fontSize:12, padding:'5px 12px' }}
              onClick={() => openForm('executive_agency', {
                executive_agency_id:      nextPk('executive_agency'),
                executive_agency_type_id: null,
                agency_acronymn:          null,
                agency_name:              null,
                retiring_timestamp:       null,
              })}>
              + Add Agency
            </button>
          )}
          <MyDataToggle
            active={myDataOnly}
            onToggle={function() { setMyDataOnly(function(v) { return !v; }); }}
            available={!!stewardIdentity}
            accent={accent}
          />
          <label style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer',
            whiteSpace:'nowrap', fontSize:12, color:'var(--text3)' }}>
            <div className="toggle" style={{ width:30, height:16 }}>
              <input type="checkbox" checked={showRetired}
                onChange={e => setShowRetired(e.target.checked)}/>
              <div className="toggle-track"/>
              <div className="toggle-thumb" style={{ width:10, height:10, top:3, left:3 }}/>
            </div>
            Show retired
          </label>
        </div>
      </div>

      {/* Agency rows */}
      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
        {trees.map(({ agency, patrons, branches, agCdeCount, agProfiledCount, agRuleCount, agCdsCount,

          const aid      = agency.executive_agency_id;
          const isOpen   = !!expanded[aid];

          return (

              {/* Agency header row -- clickable to expand */}
              <div style={{ display:'flex', alignItems:'center', gap:10,
                padding:'11px 14px', cursor:'pointer' }}

                {/* Chevron */}
                <div style={{ color:'var(--text3)', width:14, height:14, flexShrink:0,
                  transform: isOpen ? 'rotate(90deg)' : 'none',

                  <Icon.ChevronR/>

                <div style={{ flex:1, minWidth:0 }}>

                  <div style={{ display:'flex', alignItems:'center', gap:4,

                    </span>
                    <span style={{ fontSize:11, color:'var(--text3)', fontFamily:'var(--mono)' }}>
                      {mdot + ' ' + branches.length + ' directorate' + (branches.length !== 1 ? 's' : '') + ' ' + mdot + ' ' +
                       agOwnerCount + ' owner' + (agOwnerCount !== 1 ? 's' : '') + ' ' + mdot + ' ' +

              {/* Expanded hierarchy */}
              {isOpen && (
                <div style={{ borderTop:'1px solid var(--border)',
                  padding:'12px 14px 14px 38px' }}>

                  {/* Directorate branches */}
                  {branches.length === 0 ? (
                    <div style={{ fontSize:12, color:'var(--text3)', fontStyle:'italic',

                      {branches.map(({ dir, owners, stewards, dataSetCount,

                              <div style={{ flex:1, minWidth:0 }}>

                                <div style={{ display:'flex', alignItems:'center', gap:4,

                                  <ProfilingSpan pct={profiledPct}/>

                              </div>

                              {/* Edit / retire buttons */}

                                      style={{ padding:'2px 6px', fontSize:10 }}

                            {/* Directorate expanded: CDS table (read-only) */}

                              <div style={{ marginTop:8, paddingTop:6, paddingLeft:48 }}>
                                {cdsWithStewards.length === 0 ? (
                                  <div style={{ fontSize:12, color:'var(--text3)',
                                    fontStyle:'italic' }}>
                                    No critical data sets found.
                                  </div>
                                ) : (
                                  <div>
                                    {/* CDS rows */}
                                    {cdsWithStewards.map(({ ds, stewards: cdsStews,
                                      cdsCdeCount, cdsRuleCount, cdsProfiledPct }, ci) => (
                                      <div key={ds.critical_data_set_id}
                                        style={{ padding:'10px 0',
                                          borderBottom: ci < cdsWithStewards.length - 1
                                            ? '1px solid var(--border)' : 'none' }}>
                                        {/* CDS pill anchors all content to the right */}
                                        <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
                                          <div style={{ flexShrink:0 }}>
                                            <OrgRolePill label="CDS" color="#5f7294"/>
                                          </div>
                                          <div style={{ minWidth:0 }}>
                                            {/* Row 1: name - stats */}
                                            <div style={{ display:'flex', alignItems:'center',
                                              gap:4, flexWrap:'wrap', marginBottom:5 }}>
                                              <span style={{ fontSize:12, fontWeight:600,
                                                color:'var(--text)' }}>
                                                {ds.data_set_name || '-'}
                                              </span>
                                              <span style={{ fontSize:11, color:'var(--text3)',
                                                fontFamily:'var(--mono)' }}>
                                                {mdot + ' ' +
                                                 cdsCdeCount + ' CDE' + (cdsCdeCount !== 1 ? 's' : '') +
                                                 ' ' + mdot + ' ' +
                                                 cdsRuleCount + ' rule' + (cdsRuleCount !== 1 ? 's' : '') +
                                                 ' ' + mdot + ' '}
                                              </span>
                                              <ProfilingSpan pct={cdsProfiledPct}/>
                                            </div>
                                            {/* Row 2: stewards */}
                                            <div style={{ display:'flex', flexDirection:'column',
                                              gap:4, marginBottom:6 }}>
                                              {cdsStews.length === 0
                                                ? <OrgNone/>
                                                : cdsStews.map(s => (
                                                    <div key={s.data_steward_id}
                                                      style={{ display:'flex', alignItems:'center', gap:6 }}>
                                                      <OrgRolePill
                                                        label={s.role_description || 'Steward'}
                                                        color={physAccent}/>
                                                      <span style={{ fontSize:12,
                                                        color:'var(--text2)', fontFamily:'var(--mono)' }}>

                                                      </span>

                                            <div style={{ fontSize:12, color:'var(--text2)',
                                              lineHeight:1.6 }}>
                                              {ds.data_set_description || '-'}
                                            </div>
                                          </div>
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}


// DataQualityRuleView replaced by RuleExplorerView in 145_view_rules.js

function CdeCriticalityFormPanel({ cdeId, existingRows, preAgencyId, preDirId, preCdsId, onClose, data }) {
  const { upsertRecord, nextPk } = useApp();
  const accent  = TABLE_GROUPS.find(g => g.tables.includes('cde_criticality'))?.accent || 'var(--accent)';

  const cdes     = data?.critical_data_element || [];
  const cdSets   = data?.critical_data_set || [];
  const dirs     = data?.directorate || [];
  const agencies = data?.executive_agency || [];
  const GROUP_ORDER = ['OPS', 'POL', 'REP', 'STRAT'];
  const groups   = useMemo(() =>
    [...(data?.criticality_group || [])].filter(g => !g.retiring_timestamp)
      .sort((a,b) => {
        const ai = GROUP_ORDER.indexOf(a.criticality_group_acronymn);
        const bi = GROUP_ORDER.indexOf(b.criticality_group_acronymn);
        if (ai !== -1 && bi !== -1) return ai - bi;
        if (ai !== -1) return -1;
        if (bi !== -1) return 1;
        return (a.criticality_group_description||'').localeCompare(b.criticality_group_description||'');
      }),
  [data]);
  const levels   = useMemo(() =>
    [...(data?.criticality_level || [])].filter(l => !l.retiring_timestamp)
      .sort((a,b) => (a.criticality_description||'').localeCompare(b.criticality_description||'')),
  [data]);

  const cdeById    = useMemo(() => Object.fromEntries(cdes.map(c  => [c.critical_data_element_id, c])), [cdes]);
  const cdsById    = useMemo(() => Object.fromEntries(cdSets.map(d => [d.critical_data_set_id, d])),    [cdSets]);
  const dirById    = useMemo(() => Object.fromEntries(dirs.map(d   => [d.directorate_id, d])),          [dirs]);
  const agencyById = useMemo(() => Object.fromEntries(agencies.map(a => [a.executive_agency_id, a])),   [agencies]);

  const isEdit = !!cdeId;

  // Cascading filter states for Add
  const [filterAgencyId, setFilterAgencyId] = useState(preAgencyId || null);
  const [filterDirId,    setFilterDirId]    = useState(preDirId    || null);
  const [filterCdsId,    setFilterCdsId]    = useState(preCdsId    || null);
  const [selectedCdeId,  setSelectedCdeId]  = useState(cdeId || null);

  // Level selections: { [criticality_group_id]: criticality_level_id }
  const [levelMap, setLevelMap] = useState(() => {
    const m = {};
    if (existingRows && existingRows.length > 0) {
      for (const r of existingRows) m[r.criticality_group_id] = r.criticality_level_id;
      return m;
    }
    // No existing rows: default all groups to Medium
    const medium = (data?.criticality_level || []).find(l => !l.retiring_timestamp && l.criticality_description === 'Medium');
    if (!medium) return m;
    for (const g of (data?.criticality_group || []).filter(g => !g.retiring_timestamp)) {
      m[g.criticality_group_id] = medium.criticality_level_id;
    }
    return m;
  });
  const [errors, setErrors] = useState({});

  const activeCdeId = isEdit ? cdeId : selectedCdeId;

  // CDEs already fully defined (all groups assigned)
  const fullyDefinedCdes = useMemo(() => new Set(
    Object.entries(
      (data?.cde_criticality || [])
        .filter(r => !r.retiring_timestamp)
        .reduce((m, r) => { m[r.critical_data_element_id] = (m[r.critical_data_element_id]||0)+1; return m; }, {})
    ).filter(([, count]) => count >= groups.length).map(([id]) => parseInt(id))
  ), [data, groups]);

  // Check if selected CDE already has criticalities (for Add only)
  const alreadyDefined = useMemo(() => {
    if (isEdit || !activeCdeId) return false;
    return fullyDefinedCdes.has(activeCdeId);
  }, [isEdit, activeCdeId, fullyDefinedCdes]);

  // Cascading options
  const agencyOpts = useMemo(() =>
    [...agencies].filter(a => !a.retiring_timestamp)
      .sort((a,b) => (a.agency_acronymn||'').localeCompare(b.agency_acronymn||'')),
  [agencies]);

  const dirOpts = useMemo(() =>
    [...dirs].filter(d => !d.retiring_timestamp && d.executive_agency_id === filterAgencyId)
      .sort((a,b) => (a.directorate_name||'').localeCompare(b.directorate_name||'')),
  [dirs, filterAgencyId]);

  const cdsOpts = useMemo(() =>
    [...cdSets].filter(d => !d.retiring_timestamp && d.directorate_id === filterDirId)
      .sort((a,b) => (a.data_set_name||'').localeCompare(b.data_set_name||'')),
  [cdSets, filterDirId]);

  const cdeOpts = useMemo(() =>
    [...cdes].filter(c => !c.retiring_timestamp &&
      c.critical_data_set_id === filterCdsId &&
      !fullyDefinedCdes.has(c.critical_data_element_id))
      .sort((a,b) => (a.source_field_name||'').localeCompare(b.source_field_name||'')),
  [cdes, filterCdsId, fullyDefinedCdes]);

  // Resolve CDE display info (for edit read-only label)
  const cde    = activeCdeId ? cdeById[activeCdeId] : null;
  const cds    = cde ? cdsById[cde.critical_data_set_id] : null;
  const dir    = cds ? dirById[cds.directorate_id] : null;
  const agency = dir ? agencyById[dir.executive_agency_id] : null;

  const inputBase = {
    width:'100%', padding:'7px 10px', fontSize:13,
    background:'var(--bg3)', border:'1px solid var(--border)',
    borderRadius:'var(--radius)', color:'var(--text)',
    fontFamily:'var(--sans)', outline:'none',
  };

  const handleSave = () => {
    const errs = {};
    if (!activeCdeId) errs['cde'] = 'Required';
    for (const grp of groups) {
      if (!levelMap[grp.criticality_group_id])
        errs[grp.criticality_group_id] = 'Required';
    }
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }

    // Pre-compute PKs for all groups before any upsert calls.
    // nextPk reads from a stale data snapshot so calling it in a loop returns
    // the same value every time. Call it once and increment manually instead.
    let freeSeq = nextPk('cde_criticality');
    const pkFor = {};
    for (const grp of groups) {
      const gid = grp.criticality_group_id;
      const existing = (data?.cde_criticality || []).find(r =>
        r.critical_data_element_id === activeCdeId &&
        r.criticality_group_id === gid &&
        !r.retiring_timestamp
      );
      pkFor[gid] = existing ? existing.cde_criticality_id : freeSeq++;
    }

    // Upsert one record per group using pre-computed PKs
    for (const grp of groups) {
      upsertRecord('cde_criticality', {
        cde_criticality_id:       pkFor[grp.criticality_group_id],
        critical_data_element_id: activeCdeId,
        criticality_group_id:     grp.criticality_group_id,
        criticality_level_id:     levelMap[grp.criticality_group_id],
        retiring_timestamp:       null,
      });
    }
    onClose();
  };

  return (
    <>
      <div onClick={onClose} style={{
        position:'fixed', inset:0, zIndex:300, background:'var(--overlay-sm)',
      }}/>
      <div style={{
        position:'fixed', top:0, right:0, bottom:0,
        width:'min(520px, 55vw)',
        background:'var(--bg2)', borderLeft:'1px solid var(--border2)',
        zIndex:400, display:'flex', flexDirection:'column',
        boxShadow:'-4px 0 24px var(--overlay-md)',
        animation:'slideInRight 0.18s ease',
      }}>
        {/* Header */}
        <div style={{ padding:'14px 18px', borderBottom:'1px solid var(--border)',
          display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.08em',
              textTransform:'uppercase', color:accent, marginBottom:3 }}>
              {isEdit ? 'Edit criticality' : 'Add criticality'}
            </div>
            <div style={{ fontSize:13, fontWeight:500, color:'var(--text)' }}>
              CDE Criticality
            </div>
          </div>
          <button className="btn btn-primary" onClick={handleSave}
            style={{ padding:'6px 14px', fontSize:12 }}>
            <Icon.Check/> {isEdit ? 'Save' : 'Add'}
          </button>
          <button className="btn btn-ghost" style={{ padding:'6px 8px' }} onClick={onClose}>
            <Icon.X/>
          </button>
        </div>

        {/* Body */}
        <div style={{ flex:1, overflow:'auto', padding:'16px 18px' }}>

          {/* CDE selector (Add) or read-only label (Edit) */}
          <div style={{ marginBottom:16 }}>
            <label style={{ display:'block', fontSize:11, fontWeight:600,
              color: errors['cde'] ? 'var(--red)' : 'var(--text2)',
              marginBottom:4 }}>
              Critical Data Element
              <span style={{ color:'var(--red)', marginLeft:3 }}>*</span>
            </label>
            {isEdit ? (
              <div style={{ padding:'7px 10px', background:'var(--bg3)',
                border:'1px solid var(--border)', borderRadius:'var(--radius)',
                fontSize:12, fontFamily:'var(--mono)', color:'var(--text)' }}>
                <div style={{ fontSize:11, color:'var(--text3)', marginBottom:2 }}>
                  {[agency?.agency_acronymn, cds?.data_set_name].filter(Boolean).join(' - ')}
                </div>
                <div style={{ wordBreak:'break-all' }}>{cde?.source_field_name}</div>
              </div>
            ) : (
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {/* Agency */}
                <select value={filterAgencyId ?? ''} style={{ ...inputBase, cursor:'pointer' }}
                  onChange={e => {
                    const aid = e.target.value ? parseInt(e.target.value) : null;
                    setFilterAgencyId(aid);
                    setFilterDirId(null);
                    setFilterCdsId(null);
                    setSelectedCdeId(null);
                    setErrors(prev => ({ ...prev, cde: null }));
                  }}>
                  <option value="">-- select agency --</option>
                  {agencyOpts.map(a => (
                    <option key={a.executive_agency_id} value={a.executive_agency_id}>
                      {a.agency_acronymn} - {a.agency_name}
                    </option>
                  ))}
                </select>
                {/* Directorate */}
                <select value={filterDirId ?? ''} disabled={!filterAgencyId}
                  style={{ ...inputBase, cursor: filterAgencyId ? 'pointer' : 'not-allowed',
                    opacity: filterAgencyId ? 1 : 0.5 }}
                  onChange={e => {
                    const did = e.target.value ? parseInt(e.target.value) : null;
                    setFilterDirId(did);
                    setFilterCdsId(null);
                    setSelectedCdeId(null);
                  }}>
                  <option value="">{filterAgencyId ? '-- select directorate --' : '-- select agency first --'}</option>
                  {dirOpts.map(d => (
                    <option key={d.directorate_id} value={d.directorate_id}>{d.directorate_name}</option>
                  ))}
                </select>
                {/* Critical Data Set */}
                {filterDirId && cdsOpts.length === 0 ? (
                  <div style={{ padding:'8px 12px',
                    background:'var(--bg3)', border:'1px solid var(--amber)',
                    borderRadius:'var(--radius)', fontSize:12,
                    color:'var(--amber)', display:'flex', gap:6, alignItems:'center' }}>
                    <span style={{ width:14, height:14, flexShrink:0 }}><Icon.Warning/></span>
                    No data sets found in this directorate.
                  </div>
                ) : (
                  <select value={filterCdsId ?? ''} disabled={!filterDirId}
                    style={{ ...inputBase, cursor: filterDirId ? 'pointer' : 'not-allowed',
                      opacity: filterDirId ? 1 : 0.5 }}
                    onChange={e => {
                      const cid = e.target.value ? parseInt(e.target.value) : null;
                      setFilterCdsId(cid);
                      setSelectedCdeId(null);
                    }}>
                    <option value="">{filterDirId ? '-- select data set --' : '-- select directorate first --'}</option>
                    {cdsOpts.map(d => (
                      <option key={d.critical_data_set_id} value={d.critical_data_set_id}>{d.data_set_name}</option>
                    ))}
                  </select>
                )}
                {/* CDE */}
                {filterCdsId && cdeOpts.length === 0 ? (
                  <div style={{ padding:'8px 12px',
                    background:'var(--bg3)', border:'1px solid var(--amber)',
                    borderRadius:'var(--radius)', fontSize:12,
                    color:'var(--amber)', display:'flex', gap:6, alignItems:'center' }}>
                    <span style={{ width:14, height:14, flexShrink:0 }}><Icon.Warning/></span>
                    {(data?.critical_data_element || []).some(c =>
                      !c.retiring_timestamp && c.critical_data_set_id === filterCdsId
                    )
                      ? 'All CDEs in this data set already have criticalities defined.'
                      : 'No CDEs found in this data set.'
                    }
                  </div>
                ) : (
                  <select value={selectedCdeId ?? ''} disabled={!filterCdsId}
                    style={{ ...inputBase, cursor: filterCdsId ? 'pointer' : 'not-allowed',
                      opacity: filterCdsId ? 1 : 0.5,
                      borderColor: errors['cde'] ? 'var(--red)' : 'var(--border)' }}
                    onChange={e => {
