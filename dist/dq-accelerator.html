                                                      style={{ fontSize:10, padding:'2px 6px' }}
                                                      onClick={() => openEditCde(cde)} title="Edit">
                                                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                                    </button>
                                                  )}
                                                  {isRetired ? (
                                                    <button {...dp} className="btn btn-ghost"
                                                      style={{ fontSize:10, padding:'2px 6px' }}
                                                      onClick={() => canEdit && restoreRecord('critical_data_element', pk)}>
                                                      <Icon.Eye/>
                                                    </button>
                                                  ) : (
                                                    <button {...dp} className="btn btn-ghost"
                                                      style={{ fontSize:10, padding:'2px 6px' }}
                                                      onClick={() => canEdit && retireRecord('critical_data_element', pk)}
                                                      title="Retire">
                                                      <Icon.EyeOff/>
                                                    </button>
                                                  )}
                                                </div>
                                              </div>
                                              {cdeExpanded && metricCount > 0 && (
                                                <div style={{
                                                  borderTop:'1px solid var(--border)',
                                                  background:'var(--bg3)',
                                                  padding:'6px 10px 6px 24px',
                                                  display:'flex', flexDirection:'column', gap:4,
                                                }}>
                                                  {[...(allocsByCdeId[pk] || [])].sort((a, b) => {
                                                    const na = rulesById[a.data_quality_rule_id]?.rule_name || '';
                                                    const nb = rulesById[b.data_quality_rule_id]?.rule_name || '';
                                                    const ag = na.toUpperCase().startsWith('GENERIC');
                                                    const bg = nb.toUpperCase().startsWith('GENERIC');
                                                    if (ag !== bg) return ag ? -1 : 1;
                                                    return na.localeCompare(nb);
                                                  }).map(alloc => {
                                                    const rule       = rulesById[alloc.data_quality_rule_id];
                                                    const dim        = dimensionsById[alloc.quality_dimension_id];
                                                    const hasSample  = !!(rule?.sql_code_sample);
                                                    const missingFlt = cde && !cde.source_snapshot_filter;
                                                    if (!rule) return null;
                                                    return (
                                                      <div key={alloc.data_quality_rule_allocation_id} style={{
                                                        display:'grid',
                                                        gridTemplateColumns:'1fr 110px 70px 60px 64px 52px',
                                                        gap:8, padding:'5px 8px',
                                                        background:'var(--bg)',
                                                        border: missingFlt
                                                          ? '1px solid var(--red)'
                                                          : '1px solid var(--border)',
                                                        borderRadius:'var(--radius)',
                                                        alignItems:'center',
                                                        opacity: alloc.retiring_timestamp ? 0.5 : 1,
                                                      }}>
                                                        {/* Rule name */}
                                                        <div style={{ minWidth:0 }}>
                                                          <div style={{ fontSize:11, fontFamily:'var(--mono)',
                                                            fontWeight:500, color:'var(--text)',
                                                            whiteSpace:'nowrap', overflow:'hidden',
                                                            textOverflow:'ellipsis', display:'flex',
                                                            alignItems:'center', gap:4 }}>
                                                            {rule.rule_name}
                                                            {missingFlt && (
                                                              <span title="Missing snapshot filter -- SQL cannot be composed"
                                                                style={{ color:'var(--red)', flexShrink:0,
                                                                  width:11, height:11, display:'inline-flex' }}>
                                                                <Icon.Warning/>
                                                              </span>
                                                            )}
                                                          </div>
                                                        </div>

                                                        {/* Dimension */}
                                                        <span style={{ fontSize:11, color:accent,
                                                          fontFamily:'var(--mono)' }}>
                                                          {dim?.dimension_name || '--'}
                                                        </span>

                                                        {/* Frequency */}
                                                        <span style={{ fontSize:11, color:'var(--text2)' }}>
                                                          {alloc.frequency || '--'}
                                                        </span>

                                                        {/* Bumper value */}
                                                        <div>
                                                          {alloc.bumper_value !== null && alloc.bumper_value !== undefined
                                                            ? (
                                                              <span style={{
                                                                fontSize:11, fontFamily:'var(--mono)',
                                                                fontWeight:600, color:'var(--amber)',
                                                                background:'var(--amber-bg)',
                                                                border:'1px solid var(--amber)',
                                                                borderRadius:3, padding:'1px 7px',
                                                                whiteSpace:'nowrap',
                                                              }}>
                                                                {alloc.bumper_value}
                                                              </span>
                                                            ) : (
                                                              <span style={{ fontSize:11,
                                                                color:'var(--text3)',
                                                                fontFamily:'var(--mono)' }}>--</span>
                                                            )
                                                          }
                                                        </div>

                                                        {/* SQL buttons */}
                                                        <div style={{ display:'flex', gap:3, alignItems:'center' }}>
                                                          <button className="btn btn-ghost"
                                                            style={{ padding:'2px 5px',
                                                              color: missingFlt ? 'var(--red)' : 'var(--accent)' }}
                                                            disabled={missingFlt}
                                                            title={missingFlt
                                                              ? 'Missing snapshot filter'
                                                              : 'View composed rule SQL'}
                                                            onClick={e => {
                                                              e.stopPropagation();
                                                              openSql('rule', rule, alloc, cde, cds, agency);
                                                            }}>
                                                            <div style={{ width:13, height:13 }}><Icon.Code/></div>
                                                          </button>
                                                          {hasSample ? (
                                                            <button className="btn btn-ghost"
                                                              style={{ padding:'2px 5px', color:'var(--text2)' }}
                                                              disabled={missingFlt}
                                                              title={missingFlt
                                                                ? 'Missing snapshot filter'
                                                                : 'View composed sample SQL'}
                                                              onClick={e => {
                                                                e.stopPropagation();
                                                                openSql('sample', rule, alloc, cde, cds, agency);
                                                              }}>
                                                              <div style={{ width:13, height:13 }}><Icon.Sample/></div>
                                                            </button>
                                                          ) : (
                                                            <span style={{
                                                              fontSize:8, fontFamily:'var(--mono)',
                                                              fontWeight:600, letterSpacing:'0.04em',
                                                              color:'var(--text3)', background:'var(--bg)',
                                                              border:'1px solid var(--border)',
                                                              borderRadius:3, padding:'1px 4px',
                                                              whiteSpace:'nowrap',
                                                            }} title="No sample code -- engine uses default approach">
                                                              DEF
                                                            </span>
                                                          )}
                                                        </div>

                                                        {/* Edit / retire actions */}
                                                        <div style={{ display:'flex', gap:2, alignItems:'center', justifyContent:'flex-end' }}>
                                                          {!alloc.retiring_timestamp ? (
                                                            <>
                                                              <button className="btn btn-ghost"
                                                                style={{ padding:'2px 4px' }}
                                                                title="Edit allocation"
                                                                onClick={e => {
                                                                  e.stopPropagation();
                                                                  setAllocPanel({ isEdit: true, cdeId: pk, record: { ...alloc } });
                                                                }}>
                                                                <div style={{ width:11, height:11 }}><Icon.Pencil/></div>
                                                              </button>
                                                              <button className="btn btn-ghost"
                                                                style={{ padding:'2px 4px', color:'var(--red)' }}
                                                                title="Retire allocation"
                                                                onClick={e => {
                                                                  e.stopPropagation();
                                                                  retireRecord('data_quality_rule_allocation', alloc.data_quality_rule_allocation_id);
                                                                }}>
                                                                <div style={{ width:11, height:11 }}><Icon.EyeOff/></div>
                                                              </button>
                                                            </>
                                                          ) : (
                                                            <button className="btn btn-ghost"
                                                              style={{ padding:'2px 4px', color:'var(--text3)' }}
                                                              title="Restore allocation"
                                                              onClick={e => {
                                                                e.stopPropagation();
                                                                restoreRecord('data_quality_rule_allocation', alloc.data_quality_rule_allocation_id);
                                                              }}>
                                                              <div style={{ width:11, height:11 }}><Icon.Eye/></div>
                                                            </button>
                                                          )}
                                                        </div>
                                                      </div>
                                                    );
                                                  })}
                                                </div>
                                              )}
                                            </React.Fragment>
                                          );
                                        })}
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
    {allocPanel && (
      <CdeAllocFormPanel
        record={allocPanel.record}
        isEdit={allocPanel.isEdit}
        onSave={handleAllocSave}
        onClose={() => setAllocPanel(null)}
        data={data}
      />
    )}
    </>
  );
}

// ===============================================================================
// ALLOCATION FORM PANEL -- scoped to a known CDE (add or edit allocation)
// ===============================================================================
function CdeAllocFormPanel({ record, isEdit, onSave, onClose, data }) {
  const { nextPk } = useApp();
  const accent = TABLE_GROUPS.find(g => g.tables.includes('data_quality_rule_allocation'))?.accent || 'var(--accent)';

  const rules      = data?.data_quality_rule || [];
  const dimensions = data?.quality_dimension || [];
  const cdes       = data?.critical_data_element || [];
  const dataSets   = data?.critical_data_set || [];
  const allAllocs  = data?.data_quality_rule_allocation || [];

  const cdeById  = useMemo(() => Object.fromEntries(cdes.map(c  => [c.critical_data_element_id, c])), [cdes]);
  const cdsById  = useMemo(() => Object.fromEntries(dataSets.map(d => [d.critical_data_set_id, d])),  [dataSets]);
  const ruleById = useMemo(() => Object.fromEntries(rules.map(r  => [r.data_quality_rule_id, r])),    [rules]);

  const cde = cdeById[record.critical_data_element_id];
  const cds = cde ? cdsById[cde.critical_data_set_id] : null;

  const [values, setValues] = useState({
    data_quality_rule_allocation_id: record?.data_quality_rule_allocation_id ?? nextPk('data_quality_rule_allocation'),
    critical_data_element_id:        record.critical_data_element_id,
    data_quality_rule_id:            record?.data_quality_rule_id      ?? null,
    quality_dimension_id:            record?.quality_dimension_id      ?? null,
    bumper_value:                    record?.bumper_value               ?? null,
    frequency:                       record?.frequency                  ?? null,
    retiring_timestamp:              null,
  });
  const [errors,   setErrors]   = useState({});
  const [warnings, setWarnings] = useState({});

  const set = (field, value) => {
    setValues(prev => ({ ...prev, [field]: value }));
    setErrors(prev => ({ ...prev, [field]: null }));
    setWarnings(prev => ({ ...prev, [field]: null }));
  };

  // Show generic rules (no prefix, or "Generic - " prefix) plus rules whose prefix exactly
  // matches the current CDS name. Any other "OtherCDS - rule" is hidden.
  const ruleOpts = useMemo(() => {
    const base = [...rules].filter(r => !r.retiring_timestamp);
    const cdsName = cds?.data_set_name || '';
    if (!cdsName) return base.sort((a,b) => (a.rule_name||'').localeCompare(b.rule_name||''));
    return base
      .filter(r => {
        const name = r.rule_name || '';
        const sepIdx = name.indexOf(' - ');
        if (sepIdx === -1) return true;                                // no prefix: generic
        const prefix = name.slice(0, sepIdx);
        if (prefix.toLowerCase() === 'generic') return true;          // explicit generic prefix
        return prefix === cdsName;                                     // hide all other CDS rules
      })
      .sort((a,b) => (a.rule_name||'').localeCompare(b.rule_name||''));
  }, [rules, cds]);
  const dimOpts = useMemo(() =>
    [...dimensions].filter(d => !d.retiring_timestamp)
      .sort((a,b) => (a.dimension_name||'').localeCompare(b.dimension_name||'')), [dimensions]);

  const editRule = isEdit ? ruleById[values.data_quality_rule_id] : null;

  const checkDuplicate = (ruleId) => {
    if (isEdit || !ruleId) return false;
    return allAllocs.some(a =>
      a.critical_data_element_id === record.critical_data_element_id &&
      a.data_quality_rule_id === parseInt(ruleId) &&
      !a.retiring_timestamp
    );
  };

  useEffect(() => {
    if (checkDuplicate(values.data_quality_rule_id)) {
      setWarnings(prev => ({ ...prev, data_quality_rule_id: 'This rule is already allocated to this CDE.' }));
    } else {
      setWarnings(prev => ({ ...prev, data_quality_rule_id: null }));
    }
  }, [values.data_quality_rule_id]);

  const validate = () => {
    const errs = {};
    if (!values.data_quality_rule_id) errs.data_quality_rule_id = 'Required';
    if (!values.quality_dimension_id) errs.quality_dimension_id = 'Required';
    if (!values.frequency || !String(values.frequency).trim()) errs.frequency = 'Required';
    if (checkDuplicate(values.data_quality_rule_id)) errs.data_quality_rule_id = 'This rule is already allocated to this CDE.';
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const saved = { ...values };
    if (saved.bumper_value !== null && saved.bumper_value !== '') saved.bumper_value = parseFloat(saved.bumper_value);
    else saved.bumper_value = null;
    onSave(saved);
  };

  const inlineSql = useMemo(() => {
    const rule = ruleById[values.data_quality_rule_id];
    if (!cde || !rule || !cde.source_snapshot_filter) return null;
    return {
      rule:   composeSql(rule.sql_code,        cde, 'rule'),
      sample: rule.sql_code_sample ? composeSql(rule.sql_code_sample, cde, 'sample') : null,
    };
  }, [values.data_quality_rule_id, cde, ruleById]);

  const [copiedRule,   setCopiedRule]   = useState(false);
  const [copiedSample, setCopiedSample] = useState(false);
  const copyToClipboard = (text, setCopied) => {
    navigator.clipboard.writeText(normalizeWhitespace(text)).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 1800);
    });
  };

  const inputBase = {
    width:'100%', padding:'7px 10px', fontSize:13,
    background:'var(--bg3)', borderRadius:'var(--radius)',
    color:'var(--text)', fontFamily:'var(--sans)', outline:'none',
  };
  const borderFor = (field) => ({
    border: `1px solid ${errors[field] ? 'var(--red)' : warnings[field] ? 'var(--amber)' : 'var(--border)'}`,
  });

  return (
    <>
      <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:300, background:'var(--overlay-sm)' }}/>
      <div style={{
        position:'fixed', top:0, right:0, bottom:0, width:'min(520px, 58vw)',
        background:'var(--bg2)', borderLeft:'1px solid var(--border2)',
        zIndex:400, display:'flex', flexDirection:'column',
        boxShadow:'-4px 0 24px var(--overlay-md)', animation:'slideInRight 0.18s ease',
      }}>
        {/* Header */}
        <div style={{ padding:'14px 18px', borderBottom:'1px solid var(--border)',
          display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.08em',
              textTransform:'uppercase', color:accent, marginBottom:3 }}>
              {isEdit ? 'Edit allocation' : 'Add allocation'}
            </div>
            <div style={{ fontSize:13, fontWeight:500, color:'var(--text)',
              fontFamily:'var(--mono)' }}>
              {cde?.source_field_name || `CDE #${record.critical_data_element_id}`}
              {cds && <span style={{ color:'var(--text3)', fontWeight:400, marginLeft:6 }}>
                {cds.data_set_name}
              </span>}
            </div>
          </div>
          <button className="btn btn-primary" onClick={handleSave} style={{ padding:'6px 14px', fontSize:12 }}>
            <Icon.Check/> {isEdit ? 'Save' : 'Add'}
          </button>
          <button className="btn btn-ghost" style={{ padding:'6px 8px' }} onClick={onClose}>
            <Icon.X/>
          </button>
        </div>

        {/* Body */}
        <div style={{ flex:1, overflow:'auto', padding:'16px 18px' }}>

          {/* Rule */}
          <div style={{ marginBottom:14 }}>
            <label style={{ display:'block', fontSize:11, fontWeight:600,
              color: errors.data_quality_rule_id ? 'var(--red)' : 'var(--text2)', marginBottom:4 }}>
              Rule <span style={{ color:'var(--red)' }}>*</span>
            </label>
            {isEdit ? (
              <div style={{ padding:'7px 10px', background:'var(--bg3)',
                border:'1px solid var(--border)', borderRadius:'var(--radius)',
                fontSize:12, color:'var(--text)' }}>
                {editRule?.rule_name || `Rule #${values.data_quality_rule_id}`}
              </div>
            ) : (
              <>
                <select value={values.data_quality_rule_id ?? ''} style={{ ...inputBase, cursor:'pointer', ...borderFor('data_quality_rule_id') }}
                  onChange={e => set('data_quality_rule_id', e.target.value ? parseInt(e.target.value) : null)}>
                  <option value="">-- select rule --</option>
                  {ruleOpts.map(r => <option key={r.data_quality_rule_id} value={r.data_quality_rule_id}>{r.rule_name}</option>)}
                </select>
                {errors.data_quality_rule_id && (
                  <div style={{ fontSize:11, color:'var(--red)', marginTop:3, display:'flex', gap:4, alignItems:'center' }}>
                    <span style={{ width:12, height:12, flexShrink:0 }}><Icon.Warning/></span>
                    {errors.data_quality_rule_id}
                  </div>
                )}
                {!errors.data_quality_rule_id && warnings.data_quality_rule_id && (
                  <div style={{ fontSize:11, color:'var(--amber)', marginTop:3, display:'flex', gap:4, alignItems:'center' }}>
                    <span style={{ width:12, height:12, flexShrink:0 }}><Icon.Warning/></span>
                    {warnings.data_quality_rule_id}
                  </div>
                )}
                {!isEdit && cds && (() => {
                  const totalActive = rules.filter(r => !r.retiring_timestamp).length;
                  if (ruleOpts.length >= totalActive) return null;
                  return (
                    <div style={{ fontSize:11, color:'var(--text3)', marginTop:3 }}>
                      Showing {ruleOpts.length} of {totalActive} rules -- generic + {cds.data_set_name} rules only
                    </div>
                  );
                })()}
              </>
            )}
          </div>

          {/* Dimension */}
          <div style={{ marginBottom:14 }}>
            <label style={{ display:'block', fontSize:11, fontWeight:600,
              color: errors.quality_dimension_id ? 'var(--red)' : 'var(--text2)', marginBottom:4 }}>
              Quality Dimension <span style={{ color:'var(--red)' }}>*</span>
            </label>
            <select value={values.quality_dimension_id ?? ''} style={{ ...inputBase, cursor:'pointer', ...borderFor('quality_dimension_id') }}
              onChange={e => set('quality_dimension_id', e.target.value ? parseInt(e.target.value) : null)}>
              <option value="">-- select dimension --</option>
              {dimOpts.map(d => <option key={d.quality_dimension_id} value={d.quality_dimension_id}>{d.dimension_name}</option>)}
            </select>
            {errors.quality_dimension_id && (
              <div style={{ fontSize:11, color:'var(--red)', marginTop:3, display:'flex', gap:4, alignItems:'center' }}>
                <span style={{ width:12, height:12, flexShrink:0 }}><Icon.Warning/></span>
                {errors.quality_dimension_id}
              </div>
            )}
          </div>

          {/* Frequency */}
          <div style={{ marginBottom:14 }}>
            <label style={{ display:'block', fontSize:11, fontWeight:600,
              color: errors.frequency ? 'var(--red)' : 'var(--text2)', marginBottom:4 }}>
              Frequency <span style={{ color:'var(--red)' }}>*</span>
            </label>
            <select value={values.frequency ?? ''}
              onChange={e => set('frequency', e.target.value || null)}
              style={{ ...inputBase, cursor:'pointer', ...borderFor('frequency') }}>
              <option value="">-- select frequency --</option>
              {['DAILY','AD-HOC','WEEKLY','MONTHLY'].map(f => (
                <option key={f} value={f}>{f}</option>
              ))}
            </select>
            {errors.frequency && <div style={{ fontSize:11, color:'var(--red)', marginTop:2 }}>{errors.frequency}</div>}
          </div>

          {/* Bumper value */}
          <div style={{ marginBottom:14 }}>
            <label style={{ display:'block', fontSize:11, fontWeight:600,
              color:'var(--text2)', marginBottom:4 }}>
              Bumper value
              <span style={{ fontSize:10, color:'var(--text3)', fontWeight:400, marginLeft:6 }}>(optional)</span>
            </label>
            <select value={values.bumper_value ?? ''}
              onChange={e => set('bumper_value', e.target.value === '' ? null : parseInt(e.target.value, 10))}
              style={{ ...inputBase, cursor:'pointer',
                border: errors.bumper_value ? '1px solid var(--red)' : '1px solid var(--border)' }}>
              <option value="">-- none --</option>
              {[1,2,3,4,5].map(n => (
                <option key={n} value={n}>{n}</option>
              ))}
            </select>
          </div>

          {/* Inline SQL preview */}
          {inlineSql && (
            <div style={{ marginTop:6 }}>
              <div style={{ marginBottom:10 }}>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
                  <span style={{ fontSize:11, fontWeight:600, color:'var(--accent)',
                    letterSpacing:'0.06em', textTransform:'uppercase' }}>Rule SQL</span>
                  <button className="btn btn-ghost" style={{ fontSize:11, padding:'2px 8px' }}
                    onClick={() => copyToClipboard(inlineSql.rule, setCopiedRule)}>
                    {copiedRule ? <><Icon.Check/> Copied</> : <><Icon.Copy/> Copy</>}
                  </button>
                </div>
                <pre style={{ fontFamily:'var(--mono)', fontSize:11, lineHeight:1.6,
                  color:'var(--text)', background:'var(--bg)',
                  border:'1px solid var(--border)', borderRadius:'var(--radius)',
                  padding:'10px 12px', whiteSpace:'pre-wrap', wordBreak:'break-all',
                  margin:0, maxHeight:160, overflow:'auto' }}>
                  {inlineSql.rule}
                </pre>
              </div>
              {inlineSql.sample ? (
                <div>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
                    <span style={{ fontSize:11, fontWeight:600, color:'var(--text2)',
                      letterSpacing:'0.06em', textTransform:'uppercase' }}>Sample SQL</span>
                    <button className="btn btn-ghost" style={{ fontSize:11, padding:'2px 8px' }}
                      onClick={() => copyToClipboard(inlineSql.sample, setCopiedSample)}>
                      {copiedSample ? <><Icon.Check/> Copied</> : <><Icon.Copy/> Copy</>}
                    </button>
                  </div>
                  <pre style={{ fontFamily:'var(--mono)', fontSize:11, lineHeight:1.6,
                    color:'var(--text)', background:'var(--bg)',
                    border:'1px solid var(--border)', borderRadius:'var(--radius)',
                    padding:'10px 12px', whiteSpace:'pre-wrap', wordBreak:'break-all',
                    margin:0, maxHeight:120, overflow:'auto' }}>
                    {inlineSql.sample}
                  </pre>
                </div>
              ) : (
                <div style={{ fontSize:11, color:'var(--text3)', fontStyle:'italic' }}>
                  No sample SQL defined for this rule - engine uses default approach.
                </div>
              )}
            </div>
          )}
          {values.data_quality_rule_id && !cde?.source_snapshot_filter && (
            <div style={{ marginTop:10, padding:'8px 12px', background:'var(--bg3)',
              border:'1px solid var(--red)', borderRadius:'var(--radius)',
              fontSize:11, color:'var(--red)', display:'flex', gap:6, alignItems:'center' }}>
              <span style={{ width:13, height:13, flexShrink:0 }}><Icon.Warning/></span>
              Missing snapshot filter on this CDE - SQL cannot be composed.
            </div>
          )}
        </div>
      </div>
    </>
  );
}

// ===============================================================================
// RULES EXPLORER -- Rule -> Agency -> CDS -> Table -> CDE -> Allocation
// Depends on: CdeAllocFormPanel (141_view_cde_list.js), RuleFormPanel (166_form_panel_rule.js)
// ===============================================================================

function buildRuleHierarchy({ rules, allocs, cdes, cdss, dirs, agencies,
  profilingByKey, critsByCdeId, showRetired, scopeCdsIds }) {

  const cdeById    = Object.fromEntries(cdes.map(c => [c.critical_data_element_id, c]));
  const cdsById    = Object.fromEntries(cdss.map(d => [d.critical_data_set_id, d]));
  const dirById    = Object.fromEntries(dirs.map(d => [d.directorate_id, d]));
  const agencyById = Object.fromEntries(agencies.map(a => [a.executive_agency_id, a]));

  const allocsByRuleId = {};
  for (const a of allocs) {
    if (!showRetired && a.retiring_timestamp) continue;
    if (!allocsByRuleId[a.data_quality_rule_id]) allocsByRuleId[a.data_quality_rule_id] = [];
    allocsByRuleId[a.data_quality_rule_id].push(a);
  }

  const visibleRules = showRetired ? rules : rules.filter(r => !r.retiring_timestamp);

  return [...visibleRules]
    .sort((a, b) => (a.rule_name || '').localeCompare(b.rule_name || ''))
    .map(rule => {
      const ruleId     = rule.data_quality_rule_id;
      const ruleAllocs = allocsByRuleId[ruleId] || [];
      const agencyMap  = {};

      for (const alloc of ruleAllocs) {
        const cde = cdeById[alloc.critical_data_element_id];
        if (!cde) continue;
        const cds = cdsById[cde.critical_data_set_id];
        if (!cds) continue;
        if (scopeCdsIds && !scopeCdsIds.has(cde.critical_data_set_id)) continue;

        const dir    = dirById[cds.directorate_id];
        const agency = dir ? agencyById[dir.executive_agency_id] : null;
        const agKey  = String(agency ? agency.executive_agency_id : '__unknown__');
        const cdsKey = String(cds.critical_data_set_id);
        const tblKey = (cde.source_table_name || '') + '|||' + (cde.source_database_name || '');

        if (!agencyMap[agKey]) agencyMap[agKey] = { agency, cdsMap: {} };
        if (!agencyMap[agKey].cdsMap[cdsKey]) agencyMap[agKey].cdsMap[cdsKey] = { cds, tableMap: {} };
        if (!agencyMap[agKey].cdsMap[cdsKey].tableMap[tblKey])
          agencyMap[agKey].cdsMap[cdsKey].tableMap[tblKey] = {
            table: cde.source_table_name || '', db: cde.source_database_name || '', cdeList: [] };

        const profKey  = (cde.source_database_name || '') + '|||' + (cde.source_table_name || '') + '|||' + (cde.source_field_name || '');
        agencyMap[agKey].cdsMap[cdsKey].tableMap[tblKey].cdeList.push({
          cde, profiling: profilingByKey[profKey] || null,
          crits: critsByCdeId[cde.critical_data_element_id] || {},
          allocation: alloc,
        });
      }

      const agencyEntries = Object.entries(agencyMap)
        .sort(([,a],[,b]) => (a.agency ? (a.agency.agency_acronymn || 'ZZZ') : 'ZZZ')
          .localeCompare(b.agency ? (b.agency.agency_acronymn || 'ZZZ') : 'ZZZ'))
        .map(([agKey, { agency, cdsMap }]) => {
          const cdsEntries = Object.entries(cdsMap)
            .sort(([,a],[,b]) => (a.cds ? (a.cds.data_set_name || '') : '').localeCompare(b.cds ? (b.cds.data_set_name || '') : ''))
            .map(([cdsKey, { cds, tableMap }]) => {
              const tableEntries = Object.entries(tableMap)
                .sort(([a],[b]) => a.localeCompare(b))
                .map(([tblKey, { table, db, cdeList }]) => {
                  const sortedCdes = [...cdeList].sort((a,b) =>
                    (a.cde.source_field_name || '').localeCompare(b.cde.source_field_name || ''));
                  return { table, db, tblKey, isProfiled: sortedCdes.some(e => e.profiling), cdes: sortedCdes };
                });
              const cdeCount = tableEntries.reduce((s, t) => s + t.cdes.length, 0);
              return { cds, cdsKey, tables: tableEntries, tableCount: tableEntries.length, cdeCount, allocCount: cdeCount };
            });
          const cdeCount  = cdsEntries.reduce((s, c) => s + c.cdeCount, 0);
          const allocCount = cdsEntries.reduce((s, c) => s + c.allocCount, 0);
          return { agency, agKey, cdss: cdsEntries, cdsCount: cdsEntries.length, cdeCount, allocCount };
        });

      const agencyCount = agencyEntries.length;
      const cdeCount    = agencyEntries.reduce((s, a) => s + a.cdeCount, 0);
      const allocCount  = agencyEntries.reduce((s, a) => s + a.allocCount, 0);
      return { rule, agencies: agencyEntries, agencyCount, cdeCount, allocCount };
    });
}

          const levelId = crits[g.criticality_group_id];
          const level   = levelId ? critLevelsById[levelId] : null;
          return (
            <span key={g.criticality_group_id}

            flex:1, minWidth:120, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
            {dim ? dim.dimension_name : '--'}
          </span>
          <span style={{ fontSize:11, color:'var(--text2)', flexShrink:0, whiteSpace:'nowrap' }}>
            {allocation.frequency || '--'}
          </span>
          <div style={{ flexShrink:0 }}>
            {allocation.bumper_value !== null && allocation.bumper_value !== undefined
              ? <span style={{ fontSize:11, fontFamily:'var(--mono)', fontWeight:600,
                  color:'var(--amber)', background:'var(--amber-bg)', border:'1px solid var(--amber)',
                  borderRadius:3, padding:'1px 7px', whiteSpace:'nowrap' }}>

              onClick={e => { e.stopPropagation(); onOpenSql('rule', rule, allocation, cde); }}>
              <div style={{ width:13, height:13 }}><Icon.Code/></div>

            {hasSample

                  disabled={missingFlt}

                  borderRadius:3, padding:'1px 4px', whiteSpace:'nowrap' }}

                  onClick={e => { e.stopPropagation(); onEditAlloc(allocation); }}>

                <div style={{ width:11, height:11 }}><Icon.Eye/></div>
              </button>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

  const [search,      setSearch]      = useState('');
  const [showRetired, setShowRetired] = useState(false);
  const [myDataOnly,  setMyDataOnly]  = useState(() => loadMyDataPref('moj_dq_rulenav_scope_v1', isMaster));
  const [expanded,   setExpanded]   = useState({});
  const [rulePanel,  setRulePanel]  = useState(null);
  const [allocPanel, setAllocPanel] = useState(null);

  useEffect(() => { saveMyDataPref('moj_dq_rulenav_scope_v1', myDataOnly); }, [myDataOnly]);

  const myStewardCdsIds = useMemo(() => getMyStewardCdsIds(data, stewardIdentity), [data, stewardIdentity]);

  const critGroupsSorted = useMemo(() =>
    (data?.criticality_group || []).filter(g => !g.retiring_timestamp)
      .sort((a,b) => a.criticality_group_id - b.criticality_group_id),
  [data]);

  const critLevelsById = useMemo(() =>
    Object.fromEntries((data?.criticality_level || []).map(l => [l.criticality_level_id, l])),
  [data]);

  const critsByCdeId = useMemo(() => {
    const m = {};
    for (const c of (data?.cde_criticality || [])) {
      if (c.retiring_timestamp) continue;
      if (!m[c.critical_data_element_id]) m[c.critical_data_element_id] = {};
      m[c.critical_data_element_id][c.criticality_group_id] = c.criticality_level_id;
    }
    return m;
  }, [data]);

  const profilingByKey = useMemo(() => {
    const m = {};
    for (const p of (data?.field_profiling || [])) {
      if (!p.retiring_timestamp)
        m[(p.source_database_name || '') + '|||' + (p.source_table_name || '') + '|||' + (p.source_field_name || '')] = p;
    }
    return m;
  }, [data]);

  const dimensionsById = useMemo(() =>
    Object.fromEntries((data?.quality_dimension || []).map(d => [d.quality_dimension_id, d])),
  [data]);

  const cdsById    = useMemo(() => Object.fromEntries((data?.critical_data_set  || []).map(d => [d.critical_data_set_id,    d])), [data]);
  const dirById    = useMemo(() => Object.fromEntries((data?.directorate        || []).map(d => [d.directorate_id,          d])), [data]);
  const agencyById = useMemo(() => Object.fromEntries((data?.executive_agency   || []).map(a => [a.executive_agency_id,     a])), [data]);

  const scopeCdsIds = myDataOnly ? myStewardCdsIds : null;

  const hierarchy = useMemo(() => {
    if (!data) return [];
    return buildRuleHierarchy({
      rules:    data.data_quality_rule            || [],
      allocs:   data.data_quality_rule_allocation || [],
      cdes:     data.critical_data_element        || [],
      cdss:     data.critical_data_set            || [],
      dirs:     data.directorate                  || [],
      agencies: data.executive_agency             || [],
      profilingByKey, critsByCdeId, showRetired, scopeCdsIds,
    });
  }, [data, profilingByKey, critsByCdeId, showRetired, scopeCdsIds]);

  const filtered = useMemo(() => {
    if (!search.trim()) return hierarchy;
    const q = search.toLowerCase();
    return hierarchy.filter(ruleEntry => {
      const r = ruleEntry.rule;
      if ((r.rule_name        || '').toLowerCase().includes(q)) return true;
      if ((r.rule_explanation || '').toLowerCase().includes(q)) return true;
      for (const ag of ruleEntry.agencies) {
        if ((ag.agency ? (ag.agency.agency_acronymn || '') : '').toLowerCase().includes(q)) return true;
        if ((ag.agency ? (ag.agency.agency_name     || '') : '').toLowerCase().includes(q)) return true;
        for (const cds of ag.cdss) {
          if ((cds.cds ? (cds.cds.data_set_name || '') : '').toLowerCase().includes(q)) return true;
          for (const tbl of cds.tables) {
            if ((tbl.table || '').toLowerCase().includes(q)) return true;
            if ((tbl.db   || '').toLowerCase().includes(q)) return true;
            for (const ce of tbl.cdes) {
              if ((ce.cde.source_field_name || '').toLowerCase().includes(q)) return true;
            }
          }
        }
      }
      return false;
    });
  }, [hierarchy, search]);

  const allRules     = data?.data_quality_rule || [];
  const liveCount    = allRules.filter(r => !r.retiring_timestamp).length;
  const retiredCount = allRules.filter(r =>  r.retiring_timestamp).length;
  const totalAllocs  = filtered.reduce((s, r) => s + r.allocCount, 0);

  const toggleKey = (key) => setExpanded(prev => ({ ...prev, [key]: !prev[key] }));

  const handleAddRule  = () => setRulePanel({ record: {
    data_quality_rule_id: nextPk('data_quality_rule'),
    rule_name: null, rule_explanation: null,
    sql_code: null, sql_code_sample: null,
    source_code_link: null, automated: false, retiring_timestamp: null,
  }});
  const handleEditRule    = (rule) => setRulePanel({ record: { ...rule } });
  const handleRuleSave    = (saved) => { upsertRecord('data_quality_rule', saved); setRulePanel(null); };
  const handleRetireRule  = (rule) => { if (canEdit) retireRecord('data_quality_rule', rule.data_quality_rule_id); };
  const handleRestoreRule = (rule) => { if (canEdit) restoreRecord('data_quality_rule', rule.data_quality_rule_id); };

  const handleEditAlloc    = (alloc) => setAllocPanel({ record: { ...alloc }, isEdit: true });
  const handleAllocSave    = (saved) => { upsertRecord('data_quality_rule_allocation', saved); setAllocPanel(null); };
  const handleRetireAlloc  = (alloc) => { if (canEdit) retireRecord('data_quality_rule_allocation', alloc.data_quality_rule_allocation_id); };
  const handleRestoreAlloc = (alloc) => { if (canEdit) restoreRecord('data_quality_rule_allocation', alloc.data_quality_rule_allocation_id); };

  const handleOpenSql = useCallback((mode, rule, alloc, cde) => {
    const cds    = cdsById[cde.critical_data_set_id];
    const dir    = cds ? dirById[cds.directorate_id] : null;
    const agency = dir ? agencyById[dir.executive_agency_id] : null;
    const template = mode === 'sample' ? rule.sql_code_sample : rule.sql_code;
    const sql = composeSql(template, cde, mode);
    openSqlPanel({
      mode, sql,
      ruleName:       rule.rule_name,
      fieldName:      cde.source_field_name || '',
      cdsName:        cds ? (cds.data_set_name || '') : '',
      agencyAcronym:  agency ? (agency.agency_acronymn || '') : '',
      snapshotFilter: cde.source_snapshot_filter
        ? substituteCdeTokens(cde.source_snapshot_filter, cde) : null,
    });
  }, [cdsById, dirById, agencyById, openSqlPanel]);

  return (
    <>
    <div className="fade-in">
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div className="page-title" style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:22, borderRadius:2, background:accent, flexShrink:0 }}/>
            Rules Explorer
          </div>
          <div className="page-sub">
            {filtered.length} rule{filtered.length !== 1 ? 's' : ''} &middot; {totalAllocs} allocation{totalAllocs !== 1 ? 's' : ''}
            {retiredCount > 0 && (' - ' + retiredCount + ' retired')}
          </div>
        </div>
        <button className="btn btn-primary" style={{ marginTop:4 }}
          disabled={!canEdit}
          title={!canEdit ? 'Set your steward identity in Settings to make changes' : undefined}
          onClick={handleAddRule}>
          <Icon.Plus/> Add rule
        </button>
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
        <div style={{ flex:1, position:'relative' }}>
          <div style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)',
            color:'var(--text3)', width:14, height:14, pointerEvents:'none' }}>
            <Icon.Search/>
          </div>
          <input className="table-search" style={{ paddingLeft:32, paddingRight: search ? 28 : 10 }}
            placeholder="Search rules, agencies, data sets, tables, fields..."
            value={search} onChange={e => setSearch(e.target.value)}/>
          {search && (
            <button onClick={() => setSearch('')}
              style={{ position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
                background:'var(--text3)', border:'none', cursor:'pointer', padding:0,
                color:'var(--bg)', width:16, height:16, display:'flex',
                alignItems:'center', justifyContent:'center', borderRadius:'50%', flexShrink:0 }}
              title="Clear search">
              <svg width="8" height="8" viewBox="0 0 10 10" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/>
              </svg>
            </button>
          )}
        </div>
        <MyDataToggle
          active={myDataOnly}
          onToggle={function() { setMyDataOnly(function(v) { return !v; }); }}
          available={!!stewardIdentity}
          accent={accent}
        />
        {retiredCount > 0 && (
          <label style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer',
            whiteSpace:'nowrap', fontSize:12, color:'var(--text3)' }}>
            <div className="toggle" style={{ width:30, height:16 }}>
              <input type="checkbox" checked={showRetired}
                onChange={e => setShowRetired(e.target.checked)}/>
              <div className="toggle-track"/>
              <div className="toggle-thumb" style={{ width:10, height:10, top:3, left:3 }}/>
            </div>
            Show retired
          </label>
        )}
      </div>

      <div style={{ fontSize:11, color:'var(--text3)', marginBottom:10, fontFamily:'var(--mono)' }}>
        Showing {filtered.length} of {liveCount} rule{liveCount !== 1 ? 's' : ''}
        {search && (' matching "' + search + '"')}
      </div>

      {filtered.length === 0 ? (
        <div className="status-row status-info">No rules match the current filter.</div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {filtered.map(ruleEntry => (
            <RulesRuleRow
              key={ruleEntry.rule.data_quality_rule_id}
              ruleEntry={ruleEntry}
              critGroupsSorted={critGroupsSorted} critLevelsById={critLevelsById}
              dimensionsById={dimensionsById} expanded={expanded} onToggle={toggleKey}
              onEdit={handleEditRule} onRetire={handleRetireRule} onRestore={handleRestoreRule}
              onEditAlloc={handleEditAlloc} onRetireAlloc={handleRetireAlloc} onRestoreAlloc={handleRestoreAlloc}
              onOpenSql={handleOpenSql} canEdit={canEdit} accent={accent}
            />
          ))}
        </div>
      )}
    </div>

    {rulePanel && ReactDOM.createPortal(
      <RuleFormPanel
        record={rulePanel.record}
        onSave={handleRuleSave}
        onClose={() => setRulePanel(null)}
        data={data}
      />,
      document.body
    )}

    {allocPanel && ReactDOM.createPortal(
      <CdeAllocFormPanel
        record={allocPanel.record}
        isEdit={allocPanel.isEdit}
        onSave={handleAllocSave}
        onClose={() => setAllocPanel(null)}
        data={data}
      />,
      document.body
    )}
    </>
  );
}

// ===============================================================================
// CRITICAL DATA SET VIEW -- grouped by agency, sub-rows per data set
// ===============================================================================
function CriticalDataSetView() {
  const { data, retireRecord, restoreRecord, openForm, nextPk, canEdit } = useApp();
  const dp = !canEdit ? { style:{ opacity:0.35, cursor:'not-allowed', pointerEvents:'none' }, title:'Set your steward identity in Settings to make changes' } : {};

  const [search,      setSearch]      = useState('');
  const [showRetired, setShowRetired] = useState(false);

  const rows        = data?.critical_data_set || [];
  const directorates = data?.directorate || [];
  const agencies    = data?.executive_agency || [];
  const accent      = TABLE_GROUPS.find(g => g.tables.includes('critical_data_set'))?.accent || 'var(--accent)';

  const dirById = useMemo(() =>
    Object.fromEntries(directorates.map(d => [d.directorate_id, d])),
  [directorates]);

  const agencyById = useMemo(() =>
    Object.fromEntries(agencies.map(a => [a.executive_agency_id, a])),
  [agencies]);

  // openAdd optionally pre-sets the agency via filterAgencyId seed on the blank record
  const openAdd = (preAgencyId) => {
    const blank = buildBlankRecord('critical_data_set', nextPk, data);
    // Pass a __preAgencyId hint so RecordFormPanel can seed filterAgencyId
    openForm('critical_data_set', preAgencyId ? { ...blank, __preAgencyId: preAgencyId } : blank);
  };
  const openEdit = (row) => openForm('critical_data_set', { ...row });

  const liveCount    = rows.filter(r => !r.retiring_timestamp).length;
  const retiredCount = rows.filter(r =>  r.retiring_timestamp).length;

  // Group data sets by agency (via directorate), sort agency A->Z, sets A->Z within
  const grouped = useMemo(() => {
    const visible = showRetired ? rows : rows.filter(r => !r.retiring_timestamp);
    const map = {};
    for (const row of visible) {
      const dir = dirById[row.directorate_id];
      const aid = dir?.executive_agency_id ?? '__unknown__';
      if (!map[aid]) map[aid] = [];
      map[aid].push(row);
    }
    let entries = Object.entries(map).map(([aid, sets]) => {
      const agency = aid === '__unknown__' ? null : agencyById[parseInt(aid)];
      return {
        agencyId: aid,
        agency,
        sets: [...sets].sort((a, b) => (a.data_set_name || '').localeCompare(b.data_set_name || '')),
      };
    }).sort((a, b) =>
      (a.agency?.agency_acronymn || 'ZZZ').localeCompare(b.agency?.agency_acronymn || 'ZZZ')
    );

    if (search.trim()) {
      const q = search.toLowerCase();
      entries = entries
        .map(entry => ({
          ...entry,
          sets: entry.sets.filter(s =>
            (s.data_set_name        || '').toLowerCase().includes(q) ||
            (s.data_set_description || '').toLowerCase().includes(q) ||
            (dirById[s.directorate_id]?.directorate_name || '').toLowerCase().includes(q) ||
            (entry.agency?.agency_acronymn || '').toLowerCase().includes(q) ||
            (entry.agency?.agency_name     || '').toLowerCase().includes(q)
          ),
        }))
        .filter(entry => entry.sets.length > 0);
    }
    return entries;
  }, [rows, showRetired, search, dirById, agencyById]);

  const agencyCount = grouped.length;

  return (
    <div className="fade-in">
      {/* Page header */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div className="page-title" style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:22, borderRadius:2, background:accent, flexShrink:0 }}/>
            {SCHEMA.critical_data_set.label}
          </div>
          <div className="page-sub">
            {agencyCount} agenc{agencyCount !== 1 ? 'ies' : 'y'} - {liveCount} live records
            {retiredCount > 0 && ` - ${retiredCount} retired`}
          </div>
        </div>
        <button {...dp} className="btn btn-primary" style={{ marginTop:4 }} onClick={() => openAdd()}>
          <Icon.Plus/> Add record
        </button>
      </div>

      {/* Toolbar */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
        <div style={{ flex:1, position:'relative' }}>
          <div style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)',
            color:'var(--text3)', width:14, height:14, pointerEvents:'none' }}>
            <Icon.Search/>
          </div>
          <input className="table-search" style={{ paddingLeft:32 }}
            placeholder="Search by agency, directorate or data set name..."
            value={search} onChange={e => setSearch(e.target.value)}/>
        </div>
        {retiredCount > 0 && (
          <label style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer',
            whiteSpace:'nowrap', fontSize:12, color:'var(--text3)' }}>
            <div className="toggle" style={{ width:30, height:16 }}>
              <input type="checkbox" checked={showRetired}
                onChange={e => setShowRetired(e.target.checked)}/>
              <div className="toggle-track"/>
              <div className="toggle-thumb" style={{ width:10, height:10, top:3, left:3 }}/>
            </div>
            Show retired
          </label>
        )}
      </div>

      {grouped.length === 0 ? (
        <div className="status-row status-info">No records match the current filter.</div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {grouped.map(({ agencyId, agency, sets }) => (
            <div key={agencyId} style={{
              background: 'var(--bg2)',
              border: '1px solid var(--border)',
              borderLeft: `3px solid ${accent}`,
              borderRadius: 'var(--radius-lg)',
              padding: '12px 14px',
            }}>
              {/* Agency header */}
              <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:10 }}>
                <span style={{ fontSize:13, fontWeight:600, color:'var(--text)' }}>
                  {agency?.agency_acronymn || 'Unknown agency'}
                </span>
                {agency?.agency_name &&
                  <span style={{ fontSize:11, color:'var(--text3)' }}>{agency.agency_name}</span>
                }
                <span style={{ marginLeft:'auto', fontSize:11, color:'var(--text3)',
                  fontFamily:'var(--mono)' }}>
                  {sets.length} CDS{sets.length !== 1 ? 's' : ''}
                </span>
                {/* Per-agency Add button */}
                <button {...dp} className="btn btn-ghost" style={{ fontSize:11, padding:'2px 8px', marginLeft:6 }}
                  onClick={() => openAdd(agency?.executive_agency_id)}
                  title={`Add data set to ${agency?.agency_acronymn || 'this agency'}`}>
                  <Icon.Plus/>
                </button>
              </div>

              {/* Data set sub-rows */}
              <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
                {sets.map(ds => {
                  const pk        = ds.critical_data_set_id;
                  const isRetired = !!ds.retiring_timestamp;
                  const dir       = dirById[ds.directorate_id];
                  return (
                    <div key={pk} style={{
                      display:'flex', alignItems:'center', gap:10,
                      padding:'7px 10px',
                      background: 'var(--bg3)',
                      border: '1px solid var(--border)',
                      borderRadius: 'var(--radius)',
                      opacity: isRetired ? 0.5 : 1,
                    }}>
                      {/* Name + directorate */}
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:12, color:'var(--text)', fontWeight:500,
                          whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                          {ds.data_set_name || `Data Set #${pk}`}
                          {isRetired &&
                            <span style={{ marginLeft:6, fontSize:10, color:'var(--text3)',
                              fontWeight:400 }}>(retired)</span>
                          }
                        </div>
                        {dir &&
                          <div style={{ fontSize:11, color:'var(--text3)', marginTop:1 }}>
                            {dir.directorate_name}
                          </div>
                        }
                      </div>

                      {/* Actions */}
                      <div style={{ display:'flex', gap:4, flexShrink:0 }}>
                        {!isRetired && (
                          <button {...dp} className="btn btn-ghost" style={{ fontSize:10, padding:'2px 6px' }}
                            onClick={() => openEdit(ds)} title="Edit">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                          </button>
                        )}
                        {isRetired ? (
                          <button {...dp} className="btn btn-ghost" style={{ fontSize:10, padding:'2px 6px' }}
                            onClick={() => canEdit && restoreRecord('critical_data_set', pk)}>
                            <Icon.Eye/>
                          </button>
                        ) : (
                          <button {...dp} className="btn btn-ghost" style={{ fontSize:10, padding:'2px 6px' }}
                            onClick={() => canEdit && retireRecord('critical_data_set', pk)} title="Retire">
                            <Icon.EyeOff/>
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// DIRECTORATE VIEW -- grouped by agency, sub-rows per directorate
// ===============================================================================

function DirectorateView() {
  const { data, retireRecord, restoreRecord, openForm, nextPk, canEdit } = useApp();

  const agencies = data?.executive_agency || [];
  const accent  = TABLE_GROUPS.find(g => g.tables.includes('directorate'))?.accent || 'var(--accent)';

  const agencyById = useMemo(() =>
    Object.fromEntries(agencies.map(a => [a.executive_agency_id, a])),

  const openEdit           = (row) => openForm('directorate', { ...row });

    for (const row of visible) {
      const aid = row.executive_agency_id;
      if (!map[aid]) map[aid] = [];
      map[aid].push(row);
    }
    let entries = Object.entries(map).map(([aid, dirs]) => ({
      agencyId: parseInt(aid),
      agency:   agencyById[parseInt(aid)],
      dirs:     [...dirs].sort((a, b) => (a.directorate_name || '').localeCompare(b.directorate_name || '')),
    })).sort((a, b) =>
      (a.agency?.agency_acronymn || '').localeCompare(b.agency?.agency_acronymn || '')
    );

    if (search.trim()) {
      const q = search.toLowerCase();
      entries = entries
        .map(entry => ({
          ...entry,
          dirs: entry.dirs.filter(d =>
            (d.directorate_name     || '').toLowerCase().includes(q) ||
            (d.directorate_acronymn || '').toLowerCase().includes(q) ||
            (entry.agency?.agency_acronymn || '').toLowerCase().includes(q) ||
            (entry.agency?.agency_name     || '').toLowerCase().includes(q)
          ),
        }))
        .filter(entry => entry.dirs.length > 0);
    }
    return entries;
  }, [rows, showRetired, search, agencyById]);

  const agencyCount = grouped.length;

  return (
    <div className="fade-in">
      {/* Page header */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div className="page-title" style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:22, borderRadius:2, background:accent, flexShrink:0 }}/>
            {SCHEMA.directorate.label}
          </div>
          <div className="page-sub">
            {agencyCount} agenc{agencyCount !== 1 ? 'ies' : 'y'} - {liveCount} live records
            {retiredCount > 0 && ` - ${retiredCount} retired`}
          </div>
        </div>
        <button {...dp} className="btn btn-primary" style={{ marginTop:4 }} onClick={openAdd}>
          <Icon.Plus/> Add record
        </button>
      </div>

      {/* Toolbar */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
        <div style={{ flex:1, position:'relative' }}>
          <div style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)',
            color:'var(--text3)', width:14, height:14, pointerEvents:'none' }}>
            <Icon.Search/>
          </div>
          <input className="table-search" style={{ paddingLeft:32 }}
            placeholder="Search by agency or directorate..."
            value={search} onChange={e => setSearch(e.target.value)}/>
        </div>
        {retiredCount > 0 && (
          <label style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer',
            whiteSpace:'nowrap', fontSize:12, color:'var(--text3)' }}>
            <div className="toggle" style={{ width:30, height:16 }}>
              <input type="checkbox" checked={showRetired}

              {/* Directorate sub-rows */}
              <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
                {dirs.map(dir => {
                  const pk        = dir.directorate_id;

                    <div key={pk} style={{
                      display:'flex', alignItems:'center', gap:10,
                      padding:'6px 10px',

                      <span style={{

                        color: accent, background:'var(--bg)',

                            (retired)
                          </span>
                        }
                      </span>

                      {/* Actions */}
                      <div style={{ display:'flex', gap:4, flexShrink:0 }}>
                        {!isRetired && (
                          <button {...dp} className="btn btn-ghost" style={{ fontSize:10, padding:'2px 6px' }}

                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                          </button>
                        )}
                        {isRetired ? (
                          <button {...dp} className="btn btn-ghost" style={{ fontSize:10, padding:'2px 6px' }}
                            onClick={() => canEdit && restoreRecord('directorate', pk)}>
                            <Icon.Eye/>
                          </button>
                        ) : (
                          <button {...dp} className="btn btn-ghost" style={{ fontSize:10, padding:'2px 6px' }}
                            onClick={() => canEdit && retireRecord('directorate', pk)} title="Retire">
                            <Icon.EyeOff/>
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Build a blank record with sensible defaults for a given table

// Normalises a stored date-like value to YYYY-MM-DD for <input type="date">
function parseDateVal(v) {
  if (!v) return '';
  const s = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if (isNaN(d)) return '';
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0'),
  ].join('-');
}
