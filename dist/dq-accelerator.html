// ===============================================================================
// BLANK RECORD BUILDER -- utility used by the generic table view (161_view_generic)
// ===============================================================================
function buildBlankRecord(tableName, nextPkFn, data) {
  const schema = SCHEMA[tableName];
  const blank  = {};
  for (const col of schema.cols) {
    if (col.name === schema.pk)             { blank[col.name] = nextPkFn(tableName); continue; }
    if (col.name === 'retiring_timestamp')  { blank[col.name] = null; continue; }
    if (col.type === 'bool')                { blank[col.name] = false; continue; }
    blank[col.name] = null;
  }
  return blank;
}

// ===============================================================================
// GENERIC RECORD FORM PANEL
// Handles any table not routed to a specialised panel by 240_app.js.
// No cascade dropdowns, no custom validation -- purely schema-driven.
// ===============================================================================
function RecordFormPanel({ tableName, record, onSave, onClose, data }) {
  const schema   = SCHEMA[tableName];
  const group    = TABLE_GROUPS.find(g => g.tables.includes(tableName));
  const accent   = group?.accent || 'var(--accent)';
  const isEdit   = (data?.[tableName] || []).some(r => r[schema.pk] === record?.[schema.pk]);
  const editCols = schema.cols.filter(c => c.name !== schema.pk && c.name !== 'retiring_timestamp');

  const [values,   setValues]   = useState(() => ({ ...record }));
  const [errors,   setErrors]   = useState({});
  const [warnings, setWarnings] = useState({});

  const set = (field, val) => {
    setValues(prev => ({ ...prev, [field]: val }));
    setErrors(prev => ({ ...prev, [field]: null }));
  };

  const isRequired = (col) => {
    if (col.optional) return false;
    if (col.required) return true;
    return col.type === 'str' && !col.fk;
  };

  const validate = () => {
    const errs = {};
    for (const col of editCols) {
      if (!isRequired(col)) continue;
      const v = values[col.name];
      if (v === null || v === undefined || String(v).trim() === '') errs[col.name] = 'Required';
    }
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const saved = { ...values };
    for (const col of editCols) {
      const v = saved[col.name];
      if (col.type === 'int'   && v !== null) saved[col.name] = parseInt(v, 10) || null;
      if (col.type === 'float' && v !== null) saved[col.name] = parseFloat(v)   || null;
      if (col.type === 'bool')                saved[col.name] = !!v;
    }
    saved[schema.pk]            = values[schema.pk];
    saved['retiring_timestamp'] = null;
    onSave(saved);
  };

  const renderInput = (col) => {
    const v   = values[col.name];
    const err = errors[col.name];
    const ib  = {
      width:'100%', padding:'7px 10px', fontSize:13, background:'var(--bg3)',
      border:`1px solid ${err ? 'var(--red)' : warnings[col.name] ? 'var(--amber)' : 'var(--border)'}`,
      borderRadius:'var(--radius)', color:'var(--text)',
      fontFamily:'var(--sans)', outline:'none', transition:'border-color 0.15s',
    };

    if (col.fk) {
      // Agency FK: display acronym + name for readability
      if (col.fk.table === 'executive_agency') {
        const ags = (data?.executive_agency || [])
          .filter(a => !a.retiring_timestamp)
          .sort((a,b) => (a.agency_acronymn||'').localeCompare(b.agency_acronymn||''));
        return (
          <select value={v ?? ''} onChange={e => set(col.name, e.target.value === '' ? null : parseInt(e.target.value, 10))}
            style={{ ...ib, cursor:'pointer' }}>
            <option value="">-- select agency --</option>
            {ags.map(a => <option key={a.executive_agency_id} value={a.executive_agency_id}>{a.agency_acronymn} - {a.agency_name}</option>)}
          </select>
        );
      }
      const opts = getFkOptions(data, col.fk).sort((a,b) => (a.label||'').localeCompare(b.label||''));
      return (
        <select value={v ?? ''} onChange={e => set(col.name, e.target.value === '' ? null : parseInt(e.target.value, 10))}
          style={{ ...ib, cursor:'pointer' }}>
          <option value="">-- select --</option>
          {opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      );
    }

    if (col.type === 'bool') {
      return (
        <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
          <div className="toggle">
            <input type="checkbox" checked={!!v} onChange={e => set(col.name, e.target.checked)}/>
            <div className="toggle-track"/>
            <div className="toggle-thumb"/>
          </div>
          <span style={{ fontSize:13, color: v ? 'var(--text)' : 'var(--text3)' }}>{v ? 'Yes' : 'No'}</span>
        </label>
      );
    }

    if (col.type === 'text') {
      return (
        <textarea value={v ?? ''} rows={col.tall ? 8 : 3}
          onChange={e => set(col.name, e.target.value || null)}
          style={{ ...ib, resize:'vertical', lineHeight:1.5,
            fontFamily: col.tall ? 'var(--mono)' : 'var(--sans)', fontSize: col.tall ? 12 : 13 }}/>
      );
    }

    if (col.type === 'datetime') {
      return <input type="date" value={parseDateVal(v)} onChange={e => set(col.name, e.target.value || null)} style={ib}/>;
    }

    if (col.type === 'int' || col.type === 'float') {
      return (
        <input type="number" value={v ?? ''} step={col.type === 'float' ? '0.01' : '1'}
          onChange={e => set(col.name, e.target.value === '' ? null : e.target.value)}
          style={ib}/>
      );
    }

    return <input type="text" value={v ?? ''} onChange={e => set(col.name, e.target.value || null)} style={ib}/>;
  };

  return (
    <FormShell
      title={isEdit ? 'Edit ' + schema.label : 'Add ' + schema.label}
      subtitle={null}
      accent={accent}
      saveLabel={isEdit ? 'Save' : 'Add'}
      onSave={handleSave}
      onClose={onClose}>

      <div style={{ marginBottom:14, padding:'6px 10px',
        background:'var(--bg3)', border:'1px solid var(--border)',
        borderRadius:'var(--radius)', fontSize:11, color:'var(--text3)', fontFamily:'var(--mono)' }}>
        {schema.pk}: {values[schema.pk]} (auto-assigned)
      </div>

      {editCols.map(col => (
        <div key={col.name} style={{ marginBottom:12 }}>
          <label style={{ display:'block', fontSize:11, fontWeight:600,
            color: errors[col.name] ? 'var(--red)' : warnings[col.name] ? 'var(--amber)' : 'var(--text2)',
            marginBottom:4, letterSpacing:'0.03em' }}>
            {col.label}
            {isRequired(col) && <span style={{ color:'var(--red)', marginLeft:3 }}>*</span>}
          </label>
          {renderInput(col)}
          {errors[col.name] && (
            <div style={{ fontSize:11, color:'var(--red)', marginTop:3, display:'flex', alignItems:'flex-start', gap:4 }}>
              <span style={{ flexShrink:0, marginTop:1 }}><Icon.Warning/></span>
              {errors[col.name]}
            </div>
          )}
          {!errors[col.name] && warnings[col.name] && (
            <div style={{ fontSize:11, color:'var(--amber)', marginTop:3, display:'flex', alignItems:'flex-start', gap:4 }}>
              <span style={{ flexShrink:0, marginTop:1 }}><Icon.Warning/></span>
              {warnings[col.name]}
            </div>
          )}
        </div>
      ))}
    </FormShell>
  );
}

function getDisplayFields(tableName) {
  const overrides = {
    executive_agency:             ['agency_acronymn', 'agency_name'],
    executive_agency_type:        ['executive_agency_type_description'],
    directorate:                  ['directorate_name', 'directorate_acronymn'],
    critical_data_set:            ['data_set_name', 'directorate_id'],
    critical_data_element:        ['source_field_name', 'source_table_name', 'critical_data_set_id'],
    data_quality_rule:            ['rule_name', 'automated'],
    data_quality_rule_allocation: ['critical_data_element_id', 'data_quality_rule_id', 'quality_dimension_id'],
    cde_criticality:              ['critical_data_element_id', 'criticality_group_id', 'criticality_level_id'],
    stewardship:                  ['critical_data_set_id', 'data_steward_id'],
    data_patron:                  ['data_patron_name', 'executive_agency_id', 'data_patron_title'],
    data_owner:                   ['data_owner_name', 'data_owner_title'],
    data_steward:                 ['data_steward_name', 'steward_role_type_id', 'assignment_start_date'],
    quality_dimension:            ['dimension_name', 'dimension_acronymn'],
    criticality_group:            ['criticality_group_description', 'criticality_group_acronymn'],
    criticality_level:            ['criticality_description', 'criticality_score', 'overall_criticality_score'],
    criticality_group_weight:     ['executive_agency_id', 'criticality_group_id', 'weight_value'],
    quality_dimension_weight:     ['executive_agency_id', 'quality_dimension_id', 'weight_value'],
    steward_role_type:            ['role_description'],
  };
  return overrides[tableName] || SCHEMA[tableName].cols.slice(1, 3).map(c => c.name);
}

function resolveDisplayValue(tableName, fieldName, value, data) {
  if (value === null || value === undefined) return '--';
  const schema = SCHEMA[tableName];
  const col = schema.cols.find(c => c.name === fieldName);
  if (col?.fk && data) {
    const refRows = data[col.fk.table] || [];
    const refRow  = refRows.find(r => r[col.fk.field] === value);
    return refRow ? (refRow[col.fk.display] ?? String(value)) : `[${value}]`;
  }
  if (col?.type === 'bool') return value ? 'Yes' : 'No';
  return String(value);
}

function GenericTableView({ tableName }) {
  const { data, lookups, retireRecord, restoreRecord, upsertRecord, nextPk, openForm, canEdit } = useApp();
  const dp = !canEdit ? { style:{ opacity:0.35, cursor:'not-allowed', pointerEvents:'none' }, title:'Set your steward identity in Settings to make changes' } : {};

  const [search,        setSearch]        = useState('');
  const [showRetired,   setShowRetired]   = useState(false);
  const [confirmRetire, setConfirmRetire] = useState(null);

  const schema      = SCHEMA[tableName];
  const rows        = data?.[tableName] || [];
  const displayCols = getDisplayFields(tableName);
  const group       = TABLE_GROUPS.find(g => g.tables.includes(tableName));
  const accent      = group?.accent || 'var(--accent)';

  const openAdd  = () => openForm(tableName, buildBlankRecord(tableName, nextPk, data));
  const openEdit = (row) => openForm(tableName, { ...row });

  // Tables that should be sorted alphabetically, and which field to sort by
  const SORT_FIELD = {
    data_quality_rule:   'rule_name',
    criticality_level:   'criticality_description',
    criticality_group:   'criticality_group_description',
    quality_dimension:   'dimension_name',
    steward_role_type:   'role_description',
    data_steward:        'data_steward_name',
    data_owner:          'data_owner_name',
    data_patron:         'data_patron_name',
  };

  // Tables needing compound / resolved sorts
  const stewardshipMaps = useMemo(() => {
    if (tableName !== 'stewardship') return null;
    const cdsById    = Object.fromEntries((data?.critical_data_set || []).map(d => [d.critical_data_set_id, d]));
    const dirById    = Object.fromEntries((data?.directorate || []).map(d => [d.directorate_id, d]));
    const agencyById = Object.fromEntries((data?.executive_agency || []).map(a => [a.executive_agency_id, a]));
    return { cdsById, dirById, agencyById };
  }, [data, tableName]);

  const agencyById = useMemo(() => ({}), []);

  const SORT_FN = tableName === 'stewardship' && stewardshipMaps ? {
    stewardship: (a, b) => {
      const { cdsById, dirById, agencyById: abid } = stewardshipMaps;
      const cdsA = cdsById[a.critical_data_set_id];
      const cdsB = cdsById[b.critical_data_set_id];
      const dirA = dirById[cdsA?.directorate_id];
      const dirB = dirById[cdsB?.directorate_id];
      const agyA = abid[dirA?.executive_agency_id]?.agency_acronymn || '';
      const agyB = abid[dirB?.executive_agency_id]?.agency_acronymn || '';
      const agyCmp = agyA.localeCompare(agyB);
      if (agyCmp !== 0) return agyCmp;
      const dirCmp = (dirA?.directorate_name || '').localeCompare(dirB?.directorate_name || '');
      if (dirCmp !== 0) return dirCmp;
      return (cdsA?.data_set_name || '').localeCompare(cdsB?.data_set_name || '');
    }
  } : {};

  const filtered = useMemo(() => {
    let r = showRetired ? rows : rows.filter(row => !row.retiring_timestamp);
    if (search.trim()) {
      const q = search.toLowerCase();
      r = r.filter(row =>
        displayCols.some(f => {
          const v = resolveDisplayValue(tableName, f, row[f], data);
          return v.toLowerCase().includes(q);
        }) ||
        String(row[schema.pk]).includes(q)
      );
    }
    if (SORT_FN[tableName]) {
      r = [...r].sort(SORT_FN[tableName]);
    } else if (SORT_FIELD[tableName]) {
      const sf = SORT_FIELD[tableName];
      r = [...r].sort((a, b) => (a[sf] || '').localeCompare(b[sf] || ''));
    }
    return r;
  }, [rows, search, showRetired, displayCols, agencyById]);

  const liveCount    = rows.filter(r => !r.retiring_timestamp).length;
  const retiredCount = rows.filter(r =>  r.retiring_timestamp).length;

  const primaryField    = displayCols[0];
  const secondaryFields = displayCols.slice(1);

  return (
    <div className="fade-in">
      {/* Page header */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div className="page-title" style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:22, borderRadius:2, background:accent, flexShrink:0 }}/>
            {schema.label}
            {schema.readOnly &&
              <span className="badge badge-gray" style={{ fontSize:9, verticalAlign:'middle' }}>ref</span>
            }
          </div>
          <div className="page-sub">
            {liveCount} live record{liveCount !== 1 ? 's' : ''}
            {retiredCount > 0 && ` - ${retiredCount} retired`}
          </div>
        </div>
        {!schema.readOnly && canEdit && (
          <button {...dp} className="btn btn-primary" style={{ marginTop:4 }} onClick={openAdd}>
            <Icon.Plus/> Add record
          </button>
        )}
      </div>

      {/* Toolbar */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
        <div style={{ flex:1, position:'relative' }}>
          <div style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)',
            color:'var(--text3)', width:14, height:14, pointerEvents:'none' }}>
            <Icon.Search/>
          </div>
          <input className="table-search" style={{ paddingLeft:32 }}
            placeholder={`Search ${schema.label.toLowerCase()}...`}
            value={search} onChange={e => setSearch(e.target.value)}/>
        </div>

        {retiredCount > 0 && (
          <label style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer', whiteSpace:'nowrap', fontSize:12, color:'var(--text3)' }}>
            <div className="toggle" style={{ width:30, height:16 }}>
              <input type="checkbox" checked={showRetired} onChange={e => setShowRetired(e.target.checked)}/>
              <div className="toggle-track"/>
              <div className="toggle-thumb" style={{ width:10, height:10, top:3, left:3 }}/>
            </div>
            Show retired
          </label>
        )}
      </div>

      {/* Count line */}
      <div style={{ fontSize:11, color:'var(--text3)', marginBottom:10, fontFamily:'var(--mono)' }}>
        Showing {filtered.length} of {liveCount}{showRetired && retiredCount > 0 ? ` + ${retiredCount} retired` : ''} records
        {search && ` matching "${search}"`}
      </div>

      {/* Records */}
      {filtered.length === 0 ? (
        <div className="status-row status-info">No records match the current filter.</div>
      ) : (
        <div>
          {filtered.map(row => {
            const pk        = row[schema.pk];
            const isRetired = !!row.retiring_timestamp;

            // -- stewardship: three-line layout --------------
            if (tableName === 'stewardship') {
              const maps     = stewardshipMaps || {};
              const cds      = maps.cdsById?.[row.critical_data_set_id];
              const dir      = maps.dirById?.[cds?.directorate_id];
              const agency   = maps.agencyById?.[dir?.executive_agency_id];
              const steward  = (data?.data_steward || []).find(s => s.data_steward_id === row.data_steward_id);
              const role     = (data?.steward_role_type || []).find(r => r.steward_role_type_id === steward?.steward_role_type_id);
              return (
                <div key={pk}
                  className={`record-row ${isRetired ? 'record-retired' : ''}`}
                  style={{ borderLeftColor: isRetired ? 'var(--border)' : accent }}>
                  <div className="record-row-pk">#{pk}</div>
                  <div className="record-row-main">

// ===============================================================================
// CDS FORM PANEL -- Add / Edit Critical Data Set
// Agency->Directorate cascade with no-directorate warning.
// Accepts __preAgencyId transient field; strips it before save.
// New mode: steward dropdown pre-filled with current user; saved as __stewardId.
// Edit mode: shows existing steward assignments read-only.
// ===============================================================================
function CdsFormPanel({ record, onSave, onClose, data, stewardIdentity }) {
  const isEdit = (data?.critical_data_set || []).some(r => r.critical_data_set_id === record?.critical_data_set_id);
  const accent = 'var(--green)';

  const [filterAgencyId, setFilterAgencyId] = useState(() => {
    if (record?.__preAgencyId != null) return record.__preAgencyId;
    if (record?.directorate_id) {
      const dir = (data?.directorate || []).find(d => d.directorate_id === record.directorate_id);
      return dir?.executive_agency_id ?? null;
    }
    return null;
  });

  const [values, setValues] = useState(() => {
    const v = { ...record };
    delete v.__preAgencyId;
    return v;
  });
  const [errors,          setErrors]          = useState({});
  const [stewardId,       setStewardId]       = useState(() => stewardIdentity?.id ?? null);
  const [pendingRemoveIds, setPendingRemoveIds] = useState(() => new Set());
  const [pendingAddId,     setPendingAddId]     = useState(null);
  const [addDropdownVal,   setAddDropdownVal]   = useState(null);

  const set = (field, val) => {
    setValues(prev => ({ ...prev, [field]: val }));
    setErrors(prev => ({ ...prev, [field]: null }));
  };

  const agencies = useMemo(() =>
    (data?.executive_agency || [])
      .filter(a => !a.retiring_timestamp)
      .sort((a, b) => (a.agency_acronymn || '').localeCompare(b.agency_acronymn || '')),
    [data]);

  const filteredDirs = useMemo(() => {
    if (!filterAgencyId) return [];
    return (data?.directorate || [])
      .filter(d => !d.retiring_timestamp && d.executive_agency_id === filterAgencyId)
      .sort((a, b) => (a.directorate_name || '').localeCompare(b.directorate_name || ''));
  }, [data, filterAgencyId]);

  const allStewards = useMemo(() =>
    (data?.data_steward || [])
      .filter(s => !s.retiring_timestamp)
      .sort((a, b) => (a.data_steward_name || '').localeCompare(b.data_steward_name || '')),
    [data]);

  // Stewardship records for this CDS (edit mode)
  const existingStewardships = useMemo(() => {
    if (!isEdit) return [];
    return (data?.stewardship || [])
      .filter(s => !s.retiring_timestamp && s.critical_data_set_id === record?.critical_data_set_id);
  }, [data, isEdit, record]);

  // Active assignments after pending removals
  const effectiveStewardships = useMemo(() =>
    existingStewardships.filter(s => !pendingRemoveIds.has(s.stewardship_id)),
    [existingStewardships, pendingRemoveIds]);

  // Steward IDs effectively assigned (including pending add) - used to filter dropdown
  const assignedStewardIds = useMemo(() => {
    const ids = new Set(effectiveStewardships.map(s => s.data_steward_id));
    if (pendingAddId) ids.add(pendingAddId);
    return ids;
  }, [effectiveStewardships, pendingAddId]);

  // Stewards available to add
  const availableStewards = useMemo(() =>
    allStewards.filter(s => !assignedStewardIds.has(s.data_steward_id)),
    [allStewards, assignedStewardIds]);

  const noDirectorates = !!filterAgencyId && filteredDirs.length === 0;

  const validate = () => {
    const errs = {};
    if (!values.directorate_id)        errs.directorate_id = 'Required';
    if (!values.data_set_name?.trim()) errs.data_set_name  = 'Required';
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const saved = { ...values };
    delete saved.__preAgencyId;
    saved.retiring_timestamp = null;
    if (!isEdit && stewardId) saved.__stewardId = stewardId;
    if (isEdit) {
      saved.__removeStewardshipIds = [...pendingRemoveIds];
      saved.__addStewardId = pendingAddId;
    }
    onSave(saved);
  };

  const ibs = (err) => ({
    width: '100%', padding: '7px 10px', fontSize: 13, background: 'var(--bg3)',
    border: `1px solid ${err ? 'var(--red)' : 'var(--border)'}`,
    borderRadius: 'var(--radius)', color: 'var(--text)',
    fontFamily: 'var(--sans)', outline: 'none',
  });

  const ErrMsg = ({ msg }) => !msg ? null : (
    <div style={{ fontSize: 11, color: 'var(--red)', marginTop: 3, display: 'flex', alignItems: 'flex-start', gap: 4 }}>
      <span style={{ flexShrink: 0, marginTop: 1 }}><Icon.Warning/></span>
      {msg}
    </div>
  );

  const Lbl = ({ text, required, err }) => (
    <label style={{ display: 'block', fontSize: 11, fontWeight: 600,
      color: err ? 'var(--red)' : 'var(--text2)', marginBottom: 4, letterSpacing: '0.03em' }}>
      {text}{required && <span style={{ color: 'var(--red)', marginLeft: 3 }}>*</span>}
    </label>
  );

  return (
    <FormShell
      title={isEdit ? 'Edit CDS' : 'Add CDS'}
      subtitle="Critical Data Set"
      accent={accent}
      saveLabel={isEdit ? 'Save' : 'Add'}
      onSave={handleSave}
      onClose={onClose}>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Agency" required={false} err={false}/>
        <select value={filterAgencyId ?? ''} style={{ ...ibs(false), cursor: 'pointer' }}
          onChange={e => {
            const v = e.target.value === '' ? null : parseInt(e.target.value, 10);
            setFilterAgencyId(v);
            set('directorate_id', null);
          }}>
          <option value="">-- select agency --</option>
          {agencies.map(a => (
            <option key={a.executive_agency_id} value={a.executive_agency_id}>
              {a.agency_acronymn} - {a.agency_name}
            </option>
          ))}
        </select>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Directorate" required={true} err={!!errors.directorate_id}/>
        {noDirectorates ? (
          <div style={{ padding: '8px 10px', fontSize: 12, color: 'var(--amber)',
            background: 'rgba(245,166,35,0.08)', border: '1px solid rgba(245,166,35,0.3)',
            borderRadius: 'var(--radius)', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ flexShrink: 0 }}><Icon.Warning/></span>
            No directorates defined for this agency. Add a directorate first.
          </div>
        ) : (
          <select value={values.directorate_id ?? ''} style={{ ...ibs(!!errors.directorate_id), cursor: 'pointer' }}
            onChange={e => set('directorate_id', e.target.value === '' ? null : parseInt(e.target.value, 10))}>
            <option value="">-- select directorate --</option>
            {filteredDirs.map(d => <option key={d.directorate_id} value={d.directorate_id}>{d.directorate_name}</option>)}
          </select>
        )}
        <ErrMsg msg={errors.directorate_id}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Name" required={true} err={!!errors.data_set_name}/>
        <input type="text" value={values.data_set_name ?? ''} style={ibs(!!errors.data_set_name)}
          onChange={e => set('data_set_name', e.target.value || null)}/>
        <ErrMsg msg={errors.data_set_name}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Description" required={false} err={false}/>
        <textarea value={values.data_set_description ?? ''} rows={3}
          onChange={e => set('data_set_description', e.target.value || null)}
          style={{ ...ibs(false), resize: 'vertical', lineHeight: 1.5 }}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Subdivision" required={false} err={false}/>
        <input type="text" value={values.data_set_subdivision ?? ''}
          onChange={e => set('data_set_subdivision', e.target.value || null)}
          style={ibs(false)}/>
      </div>

      <div style={{ borderTop: '1px solid var(--border)', marginTop: 4, paddingTop: 14, marginBottom: 12 }}>
        <Lbl text={isEdit ? 'Stewards' : 'Steward'} required={false} err={false}/>
        {isEdit ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {effectiveStewardships.length === 0 && !pendingAddId && (
              <div style={{ fontSize: 12, color: 'var(--text3)', fontStyle: 'italic', padding: '2px 0 6px' }}>
                No stewards assigned
              </div>
            )}
            {effectiveStewardships.map(s => {
              const steward = (data?.data_steward || []).find(d => d.data_steward_id === s.data_steward_id);
              if (!steward) return null;
              return (
                <div key={s.stewardship_id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  fontSize: 12, color: 'var(--text)', padding: '6px 10px',
                  background: 'var(--bg3)', borderRadius: 'var(--radius)', border: '1px solid var(--border)' }}>
                  <span>
                    {steward.data_steward_name}
                    {steward.data_steward_title && (
                      <span style={{ fontSize: 11, color: 'var(--text3)', marginLeft: 6 }}>{steward.data_steward_title}</span>
                    )}
                  </span>
                  <button type="button" title="Remove steward"
                    onClick={() => setPendingRemoveIds(prev => { const n = new Set(prev); n.add(s.stewardship_id); return n; })}
                    style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text3)',
                      padding: '0 2px', lineHeight: 1, fontSize: 14, display: 'flex', alignItems: 'center' }}>
                    <Icon.X/>
                  </button>
                </div>
              );
            })}
            {pendingAddId && (() => {
              const steward = allStewards.find(s => s.data_steward_id === pendingAddId);
              return steward ? (
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  fontSize: 12, color: 'var(--green)', padding: '6px 10px',
                  background: 'rgba(34,201,142,0.08)', borderRadius: 'var(--radius)',
                  border: '1px solid rgba(34,201,142,0.35)' }}>
                  <span>
                    {steward.data_steward_name}
                    {steward.data_steward_title && (
                      <span style={{ fontSize: 11, color: 'var(--text3)', marginLeft: 6 }}>{steward.data_steward_title}</span>
                    )}
                    <span style={{ fontSize: 11, marginLeft: 8, opacity: 0.7 }}>(to be added)</span>
                  </span>
                  <button type="button" title="Cancel add"
                    onClick={() => { setPendingAddId(null); setAddDropdownVal(null); }}
                    style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text3)',
                      padding: '0 2px', lineHeight: 1, fontSize: 14, display: 'flex', alignItems: 'center' }}>
                    <Icon.X/>
                  </button>
                </div>
              ) : null;
            })()}
            {!pendingAddId && (
              <div style={{ display: 'flex', gap: 6, marginTop: 2 }}>
                <select value={addDropdownVal ?? ''} style={{ ...ibs(false), cursor: availableStewards.length ? 'pointer' : 'default', flex: 1 }}
                  disabled={availableStewards.length === 0}
                  onChange={e => setAddDropdownVal(e.target.value === '' ? null : parseInt(e.target.value, 10))}>
                  {availableStewards.length === 0
                    ? <option value="">-- all stewards assigned --</option>
                    : <>
                        <option value="">-- select steward to add --</option>
                        {availableStewards.map(s => (
                          <option key={s.data_steward_id} value={s.data_steward_id}>{s.data_steward_name}</option>
                        ))}
                      </>
                  }
                </select>
                <button type="button"
                  disabled={!addDropdownVal}
                  onClick={() => { if (addDropdownVal) { setPendingAddId(addDropdownVal); setAddDropdownVal(null); } }}
                  style={{ padding: '6px 14px', fontSize: 12, fontWeight: 600, border: 'none', borderRadius: 'var(--radius)',
                    cursor: addDropdownVal ? 'pointer' : 'not-allowed',
                    background: addDropdownVal ? accent : 'var(--bg3)',
                    color: addDropdownVal ? '#fff' : 'var(--text3)',
                    fontFamily: 'var(--sans)', whiteSpace: 'nowrap' }}>
                  Add
                </button>
              </div>
            )}
          </div>
        ) : (
          <select value={stewardId ?? ''} style={{ ...ibs(false), cursor: 'pointer' }}
            onChange={e => setStewardId(e.target.value === '' ? null : parseInt(e.target.value, 10))}>
            <option value="">-- none --</option>
            {allStewards.map(s => (
              <option key={s.data_steward_id} value={s.data_steward_id}>{s.data_steward_name}</option>
            ))}
          </select>
        )}
      </div>

    </FormShell>
  );
}

// ===============================================================================
// DATA OWNER FORM PANEL -- Add / Edit Data Owner
// Agency->Directorate cascade; directorate_id is saved, agency is a filter only.
// ===============================================================================
function DataOwnerFormPanel({ record, onSave, onClose, data }) {
  const isEdit = (data?.data_owner || []).some(r => r.data_owner_id === record?.data_owner_id);
  const accent = '#18b4d4';

  const [filterAgencyId, setFilterAgencyId] = useState(() => {
    if (record?.directorate_id) {
      const dir = (data?.directorate || []).find(d => d.directorate_id === record.directorate_id);
      return dir?.executive_agency_id ?? null;
    }
    return null;
  });

  const [values, setValues] = useState({ ...record });
  const [errors, setErrors] = useState({});

  const set = (field, val) => {
    setValues(prev => ({ ...prev, [field]: val }));
    setErrors(prev => ({ ...prev, [field]: null }));
  };

  const agencies = useMemo(() =>
    (data?.executive_agency || [])
      .filter(a => !a.retiring_timestamp)
      .sort((a, b) => (a.agency_acronymn || '').localeCompare(b.agency_acronymn || '')),
    [data]);

  const filteredDirs = useMemo(() => {
    if (!filterAgencyId) return [];
    return (data?.directorate || [])
      .filter(d => !d.retiring_timestamp && d.executive_agency_id === filterAgencyId)
      .sort((a, b) => (a.directorate_name || '').localeCompare(b.directorate_name || ''));
  }, [data, filterAgencyId]);

  const noDirectorates = !!filterAgencyId && filteredDirs.length === 0;

  const validate = () => {
    const errs = {};
    if (!values.directorate_id)              errs.directorate_id        = 'Required';
    if (!values.data_owner_name?.trim())     errs.data_owner_name       = 'Required';
    if (!values.data_owner_title?.trim())    errs.data_owner_title      = 'Required';
    if (!values.assignment_start_date)       errs.assignment_start_date = 'Required';
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const saved = { ...values, retiring_timestamp: null };
    onSave(saved);
  };

  const ibs = (err) => ({
    width: '100%', padding: '7px 10px', fontSize: 13, background: 'var(--bg3)',
    border: `1px solid ${err ? 'var(--red)' : 'var(--border)'}`,
    borderRadius: 'var(--radius)', color: 'var(--text)',
    fontFamily: 'var(--sans)', outline: 'none',
  });

  const ErrMsg = ({ msg }) => !msg ? null : (
    <div style={{ fontSize: 11, color: 'var(--red)', marginTop: 3, display: 'flex', alignItems: 'flex-start', gap: 4 }}>
      <span style={{ flexShrink: 0, marginTop: 1 }}><Icon.Warning/></span>
      {msg}
    </div>
  );

  const Lbl = ({ text, required, err }) => (
    <label style={{ display: 'block', fontSize: 11, fontWeight: 600,
      color: err ? 'var(--red)' : 'var(--text2)', marginBottom: 4, letterSpacing: '0.03em' }}>
      {text}{required && <span style={{ color: 'var(--red)', marginLeft: 3 }}>*</span>}
    </label>
  );

  return (
    <FormShell
      title={isEdit ? 'Edit Data Owner' : 'Add Data Owner'}
      subtitle="Data Owner"
      accent={accent}
      saveLabel={isEdit ? 'Save' : 'Add'}
      onSave={handleSave}
      onClose={onClose}>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Agency" required={false} err={false}/>
        <select value={filterAgencyId ?? ''} style={{ ...ibs(false), cursor: 'pointer' }}
          onChange={e => {
            const v = e.target.value === '' ? null : parseInt(e.target.value, 10);
            setFilterAgencyId(v);
            set('directorate_id', null);
          }}>
          <option value="">-- select agency --</option>
          {agencies.map(a => (
            <option key={a.executive_agency_id} value={a.executive_agency_id}>
              {a.agency_acronymn} - {a.agency_name}
            </option>
          ))}
        </select>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Directorate" required={true} err={!!errors.directorate_id}/>
        {noDirectorates ? (
          <div style={{ padding: '8px 10px', fontSize: 12, color: 'var(--amber)',
            background: 'rgba(245,166,35,0.08)', border: '1px solid rgba(245,166,35,0.3)',
            borderRadius: 'var(--radius)', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ flexShrink: 0 }}><Icon.Warning/></span>
            No directorates defined for this agency. Add a directorate first.
          </div>
        ) : (
          <select value={values.directorate_id ?? ''} style={{ ...ibs(!!errors.directorate_id), cursor: 'pointer' }}
            onChange={e => set('directorate_id', e.target.value === '' ? null : parseInt(e.target.value, 10))}>
            <option value="">-- select directorate --</option>
            {filteredDirs.map(d => <option key={d.directorate_id} value={d.directorate_id}>{d.directorate_name}</option>)}
          </select>
        )}
        <ErrMsg msg={errors.directorate_id}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Name" required={true} err={!!errors.data_owner_name}/>
        <input type="text" value={values.data_owner_name ?? ''} style={ibs(!!errors.data_owner_name)}
          onChange={e => set('data_owner_name', e.target.value || null)}/>
        <ErrMsg msg={errors.data_owner_name}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Title" required={true} err={!!errors.data_owner_title}/>
        <input type="text" value={values.data_owner_title ?? ''} style={ibs(!!errors.data_owner_title)}
          onChange={e => set('data_owner_title', e.target.value || null)}/>
        <ErrMsg msg={errors.data_owner_title}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Email" required={false} err={false}/>
        <input type="text" value={values.data_owner_email ?? ''} style={ibs(false)}
          onChange={e => set('data_owner_email', e.target.value || null)}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Start date" required={true} err={!!errors.assignment_start_date}/>
        <input type="date" value={parseDateVal(values.assignment_start_date)} style={ibs(!!errors.assignment_start_date)}
          onChange={e => set('assignment_start_date', e.target.value || null)}/>
        <ErrMsg msg={errors.assignment_start_date}/>
      </div>

    </FormShell>
  );
}

// ===============================================================================
// STEWARDSHIP FORM PANEL -- Add / Edit Stewardship
// 3-level cascade: Agency (filter) -> Directorate (filter) -> Data Set (saved).
// ===============================================================================
function StewardshipFormPanel({ record, onSave, onClose, data }) {
  const isEdit = (data?.stewardship || []).some(r => r.stewardship_id === record?.stewardship_id);
  const accent = 'var(--green)';

  // Derive initial filter state from existing CDS when editing
  const initCds = record?.critical_data_set_id
    ? (data?.critical_data_set || []).find(c => c.critical_data_set_id === record.critical_data_set_id)
    : null;
  const initDir = initCds?.directorate_id
    ? (data?.directorate || []).find(d => d.directorate_id === initCds.directorate_id)
    : null;

  const [filterAgencyId, setFilterAgencyId] = useState(() => initDir?.executive_agency_id ?? null);
  const [filterDirId,    setFilterDirId]    = useState(() => initCds?.directorate_id ?? null);

  const [values, setValues] = useState({ ...record });
  const [errors, setErrors] = useState({});

  const set = (field, val) => {
    setValues(prev => ({ ...prev, [field]: val }));
    setErrors(prev => ({ ...prev, [field]: null }));
  };

  const agencies = useMemo(() =>
    (data?.executive_agency || [])
      .filter(a => !a.retiring_timestamp)
      .sort((a, b) => (a.agency_acronymn || '').localeCompare(b.agency_acronymn || '')),
    [data]);

  const filteredDirs = useMemo(() => {
    if (!filterAgencyId) return [];
    return (data?.directorate || [])
      .filter(d => !d.retiring_timestamp && d.executive_agency_id === filterAgencyId)
      .sort((a, b) => (a.directorate_name || '').localeCompare(b.directorate_name || ''));
  }, [data, filterAgencyId]);

  const filteredCdSets = useMemo(() => {
    if (!filterDirId) return [];
    return (data?.critical_data_set || [])
      .filter(c => !c.retiring_timestamp && c.directorate_id === filterDirId)
      .sort((a, b) => (a.data_set_name || '').localeCompare(b.data_set_name || ''));
  }, [data, filterDirId]);

  const stewards = useMemo(() =>
    (data?.data_steward || [])
      .filter(s => !s.retiring_timestamp)
      .sort((a, b) => (a.data_steward_name || '').localeCompare(b.data_steward_name || '')),
    [data]);

  const validate = () => {
    const errs = {};
    if (!values.critical_data_set_id) errs.critical_data_set_id = 'Required';
    if (!values.data_steward_id)      errs.data_steward_id      = 'Required';
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const saved = { ...values, retiring_timestamp: null };
    onSave(saved);
  };

  const ibs = (err) => ({
    width: '100%', padding: '7px 10px', fontSize: 13, background: 'var(--bg3)',
    border: `1px solid ${err ? 'var(--red)' : 'var(--border)'}`,
    borderRadius: 'var(--radius)', color: 'var(--text)',
    fontFamily: 'var(--sans)', outline: 'none',
  });

  const ErrMsg = ({ msg }) => !msg ? null : (
    <div style={{ fontSize: 11, color: 'var(--red)', marginTop: 3, display: 'flex', alignItems: 'flex-start', gap: 4 }}>
      <span style={{ flexShrink: 0, marginTop: 1 }}><Icon.Warning/></span>
      {msg}
    </div>
  );

  const Lbl = ({ text, required, err }) => (
    <label style={{ display: 'block', fontSize: 11, fontWeight: 600,
      color: err ? 'var(--red)' : 'var(--text2)', marginBottom: 4, letterSpacing: '0.03em' }}>
      {text}{required && <span style={{ color: 'var(--red)', marginLeft: 3 }}>*</span>}
    </label>
  );

  return (
    <FormShell
      title={isEdit ? 'Edit Stewardship' : 'Add Stewardship'}
      subtitle="Stewardship"
      accent={accent}
      saveLabel={isEdit ? 'Save' : 'Add'}
      onSave={handleSave}
      onClose={onClose}>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Agency" required={false} err={false}/>
        <select value={filterAgencyId ?? ''} style={{ ...ibs(false), cursor: 'pointer' }}
          onChange={e => {
            const v = e.target.value === '' ? null : parseInt(e.target.value, 10);
            setFilterAgencyId(v);
            setFilterDirId(null);
            set('critical_data_set_id', null);
          }}>
          <option value="">-- select agency --</option>
          {agencies.map(a => (
            <option key={a.executive_agency_id} value={a.executive_agency_id}>
              {a.agency_acronymn} - {a.agency_name}
            </option>
          ))}
        </select>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Directorate" required={false} err={false}/>
        <select value={filterDirId ?? ''} style={{ ...ibs(false), cursor: 'pointer' }}
          disabled={!filterAgencyId}
          onChange={e => {
            const v = e.target.value === '' ? null : parseInt(e.target.value, 10);
            setFilterDirId(v);
            set('critical_data_set_id', null);
          }}>
          <option value="">-- select directorate --</option>
          {filteredDirs.map(d => <option key={d.directorate_id} value={d.directorate_id}>{d.directorate_name}</option>)}
        </select>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Data Set" required={true} err={!!errors.critical_data_set_id}/>
        <select value={values.critical_data_set_id ?? ''} style={{ ...ibs(!!errors.critical_data_set_id), cursor: 'pointer' }}
          disabled={!filterDirId}
          onChange={e => set('critical_data_set_id', e.target.value === '' ? null : parseInt(e.target.value, 10))}>
          <option value="">-- select data set --</option>
          {filteredCdSets.map(c => <option key={c.critical_data_set_id} value={c.critical_data_set_id}>{c.data_set_name}</option>)}
        </select>
        <ErrMsg msg={errors.critical_data_set_id}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Steward" required={true} err={!!errors.data_steward_id}/>
        <select value={values.data_steward_id ?? ''} style={{ ...ibs(!!errors.data_steward_id), cursor: 'pointer' }}
          onChange={e => set('data_steward_id', e.target.value === '' ? null : parseInt(e.target.value, 10))}>
          <option value="">-- select steward --</option>
          {stewards.map(s => <option key={s.data_steward_id} value={s.data_steward_id}>{s.data_steward_name}</option>)}
        </select>
        <ErrMsg msg={errors.data_steward_id}/>
      </div>

    </FormShell>
  );
}

// ===============================================================================
// WEIGHT FORM PANEL -- Add / Edit Criticality Group Weight or Quality Dimension Weight
// Shared panel for both tables. Filters group/dimension dropdown to unassigned only.
// ===============================================================================
function WeightFormPanel({ tableName, record, onSave, onClose, data }) {
  const schema        = SCHEMA[tableName];
  const isEdit        = (data?.[tableName] || []).some(r => r[schema.pk] === record?.[schema.pk]);
  const accent        = 'var(--amber)';
  const isCritGroup   = tableName === 'criticality_group_weight';
  const itemFkField   = isCritGroup ? 'criticality_group_id'          : 'quality_dimension_id';
  const itemIdField   = isCritGroup ? 'criticality_group_id'          : 'quality_dimension_id';
  const itemLabelField= isCritGroup ? 'criticality_group_description' : 'dimension_name';
  const panelTitle    = isCritGroup ? 'Criticality Group Weight'       : 'Quality Dimension Weight';
  const itemPlural    = isCritGroup ? 'group'                          : 'dimension';
  const itemLabel     = isCritGroup ? 'Criticality Group'              : 'Quality Dimension';

  const [values, setValues] = useState({ ...record });
  const [errors, setErrors] = useState({});

  const set = (field, val) => {
    setValues(prev => ({ ...prev, [field]: val }));
    setErrors(prev => ({ ...prev, [field]: null }));
  };

  const agencies = useMemo(() =>
    (data?.executive_agency || [])
      .filter(a => !a.retiring_timestamp)
      .sort((a, b) => (a.agency_acronymn || '').localeCompare(b.agency_acronymn || '')),
    [data]);

  const allItems = useMemo(() => {
    const src = isCritGroup ? (data?.criticality_group || []) : (data?.quality_dimension || []);
    return src.filter(i => !i.retiring_timestamp);
  }, [data, isCritGroup]);

  // IDs already assigned to the selected agency (active rows), excluding current record when editing
  const assignedIds = useMemo(() => {
    if (!values.executive_agency_id) return new Set();
    return new Set(
      (data?.[tableName] || [])
        .filter(w => !w.retiring_timestamp &&
          w.executive_agency_id === values.executive_agency_id &&
          w[schema.pk] !== record?.[schema.pk])
        .map(w => w[itemFkField])
    );
  }, [data, tableName, schema.pk, values.executive_agency_id, itemFkField, record]);

  const availableItems = useMemo(() =>
    allItems
      .filter(i => !assignedIds.has(i[itemIdField]))
      .sort((a, b) => (a[itemLabelField] || '').localeCompare(b[itemLabelField] || '')),
    [allItems, assignedIds, itemIdField, itemLabelField]);

  const validate = () => {
    const errs = {};
    if (!values.executive_agency_id) errs.executive_agency_id = 'Required';
    if (!values[itemFkField])        errs[itemFkField]        = 'Required';
    const w = parseFloat(values.weight_value);
    if (values.weight_value === null || values.weight_value === undefined ||
        String(values.weight_value).trim() === '') {
      errs.weight_value = 'Required';
    } else if (isNaN(w)) {
      errs.weight_value = 'Must be a number';
    }
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const saved = {
      ...values,
      executive_agency_id: parseInt(values.executive_agency_id, 10),
      [itemFkField]:        parseInt(values[itemFkField], 10),
      weight_value:         parseFloat(values.weight_value),
      retiring_timestamp:   null,
    };
    onSave(saved);
  };

  const ibs = (err) => ({
    width: '100%', padding: '7px 10px', fontSize: 13, background: 'var(--bg3)',
    border: `1px solid ${err ? 'var(--red)' : 'var(--border)'}`,
    borderRadius: 'var(--radius)', color: 'var(--text)',
    fontFamily: 'var(--sans)', outline: 'none',
  });

  const ErrMsg = ({ msg }) => !msg ? null : (
    <div style={{ fontSize: 11, color: 'var(--red)', marginTop: 3, display: 'flex', alignItems: 'flex-start', gap: 4 }}>
      <span style={{ flexShrink: 0, marginTop: 1 }}><Icon.Warning/></span>
      {msg}
    </div>
  );

  const Lbl = ({ text, required, err }) => (
    <label style={{ display: 'block', fontSize: 11, fontWeight: 600,
      color: err ? 'var(--red)' : 'var(--text2)', marginBottom: 4, letterSpacing: '0.03em' }}>
      {text}{required && <span style={{ color: 'var(--red)', marginLeft: 3 }}>*</span>}
    </label>
  );

  return (
    <FormShell
      title={isEdit ? ('Edit ' + panelTitle) : ('Add ' + panelTitle)}
      subtitle={panelTitle}
      accent={accent}
      saveLabel={isEdit ? 'Save' : 'Add'}
      onSave={handleSave}
      onClose={onClose}>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Agency" required={true} err={!!errors.executive_agency_id}/>
        <select value={values.executive_agency_id ?? ''} style={{ ...ibs(!!errors.executive_agency_id), cursor: 'pointer' }}
          onChange={e => {
            set('executive_agency_id', e.target.value === '' ? null : parseInt(e.target.value, 10));
            set(itemFkField, null);
          }}>
          <option value="">-- select agency --</option>
          {agencies.map(a => (
            <option key={a.executive_agency_id} value={a.executive_agency_id}>
              {a.agency_acronymn} - {a.agency_name}
            </option>
          ))}
        </select>
        <ErrMsg msg={errors.executive_agency_id}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text={itemLabel} required={true} err={!!errors[itemFkField]}/>
        <select value={values[itemFkField] ?? ''} style={{ ...ibs(!!errors[itemFkField]), cursor: 'pointer' }}
          disabled={!values.executive_agency_id}
          onChange={e => set(itemFkField, e.target.value === '' ? null : parseInt(e.target.value, 10))}>
          <option value="">{'-- select ' + itemPlural + ' --'}</option>
          {availableItems.map(i => (
            <option key={i[itemIdField]} value={i[itemIdField]}>{i[itemLabelField]}</option>
          ))}
        </select>
        <ErrMsg msg={errors[itemFkField]}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Weight" required={true} err={!!errors.weight_value}/>
        <input type="number" step="0.01" value={values.weight_value ?? ''} style={ibs(!!errors.weight_value)}
          onChange={e => set('weight_value', e.target.value === '' ? null : e.target.value)}/>
        <ErrMsg msg={errors.weight_value}/>
      </div>

    </FormShell>
  );
}

// ===============================================================================
// RULE FORM PANEL -- Add / Edit Data Quality Rule
// SQL validation: sql_code must contain a SELECT statement.
// ===============================================================================
function RuleFormPanel({ record, onSave, onClose, data }) {
  const isEdit = (data?.data_quality_rule || []).some(r => r.data_quality_rule_id === record?.data_quality_rule_id);
  const accent = 'var(--green)';

  const [values, setValues] = useState({ ...record });
  const [errors, setErrors] = useState({});

  const set = (field, val) => {
    setValues(prev => ({ ...prev, [field]: val }));
    setErrors(prev => ({ ...prev, [field]: null }));
  };

  const validate = () => {
    const errs = {};
    if (!values.rule_name?.trim()) {
      errs.rule_name = 'Required';
    }
    if (!values.sql_code?.trim()) {
      errs.sql_code = 'Required';
    } else if (!values.sql_code.toUpperCase().includes('SELECT')) {
      errs.sql_code = 'SQL must contain a SELECT statement';
    }
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }
    const saved = {
      ...values,
      automated: !!values.automated,
      retiring_timestamp: null,
    };
    onSave(saved);
  };

  const ibs = (err) => ({
    width: '100%', padding: '7px 10px', fontSize: 13, background: 'var(--bg3)',
    border: `1px solid ${err ? 'var(--red)' : 'var(--border)'}`,
    borderRadius: 'var(--radius)', color: 'var(--text)',
    fontFamily: 'var(--sans)', outline: 'none',
  });

  const ErrMsg = ({ msg }) => !msg ? null : (
    <div style={{ fontSize: 11, color: 'var(--red)', marginTop: 3, display: 'flex', alignItems: 'flex-start', gap: 4 }}>
      <span style={{ flexShrink: 0, marginTop: 1 }}><Icon.Warning/></span>
      {msg}
    </div>
  );

  const Lbl = ({ text, required, err }) => (
    <label style={{ display: 'block', fontSize: 11, fontWeight: 600,
      color: err ? 'var(--red)' : 'var(--text2)', marginBottom: 4, letterSpacing: '0.03em' }}>
      {text}{required && <span style={{ color: 'var(--red)', marginLeft: 3 }}>*</span>}
    </label>
  );

  return (
    <FormShell
      title={isEdit ? 'Edit Rule' : 'Add Rule'}
      subtitle="Data Quality Rule"
      accent={accent}
      saveLabel={isEdit ? 'Save' : 'Add'}
      onSave={handleSave}
      onClose={onClose}>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Name" required={true} err={!!errors.rule_name}/>
        <input type="text" value={values.rule_name ?? ''} style={ibs(!!errors.rule_name)}
          onChange={e => set('rule_name', e.target.value || null)}/>
        <ErrMsg msg={errors.rule_name}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Explanation" required={false} err={false}/>
        <textarea value={values.rule_explanation ?? ''} rows={3}
          onChange={e => set('rule_explanation', e.target.value || null)}
          style={{ ...ibs(false), resize: 'vertical', lineHeight: 1.5 }}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="SQL code" required={true} err={!!errors.sql_code}/>
        <textarea value={values.sql_code ?? ''} rows={8}
          onChange={e => set('sql_code', e.target.value || null)}
          style={{ ...ibs(!!errors.sql_code), resize: 'vertical', lineHeight: 1.5,
            fontFamily: 'var(--mono)', fontSize: 12 }}/>
        <ErrMsg msg={errors.sql_code}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="SQL sample" required={false} err={false}/>
        <textarea value={values.sql_code_sample ?? ''} rows={4}
          onChange={e => set('sql_code_sample', e.target.value || null)}
          style={{ ...ibs(false), resize: 'vertical', lineHeight: 1.5,
            fontFamily: 'var(--mono)', fontSize: 12 }}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Source link" required={false} err={false}/>
        <input type="text" value={values.source_code_link ?? ''} style={ibs(false)}
          onChange={e => set('source_code_link', e.target.value || null)}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Automated" required={false} err={false}/>
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
          <div className="toggle">
            <input type="checkbox" checked={!!values.automated}
              onChange={e => set('automated', e.target.checked)}/>
            <div className="toggle-track"/>
            <div className="toggle-thumb"/>
          </div>
          <span style={{ fontSize: 13, color: values.automated ? 'var(--text)' : 'var(--text3)' }}>
            {values.automated ? 'Yes' : 'No'}
          </span>
        </label>
      </div>

    </FormShell>
  );
}

// ===============================================================================
// AGENCY FORM PANEL -- Add / Edit Executive Agency with optional inline patron
// Patron section: toggle between creating a new patron or reactivating a retired one.
// ===============================================================================
function AgencyFormPanel({ record, onSave, onClose, data, stewardIdentity }) {
  const accent = '#18b4d4';
  const isEdit = (data?.executive_agency || []).some(
    r => r.executive_agency_id === record?.executive_agency_id
  );

  const todayIso = new Date().toISOString().slice(0, 10);

  // Agency fields
  const [agencyTypeId, setAgencyTypeId] = useState(record?.executive_agency_type_id ?? null);
  const [acronym,      setAcronym]      = useState(record?.agency_acronymn ?? '');
  const [agencyName,   setAgencyName]   = useState(record?.agency_name ?? '');

  // Patron section mode: 'none' | 'new' | 'existing'
  const [patronMode, setPatronMode] = useState('none');

  // Create-new patron fields
  const [patronName,      setPatronName]      = useState('');
  const [patronTitle,     setPatronTitle]     = useState('');
  const [patronEmail,     setPatronEmail]     = useState('');
  const [patronStartDate, setPatronStartDate] = useState(todayIso);

  // Select-existing patron fields
  const [selectedPatronId,   setSelectedPatronId]   = useState(null);
  const [reassignStartDate,  setReassignStartDate]  = useState(todayIso);

  // Patron IDs marked for removal (unlink from agency on save)
  const [removedPatronIds, setRemovedPatronIds] = useState([]);
  const removePatron = (id) => setRemovedPatronIds(prev => [...prev, id]);

  const [errors, setErrors] = useState({});

  const clearErr = (key) => setErrors(prev => ({ ...prev, [key]: null }));

  const agencyTypes = useMemo(() =>
    (data?.executive_agency_type || [])
      .filter(t => !t.retiring_timestamp)
      .sort((a, b) => (a.executive_agency_type_description || '').localeCompare(b.executive_agency_type_description || '')),
    [data]);

  // Active patrons already assigned to this agency (shown as read-only chips in edit mode)
  const existingPatrons = useMemo(() => {
    if (!isEdit) return [];
    return (data?.data_patron || [])
      .filter(p => !p.retiring_timestamp && p.executive_agency_id === record?.executive_agency_id)
      .sort((a, b) => (a.data_patron_name || '').localeCompare(b.data_patron_name || ''));
  }, [data, isEdit, record]);

  // Active patrons with no agency assignment yet -- available for selection
  const availablePatrons = useMemo(() =>
    (data?.data_patron || [])
      .filter(p => !p.retiring_timestamp && !p.executive_agency_id)
      .sort((a, b) => (a.data_patron_name || '').localeCompare(b.data_patron_name || '')),
    [data]);

  const validate = () => {
    const errs = {};
    if (!agencyTypeId) errs.agencyTypeId = 'Required';
    if (patronMode === 'new' && !patronName.trim()) errs.patronName = 'Name is required';
    if (patronMode === 'existing' && !selectedPatronId) errs.selectedPatronId = 'Select a patron';
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }

    const saved = {
      ...record,
      executive_agency_type_id: agencyTypeId,
      agency_acronymn:          acronym.trim()    || null,
      agency_name:              agencyName.trim() || null,
      retiring_timestamp:       null,
    };

    if (patronMode === 'new' && patronName.trim()) {
      saved.__newPatron = {
        name:      patronName.trim(),
        title:     patronTitle.trim()  || null,
        email:     patronEmail.trim()  || null,
        startDate: patronStartDate     || todayIso,
      };
    }

    if (patronMode === 'existing' && selectedPatronId) {
      const existingP = (data?.data_patron || []).find(p => p.data_patron_id === selectedPatronId);
      if (existingP) {
        saved.__reassignPatron = {
          ...existingP,
          executive_agency_id:   saved.executive_agency_id,
          retiring_timestamp:    null,
          assignment_start_date: reassignStartDate || todayIso,
        };
      }
    }

    if (removedPatronIds.length > 0) {
      saved.__removePatrons = existingPatrons
        .filter(p => removedPatronIds.includes(p.data_patron_id))
        .map(p => ({ ...p, executive_agency_id: null }));
    }

    onSave(saved);
  };

  const ibs = (err) => ({
    width: '100%', padding: '7px 10px', fontSize: 13, background: 'var(--bg3)',
    border: '1px solid ' + (err ? 'var(--red)' : 'var(--border)'),
    borderRadius: 'var(--radius)', color: 'var(--text)',
    fontFamily: 'var(--sans)', outline: 'none',
  });

  const Lbl = ({ text, required, err }) => (
    <label style={{ display: 'block', fontSize: 11, fontWeight: 600,
      color: err ? 'var(--red)' : 'var(--text2)', marginBottom: 4, letterSpacing: '0.03em' }}>
      {text}{required && <span style={{ color: 'var(--red)', marginLeft: 3 }}>*</span>}
    </label>
  );

  const ErrMsg = ({ msg }) => !msg ? null : (
    <div style={{ fontSize: 11, color: 'var(--red)', marginTop: 3, display: 'flex', alignItems: 'flex-start', gap: 4 }}>
      <span style={{ flexShrink: 0, marginTop: 1 }}><Icon.Warning/></span>
      {msg}
    </div>
  );

  const SectionLabel = ({ text }) => (
    <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase',
      color: accent, marginBottom: 10, marginTop: 4 }}>
      {text}
    </div>
  );

  const modeBtn = (mode, label) => (
    <button
      onClick={() => { setPatronMode(mode); setErrors({}); }}
      style={{
        flex: 1, padding: '5px 10px', fontSize: 12, cursor: 'pointer',
        background: patronMode === mode ? accent : 'var(--bg3)',
        color: patronMode === mode ? '#fff' : 'var(--text2)',
        border: '1px solid ' + (patronMode === mode ? accent : 'var(--border)'),
        borderRadius: 'var(--radius)', fontFamily: 'var(--sans)', fontWeight: 500,
      }}>
      {label}
    </button>
  );

  return (
    <FormShell
      title={isEdit ? 'Edit Agency' : 'Add Agency'}
      subtitle={null}
      accent={accent}
      saveLabel={isEdit ? 'Save' : 'Add'}
      onSave={handleSave}
      onClose={onClose}>

      <SectionLabel text="Agency"/>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Type" required={true} err={!!errors.agencyTypeId}/>
        <select value={agencyTypeId ?? ''} style={{ ...ibs(!!errors.agencyTypeId), cursor: 'pointer' }}
          onChange={e => {
            const v = e.target.value === '' ? null : parseInt(e.target.value, 10);
            setAgencyTypeId(v);
            clearErr('agencyTypeId');
          }}>
          <option value="">-- select type --</option>
          {agencyTypes.map(t => (
            <option key={t.executive_agency_type_id} value={t.executive_agency_type_id}>
              {t.executive_agency_type_description}
            </option>
          ))}
        </select>
        <ErrMsg msg={errors.agencyTypeId}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Acronym" required={false} err={false}/>
        <input type="text" value={acronym} style={ibs(false)}
          onChange={e => setAcronym(e.target.value)}/>
      </div>

      <div style={{ marginBottom: 12 }}>
        <Lbl text="Name" required={false} err={false}/>
        <input type="text" value={agencyName} style={ibs(false)}
          onChange={e => setAgencyName(e.target.value)}/>
      </div>

      {/* Patron section */}
      <div style={{ borderTop: '1px solid var(--border)', marginTop: 8, paddingTop: 16 }}>
        <SectionLabel text="Data Patron (optional)"/>

        {isEdit && existingPatrons.length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text2)',
              marginBottom: 6, letterSpacing: '0.03em' }}>
              Current patrons
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {existingPatrons
                .filter(p => !removedPatronIds.includes(p.data_patron_id))
                .map(p => (
                  <div key={p.data_patron_id} style={{
                    display: 'inline-flex', alignItems: 'center', gap: 5,
                    padding: '3px 6px 3px 10px', background: 'var(--bg)', fontSize: 11,
                    border: '1px solid var(--border2)', borderRadius: 20, color: 'var(--text2)',
                  }}>
                    <span style={{ fontWeight: 600 }}>{p.data_patron_name}</span>
                    {p.data_patron_title && (
                      <span style={{ color: 'var(--text3)' }}>{p.data_patron_title}</span>
                    )}
                    <button onClick={() => removePatron(p.data_patron_id)} style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      width: 16, height: 16, padding: 0, cursor: 'pointer',
                      background: 'transparent', border: 'none',
                      color: 'var(--text3)', borderRadius: '50%',
                      flexShrink: 0,
                    }}>
                      <Icon.X/>
                    </button>
                  </div>
                ))
              }
              {existingPatrons.every(p => removedPatronIds.includes(p.data_patron_id)) && (
                <div style={{ fontSize: 12, color: 'var(--text3)', fontStyle: 'italic' }}>None</div>
              )}
            </div>
          </div>
        )}

        {/* Mode toggle */}
        <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
          {modeBtn('none',     'Skip')}
          {modeBtn('new',      'Create new')}
          {modeBtn('existing', 'Select existing')}
        </div>

        {patronMode === 'new' && (
          <div style={{ background: 'var(--bg3)', border: '1px solid var(--border)',
            borderRadius: 'var(--radius)', padding: '12px 14px' }}>

            <div style={{ marginBottom: 12 }}>
              <Lbl text="Name" required={true} err={!!errors.patronName}/>
              <input type="text" value={patronName} style={ibs(!!errors.patronName)}
                onChange={e => { setPatronName(e.target.value); clearErr('patronName'); }}/>
              <ErrMsg msg={errors.patronName}/>
            </div>

            <div style={{ marginBottom: 12 }}>
              <Lbl text="Title" required={false} err={false}/>
              <input type="text" value={patronTitle} style={ibs(false)}
                onChange={e => setPatronTitle(e.target.value)}/>
            </div>

            <div style={{ marginBottom: 12 }}>
              <Lbl text="Email" required={false} err={false}/>
              <input type="text" value={patronEmail} style={ibs(false)}
                onChange={e => setPatronEmail(e.target.value)}/>
            </div>

            <div style={{ marginBottom: 4 }}>
              <Lbl text="Start date" required={false} err={false}/>
              <input type="date" value={parseDateVal(patronStartDate)} style={ibs(false)}
                onChange={e => setPatronStartDate(e.target.value || todayIso)}/>
            </div>

          </div>
        )}

        {patronMode === 'existing' && (
          <div style={{ background: 'var(--bg3)', border: '1px solid var(--border)',
            borderRadius: 'var(--radius)', padding: '12px 14px' }}>

            {availablePatrons.length === 0 ? (
              <div style={{ fontSize: 12, color: 'var(--text3)', fontStyle: 'italic', padding: '4px 0' }}>
                No active patrons available for assignment.
              </div>
            ) : (
              <>
                <div style={{ marginBottom: 12 }}>
                  <Lbl text="Patron" required={true} err={!!errors.selectedPatronId}/>
                  <select value={selectedPatronId ?? ''} style={{ ...ibs(!!errors.selectedPatronId), cursor: 'pointer' }}
                    onChange={e => {
                      const v = e.target.value === '' ? null : parseInt(e.target.value, 10);
                      setSelectedPatronId(v);
                      clearErr('selectedPatronId');
                    }}>
                    <option value="">-- select patron --</option>
                    {availablePatrons.map(p => (
                      <option key={p.data_patron_id} value={p.data_patron_id}>
                        {p.data_patron_name}
                        {p.data_patron_title ? ' - ' + p.data_patron_title : ''}
                      </option>
                    ))}
                  </select>
                  <ErrMsg msg={errors.selectedPatronId}/>
                </div>

                <div style={{ marginBottom: 4 }}>
                  <Lbl text="New start date" required={false} err={false}/>
                  <input type="date" value={parseDateVal(reassignStartDate)} style={ibs(false)}
                    onChange={e => setReassignStartDate(e.target.value || todayIso)}/>
                </div>
              </>
            )}

          </div>
        )}

      </div>

    </FormShell>
  );
}
