function DashboardScreen() {
  const { data, hasData, stewardIdentity, isMaster, navigate } = useApp();
  const [fkOpen, setFkOpen] = useState(false);

  const gaps = useMemo(
    () => (data && stewardIdentity) ? computeStewardGaps(data, stewardIdentity) : null,
    [data, stewardIdentity]
  );

  // No data loaded
  if (!hasData) {
    return (
      <div className="fade-in">
        <div className="page-title">Dashboard</div>
        <div className="page-sub">No data loaded. Use Import to load your data.</div>
      </div>
    );
  }

  // No steward identity set
  if (!stewardIdentity) {
    return (
      <div className="fade-in">
        <div className="page-title">Dashboard</div>
        <div style={{
          marginTop: 32, padding: '24px 28px', maxWidth: 520,
          background: 'var(--bg2)',
          border: '1px solid var(--amber)',
          borderLeft: '3px solid var(--amber)',
          borderRadius: 'var(--radius)',
        }}>
          <div style={{ fontWeight: 600, marginBottom: 6, color: 'var(--amber)', fontSize: 13 }}>
            No steward identity set
          </div>
          <div style={{ fontSize: 12, color: 'var(--text2)', lineHeight: 1.6 }}>
            This dashboard is personalised to your steward account.
            Open <strong>Settings</strong> (top-right) to identify yourself.
          </div>
        </div>
      </div>
    );
  }

  // Steward display name
  const stewardRec  = (data.data_steward || []).find(s => s.data_steward_id === stewardIdentity.id);
  const stewardName = stewardRec ? stewardRec.data_steward_name : ('Steward #' + stewardIdentity.id);

  // Agency acronym display
  const agencyById  = {};
  (data.executive_agency || []).forEach(a => { agencyById[a.executive_agency_id] = a; });
  const dirById = {};
  (data.directorate || []).forEach(d => { dirById[d.directorate_id] = d; });
  const agencyNames = Array.from(gaps.myAgencyIds)
    .map(id => agencyById[id] ? agencyById[id].agency_acronymn : String(id))
    .join(', ');

  const hasPersonalCds = gaps.myCdsIds.size > 0;

  const cards = [
    { count: gaps.unownedCds.length,      label: 'Unowned CDS',         description: 'CDS in your agency not yet assigned to any steward.',                        screen: 'table',   table: 'critical_data_element' },
    { count: gaps.emptyCds.length,        label: 'Empty CDS',            description: 'Your CDS with no Critical Data Elements defined yet.',                      screen: 'table',   table: 'critical_data_element' },
    { count: gaps.unprotectedCds.length,  label: 'Unprotected CDS',      description: 'Your CDS that have CDEs but no rules allocated to any of them.',            screen: 'rulenav', table: null },
    { count: gaps.unprotectedCdes.length, label: 'Unprotected CDEs',       description: 'Individual CDEs with no rule allocations \u2014 not validated.',              screen: 'rulenav', table: null },
    { count: gaps.unprofiledCdes.length,  label: 'Unprofiled CDEs',        description: 'CDEs with no matching field profiling record.',                               screen: 'table',   table: 'source_table_ddl' },
    { count: gaps.unratedCdes.length,     label: 'Unrated CDEs',           description: 'CDEs with no criticality assessment. Invisible to the RAG Simulator.',        screen: 'table',   table: 'critical_data_element' },
    { count: gaps.incompleteCdes.length,  label: 'Incomplete Definitions',  description: 'CDEs missing a definition or explanation.',                                   screen: 'table',   table: 'critical_data_element' },
    { count: gaps.uncoveredDims.length,   label: 'Uncovered Dimensions',   description: 'Quality dimensions with zero rule coverage across all your CDEs.',             screen: 'rulenav', table: null },
    {
      count: gaps.undocumentedCds.length,
      label: 'Undocumented CDS',
      description: 'The description field is empty for your CDS. All sets should have a clear definition.',
      items: gaps.undocumentedCds.map(function(cds) {
        var dir    = dirById[cds.directorate_id];
        var agency = dir ? agencyById[dir.executive_agency_id] : null;
        return {
          label:      cds.data_set_name || ('CDS #' + cds.critical_data_set_id),
          sublabel:   agency ? agency.agency_acronymn : null,
          navigateTo: { screen: 'table', table: 'critical_data_element', initialSearch: cds.data_set_name || '' },
        };
      }),
    },
  ];

  const allClear = hasPersonalCds &&
    cards.every(c => c.count === 0) &&
    gaps.scopedIssues.length === 0;

  return (
    <div className="fade-in">
      <div className="page-title">Dashboard</div>

      {/* Identity bar */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '11px 16px', marginBottom: 20,
        background: 'var(--bg2)',
        border: '1px solid var(--border)',
        borderLeft: '3px solid var(--green)',
        borderRadius: 'var(--radius)',
      }}>
        <div style={{ fontWeight: 600, fontSize: 14, color: 'var(--text)' }}>{stewardName}</div>
        {isMaster && (
          <span style={{
            fontSize: 10, padding: '2px 7px', borderRadius: 10, fontWeight: 700,
            background: 'var(--amber)', color: '#fff', letterSpacing: '0.04em',
          }}>MASTER</span>
        )}
        <div style={{ fontSize: 12, color: 'var(--text3)' }}>
          {gaps.myCdsIds.size} CDS{gaps.myCdsIds.size !== 1 ? 'es' : ''}
          {agencyNames ? ' \u00b7 ' + agencyNames : ''}
        </div>
      </div>

      {/* Empty state: no personal CDS assignments */}
      {!hasPersonalCds && (
        <div style={{
          padding: '18px 22px',
          background: 'var(--bg2)',
          border: '1px solid var(--border)',
          borderRadius: 'var(--radius)',
          fontSize: 13, color: 'var(--text2)', lineHeight: 1.6,
        }}>
          {isMaster
            ? 'You have no personal CDS assignments. Use the Quality Reporting page (coming soon) to view org-wide data quality status.'
            : 'You have no CDS assignments yet. Contact your master steward to have CDS assigned to you.'
          }
        </div>
      )}

      {hasPersonalCds && (
        <div>

          {/* All clear banner OR action cards */}
          {allClear ? (
            <div style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '14px 18px', marginBottom: 20,
              background: 'var(--green-bg)',
              border: '1px solid var(--green)',
              borderRadius: 'var(--radius)',
            }}>
              <span style={{ fontSize: 16, color: 'var(--green)', fontWeight: 700 }} >&#x2713;< /span>
              <div>
                <div style={{ fontWeight: 600, color: 'var(--green)', fontSize: 13 }}>All clear</div>
                <div style={{ fontSize: 12, color: 'var(--text2)' }}>No gaps found in your portfolio.</div>
              </div>
            </div>
          ) : (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginBottom: 24 }}>
              {cards.map(function(c, i) {
                return c.items
                  ? <ExpandableActionCard key={i} count={c.count} label={c.label} description={c.description} items={c.items} onNavigate={navigate}/>
                  : <ActionCard key={i} count={c.count} label={c.label} description={c.description} screen={c.screen} table={c.table} onNavigate={navigate}/>;
              })}
            </div>
          )}

          {/* Coverage by quality dimension */}
          {gaps.myCdeIds.size > 0 && gaps.dimensionCoverage.length > 0 && (
            <div style={{ marginBottom: 24 }}>
              <div className="section-label">Rule coverage by quality dimension</div>
              <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 10, marginTop: -4 }}>
                Partial coverage is expected as not every CDE requires every dimension.
                Zero coverage flags a dimension entirely absent from your portfolio.
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
                {gaps.dimensionCoverage.map(function(item) {
                  var dim = item.dim;
                  var coveredCount = item.coveredCount;
                  var totalCdes = item.totalCdes;
                  var pct      = totalCdes > 0 ? Math.round(coveredCount / totalCdes * 100) : 0;
                  var isZero   = coveredCount === 0;
                  var isFull   = coveredCount === totalCdes && totalCdes > 0;
                  var barColor = isZero ? 'var(--amber)' : isFull ? 'var(--green)' : 'var(--accent)';
                  return (
                    <div key={dim.quality_dimension_id} style={{
                      display: 'flex', alignItems: 'center', gap: 10,
                      padding: '7px 12px',
                      background: 'var(--bg2)',
                      border: '1px solid ' + (isZero ? 'var(--amber)' : 'var(--border)'),
                      borderLeft: '3px solid ' + barColor,
                      borderRadius: 'var(--radius)',
                    }}>
                      <div style={{
                        width: 150, fontSize: 12, flexShrink: 0,
                        fontWeight: isZero ? 600 : 400,
                        color: isZero ? 'var(--amber)' : 'var(--text)',
                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                      }}>
                        {dim.dimension_name}
                      </div>
                      <div style={{
                        flex: 1, height: 6, background: 'var(--bg3)',
                        borderRadius: 3, overflow: 'hidden',
                      }}>
                        <div style={{
                          width: pct + '%', height: '100%',
                          background: barColor, borderRadius: 3,
                        }}/>
                      </div>
                      <div style={{
                        fontSize: 11, flexShrink: 0, width: 85, textAlign: 'right',
                        color: isZero ? 'var(--amber)' : 'var(--text3)',
                      }}>
                        {coveredCount} / {totalCdes} CDEs
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* My CDSes summary table */}
          <div style={{ marginBottom: 24 }}>
            <div className="section-label">My CDS</div>
            <div style={{
              border: '1px solid var(--border)',
              borderRadius: 'var(--radius)',
              overflow: 'hidden',
            }}>
              <div style={{
                display: 'grid',
                gridTemplateColumns: '1fr 56px 56px 80px 80px',
                padding: '7px 14px',
                background: 'var(--bg3)',
                borderBottom: '1px solid var(--border)',
                fontSize: 11, fontWeight: 600, color: 'var(--text3)',
              }}>
                <div>Critical Data Set</div>
                <div style={{ textAlign: 'center' }}>CDEs</div>
                <div style={{ textAlign: 'center' }}>Rules</div>
                <div style={{ textAlign: 'center' }}>Rated</div>
                <div style={{ textAlign: 'center' }}>Profiled</div>
              </div>
              {gaps.myCdsSummary.map(function(row, i) {
                var cds = row.cds;
                var cdeCount = row.cdeCount;
                var ruleCount = row.ruleCount;
                var ratedCount = row.ratedCount;
                var profiledCount = row.profiledCount;
                var hasGap = cdeCount === 0 || (cdeCount > 0 && (ruleCount === 0 || ratedCount < cdeCount || profiledCount < cdeCount));
                var rowBorder = hasGap ? 'var(--amber)' : 'var(--green)';
                return (
                  <div key={cds.critical_data_set_id}
                    onClick={() => navigate({ screen: 'table', table: 'critical_data_element' })}
                    style={{
                      display: 'grid',
                      gridTemplateColumns: '1fr 56px 56px 80px 80px',
                      padding: '9px 14px',
                      borderLeft: '3px solid ' + rowBorder,
                      borderBottom: i < gaps.myCdsSummary.length - 1 ? '1px solid var(--border)' : 'none',
                      background: 'var(--bg2)',
                      cursor: 'pointer',
                      fontSize: 12,
                    }}>
                    <div style={{
                      color: 'var(--text)', fontWeight: 500,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                    }}>
                      {cds.data_set_name}
                    </div>
                    <div style={{ textAlign: 'center', color: cdeCount === 0 ? 'var(--amber)' : 'var(--text2)' }}>
                      {cdeCount}
                    </div>
                    <div style={{ textAlign: 'center', color: cdeCount > 0 && ruleCount === 0 ? 'var(--amber)' : 'var(--text2)' }}>
                      {ruleCount}
                    </div>
                    <div style={{ textAlign: 'center', color: cdeCount > 0 && ratedCount < cdeCount ? 'var(--amber)' : 'var(--text2)' }}>
                      {cdeCount > 0 ? ratedCount + ' / ' + cdeCount : '\u2014'}
                    </div>
                    <div style={{ textAlign: 'center', color: cdeCount > 0 && profiledCount < cdeCount ? 'var(--amber)' : 'var(--text2)' }}>
                      {cdeCount > 0 ? profiledCount + ' / ' + cdeCount : '\u2014'}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Data integrity -- collapsible, scoped to steward's data */}
          <div style={{ marginBottom: 24 }}>
            <div
              onClick={() => setFkOpen(function(o) { return !o; })}
              style={{
                display: 'flex', alignItems: 'center', gap: 8,
                padding: '10px 14px', cursor: 'pointer',
                background: 'var(--bg2)',
                border: '1px solid ' + (gaps.scopedIssues.length ? 'var(--amber)' : 'var(--border)'),
                borderLeft: '3px solid ' + (gaps.scopedIssues.length ? 'var(--amber)' : 'var(--border)'),
                borderRadius: fkOpen ? 'var(--radius) var(--radius) 0 0' : 'var(--radius)',
              }}
            >
              <span style={{
                fontWeight: 600, fontSize: 12,
                color: gaps.scopedIssues.length ? 'var(--amber)' : 'var(--text3)',
              }}>
                Data integrity
              </span>
              <span style={{
                fontSize: 11, padding: '1px 7px', borderRadius: 10,
                background: gaps.scopedIssues.length ? 'var(--amber-bg)' : 'var(--bg3)',
                color: gaps.scopedIssues.length ? 'var(--amber)' : 'var(--text3)',
                border: '1px solid ' + (gaps.scopedIssues.length ? 'var(--amber)' : 'var(--border)'),
              }}>
                {gaps.scopedIssues.length} issue{gaps.scopedIssues.length !== 1 ? 's' : ''}
              </span>
              <span style={{ marginLeft: 'auto', color: 'var(--text3)', fontSize: 12 }}>
                {fkOpen ? '\u25be' : '\u25b8'}
              </span>
            </div>
            {fkOpen && (
              <div style={{
                border: '1px solid var(--border)',
                borderTop: 'none',
                borderRadius: '0 0 var(--radius) var(--radius)',
                overflow: 'hidden',
              }}>
                {gaps.scopedIssues.length === 0 ? (
                  <div style={{ padding: '12px 14px', fontSize: 12, color: 'var(--text3)' }}>
                    No integrity issues found in your scope.
                  </div>
                ) : (
                  <div className="issue-list" style={{ margin: 0, borderRadius: 0 }}>
                    {gaps.scopedIssues.slice(0, 30).map(function(iss, i) {
                      return (
                        <div key={i} className="issue-item">
                          <span className="issue-badge">{iss.table}</span>
                          <span style={{ color: 'var(--amber)', fontSize: 11 }}>{iss.msg}</span>
                        </div>
                      );
                    })}
                    {gaps.scopedIssues.length > 30 && (
                      <div className="status-row status-warn">
                        ...and {gaps.scopedIssues.length - 30} more
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>

        </div>
      )}
    </div>
  );
}

function ExportScreen() {
  const { data, isMaster, stewardIdentity, canEdit } = useApp();
  const [includeSoftDeleted, setIncludeSoftDeleted] = useState(false);
  const [exporting,          setExporting]          = useState(false);
  const [exportingGroup,     setExportingGroup]     = useState(null);
  const [exportingMaster,    setExportingMaster]    = useState(false);
  const [baseVersion,        setBaseVersion]        = useState(() => loadBaseVersion());
  const [baseSnapshot,       setBaseSnapshot]       = useState(() => loadBaseSnapshot());
  const [exportingDelta,     setExportingDelta]     = useState(false);

  const handleExportMaster = async () => {
    setExportingMaster(true);
    try {
      const current = loadBaseVersion();
      const version = nextMasterVersion(current);
      const payload = {
        _type:        'master',
        _version:     version,
        _exported_at: new Date().toISOString(),
        data,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const saved = await saveWithPicker(blob, `dq_master_${version}.json`, 'JSON File', '.json');
      if (saved) { saveBaseVersion(version); setBaseVersion(version); }
    } finally { setExportingMaster(false); }
  };

  const handleExportDelta = () => {
    setExportingDelta(true);
    try {
      const snapshot = loadBaseSnapshot();
      const version  = loadBaseVersion();
      const changes  = buildDelta(data, snapshot || {});
      const totalChanges = Object.values(changes)
        .reduce((s, c) => s + c.inserted.length + c.updated.length + c.retired.length, 0);
      const payload = {
        _type:         'delta',
        _steward_id:   stewardIdentity.id,
        _steward_name: stewardIdentity.name,
        _base_version: version || 'unknown',
        _exported_at:  new Date().toISOString(),
        _total_changes: totalChanges,
        changes,
      };
      const ts   = new Date().toISOString().replace(/[:\-T.Z]/g,'').slice(0,14);
      const name = `dq_delta_${stewardIdentity.name.replace(/\s+/g,'_')}_${ts}.json`;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = name; a.click();
      URL.revokeObjectURL(url);
    } finally { setExportingDelta(false); }
  };

  const allTables = Object.keys(SCHEMA);
  const counts = useMemo(() => {
    const out = {};
    for (const t of allTables) {
      const rows = data[t] || [];
      out[t] = includeSoftDeleted ? rows.length : rows.filter(r => !r.retiring_timestamp).length;
    }
    return out;
  }, [data, includeSoftDeleted]);
  const total = Object.values(counts).reduce((s,n) => s+n, 0);

  const handleExportAll = async () => {
    setExporting(true);
    try {
      const { blob, filename } = await buildAllCSVsBlob(data, includeSoftDeleted);
      await saveWithPicker(blob, filename, 'ZIP Archive', '.zip');
    } finally { setExporting(false); }
  };
  const handleExportGroup = async (group) => {
    setExportingGroup(group.id);
    try {
      const zip = new JSZip();
      const ts = new Date().toISOString().replace(/[:\-T.Z]/g,'').slice(0,14);
      const folder = zip.folder(`dq_export_${group.id}_${ts}`);
      for (const t of group.tables) folder.file(`${t}.csv`, tableToCSV(t, data, includeSoftDeleted));
      const blob = await zip.generateAsync({ type:'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `dq_export_${group.id}_${ts}.zip`; a.click();
      URL.revokeObjectURL(url);
    } finally { setExportingGroup(null); }
  };

  return (
    <div className="fade-in">
      <div className="page-title">Export</div>
      <div className="page-sub">Download individual CSVs or the full dataset as a zip for AWS import.</div>

      {/* Delta export -- steward copies only */}
      {!isMaster && stewardIdentity && (
        <div className="card" style={{ marginBottom:20, borderLeft:'3px solid var(--accent)' }}>
          <div className="card-title">
            <span style={{ width:3, height:14, borderRadius:2,
              background:'var(--accent)', display:'inline-block', marginRight:8 }}/>
            Delta export
            <span style={{ fontSize:9, fontFamily:'var(--mono)', fontWeight:700,
              color:'var(--accent)', background:'var(--accent-tint)',
              border:'1px solid var(--accent-border)',
              borderRadius:3, padding:'1px 6px', marginLeft:8 }}>
              STEWARD
            </span>
          </div>
          {!baseSnapshot ? (
            <div style={{ fontSize:12, color:'var(--amber)', padding:'8px 12px',
              background:'var(--amber-bg)', borderRadius:'var(--radius)' }}>
              No base snapshot found. Re-import from a master JSON file to enable delta export.
            </div>
          ) : (
            <>
              <div style={{ fontSize:11, color:'var(--text3)', marginBottom:10 }}>
                Exports only your changes since the last master import as a JSON delta file
                for the master steward to review and merge.
              </div>
              <div style={{ fontSize:11, fontFamily:'var(--mono)', color:'var(--text3)',
                marginBottom:12 }}>
                Base version: <span style={{ color:'var(--accent)' }}>{loadBaseVersion() || 'unknown'}</span>
              </div>
              <button className="btn btn-primary" onClick={handleExportDelta}
                disabled={exportingDelta}>
                <Icon.Download/>
                {exportingDelta ? 'Preparing...' : 'Export my delta'}
              </button>
            </>
          )}
        </div>
      )}

      {/* Master JSON export -- master copy only */}
      {isMaster && (
        <div className="card" style={{ marginBottom:20,
          borderLeft:'3px solid #f5a623' }}>
          <div className="card-title">
            <span style={{ width:3, height:14, borderRadius:2,
              background:'var(--amber)', display:'inline-block', marginRight:8 }}/>
            Master export
            <span style={{ fontSize:9, fontFamily:'var(--mono)', fontWeight:700,
              color:'var(--amber)', background:'rgba(245,166,35,0.12)',
              border:'1px solid rgba(245,166,35,0.4)',
              borderRadius:3, padding:'1px 6px', marginLeft:8 }}>
              MASTER
            </span>
          </div>
          <div style={{ fontSize:11, color:'var(--text3)', marginBottom:10 }}>
            Exports the full dataset as a versioned JSON master file for distribution to stewards.
            Each export increments the version counter.
          </div>
          {baseVersion && (
            <div style={{ fontSize:11, fontFamily:'var(--mono)', color:'var(--text3)',
              marginBottom:10 }}>
              Current version: <span style={{ color:'var(--amber)' }}>{baseVersion}</span>
            </div>
          )}
          <button className="btn btn-primary" onClick={handleExportMaster}
            disabled={exportingMaster}
            style={{ background:'var(--amber)', borderColor:'var(--amber)', color:'#000' }}>
            <Icon.Download/>
            {exportingMaster ? 'Preparing...' : `Export master JSON${baseVersion ? ` (next: ${nextMasterVersion(baseVersion)})` : ''}`}
          </button>
        </div>
      )}

      {!canEdit && (
        <div style={{ marginBottom:20, padding:'10px 14px', background:'var(--amber-bg)',
          border:'1px solid rgba(245,166,35,0.4)', borderRadius:'var(--radius)',
          fontSize:12, color:'var(--amber)' }}>
          Exports are disabled in read-only mode. Register as a steward to enable exports.
        </div>
      )}

      <div className="card" style={{ marginBottom:20 }}>
        <div className="card-title"><span className="dot"/>Export configuration</div>
        <div className="toggle-row" style={{ borderTop:'none', marginTop:0, paddingTop:0 }}>
          <label className="toggle">
            <input type="checkbox" checked={includeSoftDeleted} onChange={e => setIncludeSoftDeleted(e.target.checked)}/>
            <div className="toggle-track"/><div className="toggle-thumb"/>
          </label>
          <span className="toggle-label">Include soft-deleted records</span>
          <span style={{ marginLeft:'auto' }} className={`badge ${includeSoftDeleted?'badge-amber':'badge-green'}`}>
            {includeSoftDeleted?'all records':'live only'}
          </span>
        </div>
        <div style={{ marginTop:12, padding:'8px 12px', background:'var(--bg)', borderRadius:'var(--radius)',
          fontSize:11, color:'var(--text3)', fontFamily:'var(--mono)' }}>
          {allTables.length} CSV files - {total.toLocaleString()} total records - bundled as dq_export_YYYYMMDD_HHMMSS.zip
        </div>
        <div style={{ marginTop:12 }}>
          <button className="btn btn-green" onClick={handleExportAll} disabled={exporting || !canEdit}>
            <Icon.Download/>{exporting?'Preparing zip...':`Export all ${allTables.length} tables as zip`}
          </button>
        </div>
      </div>

      {TABLE_GROUPS.map(group => {
        const groupTotal = group.tables.reduce((s,t) => s+(counts[t]||0), 0);
        const isExp = exportingGroup===group.id;
        return (
          <div key={group.id} style={{ marginBottom:20 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10,
              marginBottom:8, paddingBottom:8, borderBottom:'1px solid var(--border)' }}>
              <div style={{ width:3, height:16, borderRadius:2, background:group.accent }}/>
              <span style={{ fontSize:13, fontWeight:600 }}>{group.label}</span>
              <span style={{ fontSize:11, color:'var(--text3)' }}>{group.tables.length} tables - {groupTotal.toLocaleString()} rows</span>
              <div style={{ marginLeft:'auto' }}>
                <button className="btn btn-ghost" style={{ padding:'2px 7px', fontSize:11 }}
                  onClick={() => handleExportGroup(group)} disabled={isExp || !canEdit}
                  title={`Download ${group.label}`}>
                  <Icon.Download/>
                </button>
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
              {group.tables.map(t => (
                <div key={t} style={{ display:'flex', alignItems:'center',
                  padding:'7px 12px', background:'var(--bg2)',
                  border:'1px solid var(--border)', borderLeft:`3px solid ${group.accent}`,
                  borderRadius:'var(--radius)', gap:10 }}>
                  <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text2)', flex:1 }}>{t}.csv</div>
                  <div style={{ fontSize:11, color:'var(--text3)', minWidth:55, textAlign:'right' }}>{counts[t].toLocaleString()} rows</div>
                  <button className="btn btn-ghost" style={{ padding:'2px 7px', fontSize:11 }}
                    onClick={() => exportSingleCSV(t, data, includeSoftDeleted)}
                    disabled={!canEdit} title={`Download ${t}.csv`}>
                    <Icon.Download/>
                  </button>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// TASK 5b -- BREADCRUMB
// ===============================================================================
function Breadcrumb({ route }) {
  if (route.screen === 'dashboard') return null;
  if (route.screen === 'import')    return null;
  if (route.screen === 'rulenav') {
    return (
      <div className="breadcrumb">
        <span style={{ color:'var(--green)' }}>Data Quality Elements</span>
        <span className="breadcrumb-sep">&#x203a;</span>
        <span className="breadcrumb-current">Rules Explorer</span>
      </div>
    );
  }
  if (route.screen === 'orgchart') {
    return (
      <div className="breadcrumb">
        <span style={{ color:'#18b4d4' }}>Ownership Hierarchy</span>
        <span className="breadcrumb-sep">&#x203a;</span>
        <span className="breadcrumb-current">Organisation</span>
      </div>
    );
  }
  if (route.screen === 'export') {
    return (
      <div className="breadcrumb">
        <span className="breadcrumb-current">Export</span>
      </div>
    );
  }
  if (route.screen === 'assistant') {
    return (
      <div className="breadcrumb">
        <span style={{ color:'var(--accent)' }}>AI Tools</span>
        <span className="breadcrumb-sep">&#x203a;</span>
        <span className="breadcrumb-current">DQ Assistant</span>
      </div>
    );
  }
  if (route.screen === 'table' && route.table) {
    const group      = TABLE_GROUPS.find(g => g.tables.includes(route.table));
    const schema     = SCHEMA[route.table];
    const crumbLabel = route.table === 'critical_data_element' ? 'Data and Stewardship' : schema?.label;
    return (
      <div className="breadcrumb">
        {group && <><span style={{ color:group.accent }}>{group.label}</span><span className="breadcrumb-sep">&#x203a;</span></>}
        <span className="breadcrumb-current">{crumbLabel}</span>
      </div>
    );
  }
  return null;
}

// ===============================================================================
// ROOT APP -- single source of state, also provides AppContext directly
// ===============================================================================
function App() {
  // -- Core state ------------------------------------------
  const stored = useMemo(() => loadFromStorage(), []);
  const [data,         setData]         = useState(stored?.data || null);
  const [savedAt,      setSavedAt]      = useState(stored?.savedAt || null);
  const [route,        setRoute]        = useState(() =>
    stored?.data ? { screen:'dashboard', table:null } : { screen:'import', table:null }
  );
  const [resetStage,        setResetStage]        = useState(0); // 0=hidden, 1=first confirm, 2=second confirm (pending changes)
  const [resetPendingCount, setResetPendingCount] = useState(0);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => loadSidebarPrefs().collapsed);

  // -- Lookups rebuild whenever data changes ----------------
  const lookups = useMemo(() => data ? buildLookups(data) : {}, [data]);

  // -- Persist helper ---------------------------------------
  const persist = useCallback((newData) => {
    saveToStorage(newData);
    setSavedAt(new Date().toISOString());
  }, []);

  // -- Context operations -----------------------------------
  const updateTable = useCallback((tableName, rows) => {
    setData(prev => { const n = {...prev, [tableName]:rows}; persist(n); return n; });
  }, [persist]);

  const upsertRecord = useCallback((tableName, record) => {
    if (!stewardIdentity) return;
    const pk = SCHEMA[tableName]?.pk;
    if (!pk) return;
    setData(prev => {
      const rows = prev[tableName] || [];
      const idx  = rows.findIndex(r => r[pk] === record[pk]);
      const next = idx >= 0 ? [...rows.slice(0,idx), record, ...rows.slice(idx+1)] : [...rows, record];
      const n = {...prev, [tableName]:next}; persist(n); return n;
    });
  }, [persist, stewardIdentity]);

  const retireRecord = useCallback((tableName, pkValue) => {
    if (!stewardIdentity) return;
    const pk = SCHEMA[tableName]?.pk;
    if (!pk) return;
    setData(prev => {
      const rows = prev[tableName] || [];
      const next = rows.map(r => r[pk]===pkValue ? {...r, retiring_timestamp:new Date().toISOString()} : r);
      const n = {...prev, [tableName]:next}; persist(n); return n;
    });
  }, [persist, stewardIdentity]);

  const restoreRecord = useCallback((tableName, pkValue) => {
    if (!stewardIdentity) return;
    const pk = SCHEMA[tableName]?.pk;
    if (!pk) return;
    setData(prev => {
      const rows = prev[tableName] || [];
      const next = rows.map(r => r[pk]===pkValue ? {...r, retiring_timestamp:null} : r);
      const n = {...prev, [tableName]:next}; persist(n); return n;
    });
  }, [persist, stewardIdentity]);

  const nextPk = useCallback((tableName) => {
    const pk = SCHEMA[tableName]?.pk;
    if (!pk || !data) return 1;
    const rows = data[tableName] || [];

    // Steward namespace: steward_id * 1000000 + sequence
    // Master or unidentified: standard max+1 sequence
    if (stewardIdentity && !isMaster) {
      const ns      = stewardIdentity.id * 1000000;
      const nsMax   = rows
        .filter(r => (r[pk] ?? 0) > ns && (r[pk] ?? 0) < ns + 1000000)
        .reduce((m, r) => Math.max(m, r[pk] ?? 0), ns);
      return nsMax + 1;
    }
    return rows.reduce((m, r) => Math.max(m, r[pk] ?? 0), 0) + 1;
  }, [data, stewardIdentity, isMaster]);

  const designateAsMaster = useCallback((stewardDsId) => {
    setData(prev => {
      const rows  = (prev && prev.stewardship) ? prev.stewardship : [];
      const maxPk = rows.reduce((m, r) => Math.max(m, r.stewardship_id ?? 0), 0);
      const rec   = {
        stewardship_id:       maxPk + 1,
        critical_data_set_id: 0,
        data_steward_id:      stewardDsId,
        retiring_timestamp:   null,
      };
      const n = { ...prev, stewardship: [...rows, rec] };
      persist(n);
      return n;
    });
  }, [persist]);

  // -- Navigation & import ----------------------------------
  const navigate = useCallback((newRoute) => setRoute(newRoute), []);

  const handleImport = useCallback((importedData) => {
    setData(importedData);
    persist(importedData);
    setRoute({ screen:'dashboard', table:null });
  }, [persist]);

  const handleDeltaMerge = useCallback((mergedData) => {
    setData(mergedData);
    persist(mergedData);
  }, [persist]);

  const handleReset = () => {
    clearStorage();
    setData(null);
    setSavedAt(null);
    setRoute({ screen:'import', table:null });
    setResetStage(0);
  };

  const handleShowReset = () => {
    if (resetStage > 0) { setResetStage(0); return; }
    let count = 0;
    if (!isMaster) {
      const snapshot = loadBaseSnapshot();
      if (snapshot) {
        const changes = buildDelta(data || {}, snapshot);
        count = Object.values(changes).reduce(
          (s, t) => s + t.inserted.length + t.updated.length + t.retired.length, 0
        );
      }
    }
    setResetPendingCount(count);
    setResetStage(1);
  };

  // -- Sidebar collapse callback (passed to Sidebar) --------
  const onSidebarToggle = useCallback((collapsed) => {
    setSidebarCollapsed(collapsed);
  }, []);

  // -- Global form panel state (lifted above scroll container)
  const [formRecord,   setFormRecord]   = useState(null);
  const [formTable,    setFormTable]    = useState(null);
  const openForm  = useCallback((tableName, record) => {
    if (!stewardIdentity) return;
    setFormTable(tableName); setFormRecord(record);
  }, [stewardIdentity]);
  const closeForm = useCallback(() => {
    setFormTable(null); setFormRecord(null);
  }, []);
  const handleFormSave = useCallback((record) => {
    upsertRecord(formTable, record); closeForm();
  }, [formTable, upsertRecord, closeForm]);

  const handleCdsSave = useCallback((record) => {
    const stewardId            = record.__stewardId ?? null;
    const addStewardId         = record.__addStewardId ?? null;
    const removeStewardshipIds = record.__removeStewardshipIds ?? [];
    const cdsRecord = { ...record };
    delete cdsRecord.__stewardId;
    delete cdsRecord.__addStewardId;
    delete cdsRecord.__removeStewardshipIds;
    upsertRecord('critical_data_set', cdsRecord);
    if (stewardId) {
      upsertRecord('stewardship', {
        stewardship_id:       nextPk('stewardship'),
        critical_data_set_id: cdsRecord.critical_data_set_id,
        data_steward_id:      stewardId,
        retiring_timestamp:   null,
      });
    }
    for (const sid of removeStewardshipIds) retireRecord('stewardship', sid);
    if (addStewardId) {
      upsertRecord('stewardship', {
        stewardship_id:       nextPk('stewardship'),
        critical_data_set_id: cdsRecord.critical_data_set_id,
        data_steward_id:      addStewardId,
        retiring_timestamp:   null,
      });
    }
    closeForm();
  }, [upsertRecord, retireRecord, nextPk, closeForm]);

  const handleAgencySave = useCallback((record) => {
    const newPatron      = record.__newPatron      ?? null;
    const reassignPatron = record.__reassignPatron ?? null;
    const removePatrons  = record.__removePatrons  ?? [];
    const patronPk       = newPatron?.name ? nextPk('data_patron') : null;
    const agencyRecord   = { ...record };
    delete agencyRecord.__newPatron;
    delete agencyRecord.__reassignPatron;
    delete agencyRecord.__removePatrons;

    upsertRecord('executive_agency', agencyRecord);

    if (newPatron?.name) {
      upsertRecord('data_patron', {
        data_patron_id:        patronPk,
        executive_agency_id:   agencyRecord.executive_agency_id,
        data_patron_name:      newPatron.name,
        data_patron_title:     newPatron.title     || null,
        data_patron_email:     newPatron.email     || null,
        assignment_start_date: newPatron.startDate,
        retiring_timestamp:    null,
      });
    }

    if (reassignPatron) {
      upsertRecord('data_patron', {
        ...reassignPatron,
        executive_agency_id: agencyRecord.executive_agency_id,
      });
    }

    for (const p of removePatrons) {
      upsertRecord('data_patron', p);
    }

    closeForm();
  }, [upsertRecord, nextPk, closeForm]);

  const [critFormCdeId,     setCritFormCdeId]     = useState(null);
  const [critFormRows,      setCritFormRows]      = useState(null);
  const [critFormPreAgency, setCritFormPreAgency] = useState(null);
  const [critFormPreDir,    setCritFormPreDir]    = useState(null);
  const [critFormPreCds,    setCritFormPreCds]    = useState(null);
  const openCritForm  = useCallback((cdeId, rows, preAgencyId, preDirId, preCdsId) => {
    if (!stewardIdentity) return;
    setCritFormCdeId(cdeId);
    setCritFormRows(rows);
    setCritFormPreAgency(preAgencyId ?? null);
    setCritFormPreDir(preDirId ?? null);
    setCritFormPreCds(preCdsId ?? null);
  }, [stewardIdentity]);
  const closeCritForm = useCallback(() => {
    setCritFormCdeId(null); setCritFormRows(null);
    setCritFormPreAgency(null); setCritFormPreDir(null); setCritFormPreCds(null);
  }, []);

  // Rule allocation form state
  const [allocFormRecord, setAllocFormRecord] = useState(null);
  const [allocFormIsEdit, setAllocFormIsEdit] = useState(false);
  const openAllocForm  = useCallback((record, isEdit) => {
    if (!stewardIdentity) return;
    setAllocFormRecord(record); setAllocFormIsEdit(!!isEdit);
  }, [stewardIdentity]);

  // CDE form state
  const [cdeFormRecord,   setCdeFormRecord]   = useState(null);
  const [cdeFormIsEdit,   setCdeFormIsEdit]   = useState(false);
  const [cdeFormPreCdsId, setCdeFormPreCdsId] = useState(null);
  const [cdeFormPreTable, setCdeFormPreTable] = useState(null);
  const [cdeFormPreDb,    setCdeFormPreDb]    = useState(null);
  const openCdeForm = useCallback((record, isEdit, preCdsId, preTable, preDb) => {
    if (!stewardIdentity) return;
    setCdeFormRecord(record); setCdeFormIsEdit(!!isEdit);
    setCdeFormPreCdsId(preCdsId ?? null); setCdeFormPreTable(preTable ?? null);
    setCdeFormPreDb(preDb ?? null);
  }, [stewardIdentity]);
  const closeCdeForm = useCallback(() => {
    setCdeFormRecord(null); setCdeFormIsEdit(false);
    setCdeFormPreCdsId(null); setCdeFormPreTable(null); setCdeFormPreDb(null);
  }, []);
  const handleCdeSave = useCallback((record) => {
    const crits = record.__criticalities ?? null;
    const cdeRecord = { ...record };
    delete cdeRecord.__criticalities;
    upsertRecord('critical_data_element', cdeRecord);
    if (crits) {
      for (const crit of crits) upsertRecord('cde_criticality', crit);
    }
    closeCdeForm();
  }, [upsertRecord, closeCdeForm]);
  const closeAllocForm = useCallback(() => {
    setAllocFormRecord(null); setAllocFormIsEdit(false);
  }, []);
  const handleAllocSave = useCallback((record) => {
    upsertRecord('data_quality_rule_allocation', record); closeAllocForm();
  }, [upsertRecord, closeAllocForm]);

  // DDL form state
  const [ddlFormRecord, setDdlFormRecord] = useState(null);
  const openDdlForm  = useCallback((record) => {
    if (!stewardIdentity) return;
    setDdlFormRecord(record ?? null);
  }, [stewardIdentity]);
  const closeDdlForm = useCallback(() => setDdlFormRecord(null), []);
  const handleDdlSave = useCallback((record) => {
    upsertRecord('source_table_ddl', record); closeDdlForm();
  }, [upsertRecord, closeDdlForm]);

  // Global SQL panel state
  const [sqlPanel,    setSqlPanel]    = useState(null);
  const openSqlPanel  = useCallback((panel) => setSqlPanel(panel), []);
  const closeSqlPanel = useCallback(() => setSqlPanel(null), []);

  // -- Derived ----------------------------------------------
  const totalRows = data ? Object.values(data).reduce((s,arr) => s+(arr?.length||0), 0) : 0;
  const hasData   = !!data;

  // -- Master detection -------------------------------------
  const [stewardIdentity, setStewardIdentityState] = useState(() => loadStewardIdentity());

  // Re-read steward identity when storage changes (settings panel writes it)
  useEffect(() => {
    const handler = () => setStewardIdentityState(loadStewardIdentity());
    window.addEventListener('storage', handler);
    return () => window.removeEventListener('storage', handler);
  }, []);

  const isMaster = useMemo(() => {
    if (!stewardIdentity || !data) return false;
    return (data.stewardship || []).some(s =>
      s.critical_data_set_id === 0 &&
      s.data_steward_id === stewardIdentity.id &&
      !s.retiring_timestamp
    );
  }, [data, stewardIdentity]);

  // -- Context value ----------------------------------------
  const ctxValue = useMemo(() => ({
    data, lookups, savedAt, hasData,
    updateTable, upsertRecord, retireRecord, restoreRecord, nextPk, designateAsMaster,
    openForm, openCritForm, openSqlPanel, openAllocForm, openCdeForm, navigate, openDdlForm,
    isMaster, stewardIdentity,
    canEdit: !!stewardIdentity,
  }), [data, lookups, savedAt, hasData, updateTable, upsertRecord, retireRecord, restoreRecord, nextPk, designateAsMaster, openForm, openCritForm, openSqlPanel, openAllocForm, openCdeForm, navigate, openDdlForm, isMaster, stewardIdentity]);

  // -- Screen renderer --------------------------------------
  const renderScreen = () => {
    if (!data && route.screen !== 'import') {
      return <NoDataScreen onNavigateImport={() => navigate({ screen:'import', table:null })}/>;
    }
    switch (route.screen) {
      case 'import':    return <ImportScreen onImport={handleImport} onMerge={handleDeltaMerge}/>;
      case 'rulegenerator': return <DataRuleGeneratorScreen/>;
      case 'assistant':     return <AssistantScreen/>;
      case 'coverage':    return <CDECoverageScreen/>;
      case 'simulator':   return <DQSimulatorScreen/>;
      case 'dashboard': return <DashboardScreen/>;
      case 'export':    return <ExportScreen/>;
      case 'orgchart':  return <OwnershipOrgChart/>;
      case 'rulenav':   return <RuleExplorerView/>;
      case 'table':     return route.table
        ? ((['criticality_group_weight','quality_dimension_weight'].includes(route.table))
            ? <AggregatedWeightView key={route.table} tableName={route.table}/>
            : route.table === 'directorate'
            ? <DirectorateView key="directorate"/>
            : route.table === 'critical_data_element'
            ? <CriticalDataElementView key={'cde_' + (route.initialSearch || '')} initialSearch={route.initialSearch || ''}/>
            : route.table === 'data_quality_rule_allocation'
            ? <RuleAllocationView key="data_quality_rule_allocation"/>
            : route.table === 'source_table_ddl'
            ? <DDLLibraryView key="source_table_ddl"/>
            : route.table === 'field_profiling'
            ? <FieldProfilingScreen key="field_profiling"/>
            : <GenericTableView key={route.table} tableName={route.table}/>)
        : null;
      default:          return null;
    }
  };

  return (
    <AppContext.Provider value={ctxValue}>
      <div style={{ display:'flex', flexDirection:'row', height:'100vh', width:'100vw', overflow:'hidden' }}>

        {/* Sidebar -- full height, left */}
        <Sidebar
          route={route}
          onNavigate={navigate}
          data={data}
          onToggle={onSidebarToggle}
        />

        {/* Right column -- header + content + footer */}
        <div style={{ display:'flex', flexDirection:'column', flex:'1 1 0', overflow:'hidden', minWidth:0, width:0 }}>

          <AppHeader
            savedAt={savedAt}
            totalRows={totalRows}
            onShowReset={handleShowReset}
            isMaster={isMaster}
            stewardIdentity={stewardIdentity}
          />

          <main className="content-area">
            {resetStage > 0 && (
              <div className="reset-confirm fade-in">
                <Icon.Warning/>
                {resetStage === 1 && resetPendingCount === 0 && (
                  <span>This will clear all data from localStorage. Are you sure?</span>
                )}
                {resetStage === 1 && resetPendingCount > 0 && (
                  <span>You have <strong>{resetPendingCount}</strong> unsaved delta change{resetPendingCount !== 1 ? 's' : ''} that have not been exported. Export your delta first to avoid losing them.</span>
                )}
                {resetStage === 2 && (
                  <span>Your {resetPendingCount} unsaved change{resetPendingCount !== 1 ? 's' : ''} will be permanently lost and cannot be recovered. Are you absolutely sure?</span>
                )}
                {resetStage === 1 && resetPendingCount === 0 && (
                  <button className="btn btn-danger" style={{ marginLeft:'auto' }} onClick={handleReset}>Yes, reset</button>
                )}
                {resetStage === 1 && resetPendingCount > 0 && (
                  <button className="btn btn-danger" style={{ marginLeft:'auto' }} onClick={() => setResetStage(2)}>Reset anyway</button>
                )}
                {resetStage === 2 && (
                  <button className="btn btn-danger" style={{ marginLeft:'auto' }} onClick={handleReset}>Yes, discard and reset</button>
                )}
                <button className="btn btn-ghost" onClick={() => setResetStage(0)}>Cancel</button>
              </div>
            )}
            <Breadcrumb route={route}/>
            {!stewardIdentity && data && (
              <div style={{ display:'flex', alignItems:'center', gap:8,
                padding:'6px 12px', marginBottom:12,
                background:'rgba(245,166,35,0.08)',
                border:'1px solid rgba(245,166,35,0.3)',
                borderRadius:'var(--radius)', fontSize:11, color:'var(--amber)' }}>
                <span style={{ width:14, height:14, flexShrink:0 }}><Icon.Warning/></span>
                Read-only mode - no steward identity set. Open Settings to select your identity before making changes.
              </div>
            )}
            {renderScreen()}
          </main>

          <AppFooter/>
        </div>
      </div>

      {/* SQL panel -- rendered at App level */}
      <SqlPanel panel={sqlPanel} onClose={closeSqlPanel}/>

      {/* DDL form -- rendered at App level */}
      {ddlFormRecord !== null && (
        <DDLFormPanel
          record={ddlFormRecord}
          onClose={closeDdlForm}
          onSave={handleDdlSave}
          nextPk={() => nextPk('source_table_ddl')}
          accent="#7c5cbf"
          data={data}
          stewardIdentity={stewardIdentity}
        />
      )}

      {/* CDE form -- rendered at App level */}
      {cdeFormRecord && (
        <CriticalDataElementFormPanel
          record={cdeFormRecord}
          isEdit={cdeFormIsEdit}
          preCdsId={cdeFormPreCdsId}
          preTableName={cdeFormPreTable}
          preDbName={cdeFormPreDb}
          onSave={handleCdeSave}
          onClose={closeCdeForm}
          data={data}
        />
      )}

      {/* Rule allocation form -- rendered at App level */}
      {allocFormRecord && (
        <RuleAllocationFormPanel
          record={allocFormRecord}
          isEdit={allocFormIsEdit}
          onSave={handleAllocSave}
          onClose={closeAllocForm}
          data={data}
        />
      )}

      {/* Form panel -- rendered at App level, outside scroll container */}
      {formRecord && formTable && (
        formTable === 'critical_data_set' ? (
          <CdsFormPanel
            record={formRecord}
            onSave={handleCdsSave}
            onClose={closeForm}
            data={data}
            stewardIdentity={stewardIdentity}

function loadAssistantState() {

    return {
      rule_intent:       s.rule_intent       || '',

      extra_table_ids:   s.extra_table_ids   || [],
      conversation_mode: s.conversation_mode || 'business',
      proposals:         s.proposals         || [],
      saved_at:          s.saved_at          || null,
    };
  } catch { return null; }
}

function saveAssistantState(state) {
  try {
    localStorage.setItem(ASSISTANT_STORAGE_KEY, JSON.stringify({
      rule_intent:       state.rule_intent       || '',
      cde_ids:           state.cde_ids           || [],
      extra_table_ids:   state.extra_table_ids   || [],
      conversation_mode: state.conversation_mode || 'business',
      proposals:         state.proposals         || [],

    }));
    window.dispatchEvent(new Event('storage'));
  } catch {}
}

function clearAssistantState() {
  try {
    localStorage.removeItem(ASSISTANT_STORAGE_KEY);
    window.dispatchEvent(new Event('storage'));
  } catch {}
}

function suggestCdes(ruleIntentText, data) {
  if (!ruleIntentText || !data) return [];
  const cdes = (data.critical_data_element || []).filter(c => !c.retiring_timestamp);
  const tokens = ruleIntentText.toLowerCase().split(/[^a-z]+/).filter(t => t.length >= 3);
  if (tokens.length === 0) return [];
  const scored = cdes.map(cde => {
    const hay = [
      cde.source_field_name        || '',
      cde.source_table_name        || '',
      cde.source_system_name       || '',
      cde.source_database_name     || '',
      cde.data_element_definition  || '',
      cde.data_element_explanation || '',
    ].join(' ').toLowerCase();
    const score = tokens.reduce((s, t) => s + (hay.includes(t) ? 1 : 0), 0);
    return { cde, score };
  });
  return scored
    .filter(s => s.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 8)
    .map(s => s.cde);
}

function buildSchemaSection(selectedCdeIds, extraTableIds, conversationMode, data) {
  const cdes  = (data.critical_data_element || []).filter(c => !c.retiring_timestamp);
  const ddls  = (data.source_table_ddl      || []).filter(d => !d.retiring_timestamp);
  const lines = ['## CONTEXT: TABLE STRUCTURE', ''];

  const primaryTableNames = new Set();
  if (selectedCdeIds && selectedCdeIds.length > 0) {
    selectedCdeIds.forEach(id => {
      const cde = cdes.find(c => c.critical_data_element_id === id);
      if (cde && cde.source_table_name) primaryTableNames.add(cde.source_table_name);
    });
  }

  const addedDdlIds = new Set();

  primaryTableNames.forEach(tblName => {
    const ddl = ddls.find(d => d.source_table_name === tblName);
    if (ddl) {
      addedDdlIds.add(ddl.source_table_ddl_id);
      const label = conversationMode === 'technical'
        ? '(primary -- referenced by selected CDE)'
        : '(contains the field in scope)';
      lines.push('### ' + tblName + ' ' + label);
      let cols = [];
      try { cols = ddl.parsed_columns ? JSON.parse(ddl.parsed_columns) : []; } catch {}
      if (cols.length > 0) {
        cols.forEach(c => { lines.push(c.name + '  ' + c.type); });
      } else if (ddl.ddl_text) {
        lines.push('[Table profiling available but not yet parsed -- parse via Physical Layer screen]');
      }
      lines.push('');
    } else {
      lines.push('### ' + tblName + ' (contains the field in scope)');
      lines.push('No profiling data available. Perform table and CDE profiling  to provide schema context.');
      lines.push('');
    }
  });

  if (extraTableIds && extraTableIds.length > 0) {
    extraTableIds.forEach(id => {
      const ddl = ddls.find(d => d.source_table_ddl_id === id);
      if (!ddl || addedDdlIds.has(id)) return;
      addedDdlIds.add(id);
      lines.push('### ' + ddl.source_table_name + ' (related table)');
      let cols = [];
      try { cols = ddl.parsed_columns ? JSON.parse(ddl.parsed_columns) : []; } catch {}
      if (cols.length > 0) {
        lines.push('Columns: ' + cols.map(c => c.name).join(', '));
      }
      lines.push('');
    });
  }

  if (primaryTableNames.size === 0 && (!extraTableIds || extraTableIds.length === 0)) {
    lines.push('No data fields selected and no supplementary tables added.');
    lines.push('Add CDEs or supplementary tables to include schema context.');
    lines.push('');
  }

  lines.push('---');
  lines.push('');
  return lines.join('\n');
}

function buildProfilingSection(selectedCdeIds, data, compressed) {
  const cdes     = (data.critical_data_element || []).filter(c => !c.retiring_timestamp);
  const profiling = data.field_profiling || [];
  const lines    = ['## CONTEXT: DATA PROFILING', ''];

  if (!selectedCdeIds || selectedCdeIds.length === 0) {
    lines.push('No data fields selected. Profiling context is not available.');
    lines.push('');
    lines.push('---');
    lines.push('');
    return lines.join('\n');
  }

  const addedTables = new Set();
  let anyProfileFound = false;

  selectedCdeIds.forEach(id => {
    const cde = cdes.find(c => c.critical_data_element_id === id);
    if (!cde) return;
    const tblKey = (cde.source_database_name || '') + '|||' + (cde.source_table_name || '');
    if (addedTables.has(tblKey)) return;
    addedTables.add(tblKey);

    const tableProfiles = profiling.filter(p =>
      !p.retiring_timestamp &&
      p.source_database_name === cde.source_database_name &&
      p.source_table_name    === cde.source_table_name
    );

    lines.push('### ' + (cde.source_table_name || 'unknown'));
    if (tableProfiles.length === 0) {
      lines.push('No profiling data is available for this table yet. If statistics would help define');
      lines.push('a realistic threshold, ask the steward or capture profiling via the DDL screen.');
      lines.push('');
      return;
    }

    anyProfileFound = true;
    tableProfiles.forEach(p => {
      lines.push('Field: ' + (p.source_field_name || 'unknown'));
      if (p.summary_raw && !compressed) {
        lines.push(p.summary_raw);
      }
      if (!compressed && p.top_values_raw) {
        lines.push('Top values:');
        lines.push(p.top_values_raw);
      }
      if (!compressed && p.profiling_notes) {
        lines.push('Notes: ' + p.profiling_notes);
      }
      lines.push('');
    });
  });

  if (!anyProfileFound) {
    lines.push('No profiling data is available for the selected fields.');
    lines.push('');
  }

  lines.push('---');
  lines.push('');
  return lines.join('\n');
}

function buildDimensionsSection(conversationMode, data) {

function buildExistingRulesSection(selectedCdeIds, conversationMode, data) {
  const allocs = data.data_quality_rule_allocation || [];
  const rules  = data.data_quality_rule            || [];
  const dims   = data.quality_dimension            || [];
  const lines  = [];

  let relevant = [];
  if (selectedCdeIds && selectedCdeIds.length > 0) {
    relevant = allocs.filter(a =>
      !a.retiring_timestamp &&
      selectedCdeIds.includes(a.critical_data_element_id)
    );
  }

  if (conversationMode === 'technical') {
    lines.push('## CONTEXT: EXISTING RULES ON THESE CDEs');
    lines.push('');
    if (relevant.length === 0) {
      lines.push('No rules are currently allocated to these CDEs.');
    } else {
      lines.push('The following rules are already in place. Do not reproduce these.');
      lines.push('');
      relevant.forEach(a => {
        const rule = rules.find(r => r.data_quality_rule_id === a.data_quality_rule_id);
        const dim  = dims.find(d => d.quality_dimension_id  === a.quality_dimension_id);
        if (!rule) return;
        lines.push('Rule: ' + rule.rule_name + ' | Dimension: ' + (dim ? dim.dimension_name : 'unknown'));
        if (rule.sql_code) {
          const sql = rule.sql_code.length > 200 ? rule.sql_code.substring(0, 200) + '...' : rule.sql_code;
          lines.push('SQL: ' + sql);
        }
        lines.push('---');
      });
    }
  } else {
    lines.push('## CONTEXT: EXISTING CHECKS ON THESE FIELDS');
    lines.push('');
    if (relevant.length === 0) {
      lines.push('No quality checks are currently registered for these fields.');
    } else {
      lines.push('The following data quality checks are already in place for these fields.');
      lines.push('Do not reproduce these. Identify new checks that complement the existing ones.');
      lines.push('');
      relevant.forEach(a => {
        const rule = rules.find(r => r.data_quality_rule_id === a.data_quality_rule_id);
        const dim  = dims.find(d => d.quality_dimension_id  === a.quality_dimension_id);
        if (!rule) return;
        lines.push('Check: ' + rule.rule_name + ' (' + (dim ? dim.dimension_name : 'unknown') + ')');
        if (rule.rule_explanation) lines.push('Description: ' + rule.rule_explanation);
        lines.push('---');
      });
    }
  }

  lines.push('');
  lines.push('---');
  lines.push('');
  return lines.join('\n');
}

function buildAssistantPrompt(ruleIntent, selectedCdeIds, extraTableIds, conversationMode, data) {
  const mode = conversationMode || 'business';

  const sections = [
    buildHeaderSection(mode),
    buildRoleSection(),
    buildConversationModeSection(mode),
    buildRuleIntentSection(ruleIntent, selectedCdeIds, data),
    buildCdeSection(selectedCdeIds, mode, data),
    buildSchemaSection(selectedCdeIds, extraTableIds, mode, data),
    buildProfilingSection(selectedCdeIds, data, false),
    buildDimensionsSection(mode, data),
    buildExistingRulesSection(selectedCdeIds, mode, data),
    buildConversationInstructionsSection(mode),
    buildOutputFormatSection(mode),
  ];

  let promptText = sections.join('');
  const charCount = promptText.length;

  // Truncation: if over 6000 chars, rebuild with compressed profiling
  if (charCount > 6000) {
    const compressed = [
      buildHeaderSection(mode),
      buildRoleSection(),
      buildConversationModeSection(mode),
      buildRuleIntentSection(ruleIntent, selectedCdeIds, data),
      buildCdeSection(selectedCdeIds, mode, data),
      buildSchemaSection(selectedCdeIds, extraTableIds, mode, data),
      buildProfilingSection(selectedCdeIds, data, true),
      buildDimensionsSection(mode, data),
      buildExistingRulesSection(selectedCdeIds, mode, data),
      buildConversationInstructionsSection(mode),
      buildOutputFormatSection(mode),
    ].join('');
    if (compressed.length < charCount) promptText = compressed;
  }

  const finalCount = promptText.length;
  const truncated  = finalCount < charCount;

  // Context summary for UI display
  const selCdes = selectedCdeIds || [];
  const cdes    = (data.critical_data_element || []).filter(c => !c.retiring_timestamp);
  const tableNames = new Set();
  selCdes.forEach(id => {
    const cde = cdes.find(c => c.critical_data_element_id === id);
    if (cde && cde.source_table_name) tableNames.add(cde.source_table_name);
  });
  (extraTableIds || []).forEach(id => {
    const ddl = (data.source_table_ddl || []).find(d => d.source_table_ddl_id === id);
    if (ddl && ddl.source_table_name) tableNames.add(ddl.source_table_name);
  });

  const contextSummary = {
    cdeCount:           selCdes.length,
    tableCount:         tableNames.size,
    dimensionCount:     (data.quality_dimension || []).filter(d => !d.retiring_timestamp).length,
    truncated:          truncated,
    veryLarge:          finalCount > 10000,
    conversationMode:   mode,
    cdeNames:           selCdes.map(id => {
      const c = cdes.find(x => x.critical_data_element_id === id);
      return c ? (c.source_field_name + ' (' + c.source_table_name + ')') : ('ID ' + id);
    }),
    tableNamesList:     Array.from(tableNames),
    dimensionNames:     (data.quality_dimension || [])
      .filter(d => !d.retiring_timestamp)
      .map(d => d.dimension_name),
  };

  return { promptText, characterCount: finalCount, contextSummary };
}

// ===============================================================================
// G4.3 -- SUPPLEMENTARY CONTEXT PROMPT
// ===============================================================================

function buildSupplementaryPrompt(tableIds, data) {
  const ddls  = (data.source_table_ddl  || []).filter(d => !d.retiring_timestamp);
  const prof  = (data.field_profiling   || []).filter(p => !p.retiring_timestamp);
  const lines = [
    'SUPPLEMENTARY CONTEXT -- please incorporate into our ongoing conversation',
    '',
    'The steward has provided additional data structure information:',
    '',
  ];

  tableIds.forEach(id => {
    const ddl = ddls.find(d => d.source_table_ddl_id === id);
    if (!ddl) return;
    lines.push('### ' + ddl.source_table_name);
    let cols = [];
    try { cols = ddl.parsed_columns ? JSON.parse(ddl.parsed_columns) : []; } catch {}
    if (cols.length > 0) {
      cols.forEach(c => lines.push(c.name + '  ' + c.type));
    }
    lines.push('');
    const tableProf = prof.filter(p =>
      p.source_database_name === ddl.source_database_name &&
      p.source_table_name    === ddl.source_table_name
    );
    if (tableProf.length > 0) {
      lines.push('Data profiling for ' + ddl.source_table_name + ':');
      tableProf.forEach(p => {
        lines.push('Field: ' + (p.source_field_name || 'unknown'));
        if (p.summary_raw) lines.push(p.summary_raw);
        lines.push('');
      });
    }
  });

  lines.push('Please continue the conversation with this additional context in mind.');
  return lines.join('\n');
}

// ===============================================================================
// G4.4 -- REFINEMENT PROMPT
// ===============================================================================

function buildRefinementPrompt(proposal, gaps) {
  const lines = [
    'REFINEMENT REQUEST -- please update the rule proposal below',
    '',
    'The following issues were found with the rule proposal you produced:',
  ];
  gaps.forEach(g => lines.push('- ' + g));
  lines.push('');
  lines.push('Original proposal:');
  lines.push('===RULE_PROPOSAL_START===');
  lines.push(JSON.stringify(proposal, null, 2));
  lines.push('===RULE_PROPOSAL_END===');
  lines.push('');
  lines.push('Please address the issues above and produce a corrected proposal in the same format.');
  return lines.join('\n');
}

// ===============================================================================
// G3.2 -- CLIPBOARD
// ===============================================================================

function copyToClipboard(text, onSuccess, onFail) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
      fallbackCopy(text, onSuccess, onFail);
    });
  } else {
    fallbackCopy(text, onSuccess, onFail);
  }
}

function fallbackCopy(text, onSuccess, onFail) {
  try {
    const el = document.createElement('textarea');
    el.value = text;
    el.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
    document.body.appendChild(el);
    el.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(el);
    if (ok) onSuccess(); else onFail && onFail();
  } catch { onFail && onFail(); }
}

// ===============================================================================
// G4.2 -- PROPOSAL PARSER
// ===============================================================================

function parseProposals(text) {
  if (!text || !text.trim()) return { proposals: [], notFound: true };

  const startDelim = '===RULE_PROPOSAL_START===';
  const endDelim   = '===RULE_PROPOSAL_END===';

  const blocks = [];
  let searchFrom = 0;
  while (true) {
    const startIdx = text.indexOf(startDelim, searchFrom);
    if (startIdx === -1) break;
    const endIdx = text.indexOf(endDelim, startIdx + startDelim.length);
    if (endIdx === -1) break;
    blocks.push(text.substring(startIdx + startDelim.length, endIdx).trim());
    searchFrom = endIdx + endDelim.length;
  }

  if (blocks.length === 0) return { proposals: [], notFound: true };

  const proposals = [];
  const errors    = [];
  const now       = new Date().toISOString();

  blocks.forEach((block, i) => {
    try {
      const parsed = JSON.parse(block);
      proposals.push({
        ...parsed,
        parsed_at:  now,
        committed:  false,
      });
    } catch (e) {
      errors.push({ index: i, message: 'JSON parse error: ' + e.message, raw: block });
    }
  });

  // Version check
  let versionMismatch = false;
  const versionMatch = text.match(/PROMPT_VERSION:\s*(\S+)/);
  if (versionMatch && versionMatch[1] !== PROMPT_VERSION) {
    versionMismatch = true;
  }

  // Detect mode
  let detectedMode = null;
  const modeMatch = text.match(/CONVERSATION_MODE:\s*(\S+)/);
  if (modeMatch) detectedMode = modeMatch[1].toLowerCase();

  return { proposals, errors, versionMismatch, detectedMode };
}

// ===============================================================================
// G5.1 -- PROPOSAL VALIDATOR
// ===============================================================================

function validateProposal(proposal, data) {
  const gaps    = [];
  const staleIds = [];
  const warns   = [];

  if (!proposal.rule_name || !proposal.rule_name.trim()) {
    gaps.push('rule_name is missing');
  }
  if (!proposal.rule_narrative || !proposal.rule_narrative.trim()) {
    gaps.push('rule_narrative is missing (the plain language description of the rule)');
  }
  if (!proposal.sql_code || !proposal.sql_code.trim()) {
    gaps.push('sql_code is missing');
  } else if (!/select/i.test(proposal.sql_code)) {
    gaps.push('sql_code does not appear to contain a SELECT statement');
  }
  if (proposal.quality_dimension_id === undefined || proposal.quality_dimension_id === null) {
    gaps.push('quality_dimension_id is missing');
  }
  if (proposal.bumper_value === undefined || proposal.bumper_value === null) {
    gaps.push('bumper_value is missing');
  } else if (proposal.bumper_value < 0 || proposal.bumper_value > 1) {
    gaps.push('bumper_value must be between 0 and 1');
  }
  if (!proposal.frequency || !['daily','weekly','monthly'].includes(proposal.frequency)) {
    gaps.push('frequency must be one of: daily, weekly, monthly');
  }
  if (!proposal.cde_id && !proposal.cde_suggestion) {
    gaps.push('cde_id or cde_suggestion must be provided');
  }

  // Non-blocking warning for missing examples
  if (!proposal.rule_examples || !Array.isArray(proposal.rule_examples) || proposal.rule_examples.length === 0) {
    warns.push('rule_examples not provided -- the AI did not give examples of failing records');
  }

  // Stale ID checks
  if (proposal.quality_dimension_id) {
    const dims = data.quality_dimension || [];
    const found = dims.find(d =>
      d.quality_dimension_id === proposal.quality_dimension_id && !d.retiring_timestamp
    );
    if (!found) {
      staleIds.push('quality_dimension_id ' + proposal.quality_dimension_id + ' not found in current store');
    }
  }
  if (proposal.cde_id) {
    const cdes = data.critical_data_element || [];
    const found = cdes.find(c =>
      c.critical_data_element_id === proposal.cde_id && !c.retiring_timestamp
    );
    if (!found) {
      staleIds.push('cde_id ' + proposal.cde_id + ' not found in current store (may be retired or unknown)');
    }
  }

  return {
    valid:    gaps.length === 0,
    gaps,
    staleIds,
    warns,
  };
}

// ===============================================================================
// G1.5 -- STAGE INDICATOR
// ===============================================================================

function StageIndicator({ stage, onNavigateStage }) {
  const stages = [
    { n: 1, label: 'Define' },
    { n: 2, label: 'Prompt' },
    { n: 3, label: 'Paste'  },
    { n: 4, label: 'Commit' },
  ];
  return (
    <div style={{ display:'flex', alignItems:'center', gap:0, marginBottom:28 }}>
      {stages.map((s, i) => {
        const done    = s.n < stage;
        const active  = s.n === stage;
        const clickable = done;
        return (
          <React.Fragment key={s.n}>
            <div
              onClick={() => clickable && onNavigateStage(s.n)}
              style={{
                display:'flex', alignItems:'center', gap:6,
                padding:'6px 14px',
                borderRadius:'var(--radius)',
                cursor: clickable ? 'pointer' : 'default',
                background: active ? 'rgba(24,180,212,0.1)' : 'transparent',
                border: active ? '1px solid var(--accent)' : '1px solid transparent',
                transition:'all 0.15s',
              }}
            >
              <div style={{
                width:22, height:22, borderRadius:'50%', flexShrink:0,
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:11, fontWeight:600, fontFamily:'var(--mono)',
                background: done ? 'var(--green-bg)' : active ? 'var(--accent)' : 'var(--bg3)',
                color: done ? 'var(--green)' : active ? '#fff' : 'var(--text3)',
                border: done ? '1px solid var(--green)' : active ? 'none' : '1px solid var(--border)',
              }}>
                {done ? <Icon.Check/> : s.n}
              </div>
              <span style={{
                fontSize:13,
                fontWeight: active ? 500 : 400,
                color: done ? 'var(--green)' : active ? 'var(--accent)' : 'var(--text3)',
                whiteSpace:'nowrap',
              }}>
                {s.label}
              </span>
            </div>
            {i < stages.length - 1 && (
              <div style={{
                flex:1, height:1, minWidth:16,
                background: s.n < stage ? 'var(--green)' : 'var(--border)',
                opacity: s.n < stage ? 0.5 : 1,
              }}/>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}
